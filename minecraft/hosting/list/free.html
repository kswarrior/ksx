<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KS Warrior • Free Game Hosting 2026</title>

<meta name="color-scheme" content="dark"/>
<meta name="theme-color" content="#000000"/>

<style>
:root{
  --bg:#000000;
  --card:rgba(18,18,28,0.94);
  --soft:rgba(28,28,40,0.96);
  --border:rgba(255,255,255,0.12);
  --text:#f8f9fa;
  --muted:#a0a0b0;
  --accent:#ffffff;
  --success:#4ade80;
  --warning:#f59e0b;
  --danger:#ef4444;
  --radius:14px;
  --gap:26px;
  --transition:all .4s cubic-bezier(.22,1,.36,1);
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  background:linear-gradient(135deg,#000 0%,#0a0a0f 100%);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  min-height:100dvh;
  overflow-x:hidden;
}

main{
  max-width:1400px;
  margin:auto;
  padding:28px 14px;
  animation:fadeIn .8s ease-out;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(18px)}
  to{opacity:1;transform:none}
}

.title{
  text-align:center;
  font-size:clamp(2rem,6vw,2.8rem);
  font-weight:900;
  letter-spacing:-1px;
  margin-bottom:2.2rem;
  background:linear-gradient(90deg,#e5e7eb,#fff,#d1d5db);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-size:200% auto;
  animation:shine 6s linear infinite;
}

@keyframes shine{to{background-position:200% center}}

.filters{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  justify-content:center;
  margin-bottom:22px;
}

.filter{
  background:var(--soft);
  border:1px solid var(--border);
  color:var(--text);
  padding:12px 14px;
  border-radius:10px;
  font-size:.95rem;
  min-width:160px;
  transition:var(--transition);
}

.filter::placeholder{color:var(--muted)}
.filter:focus{
  outline:none;
  border-color:rgba(255,255,255,.35);
  background:rgba(255,255,255,.05);
}

#searchInput{flex:1;max-width:420px}

.stats{
  text-align:center;
  color:var(--muted);
  margin-bottom:20px;
  font-size:.95rem;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:24px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:1.4rem;
  display:flex;
  flex-direction:column;
  gap:.55rem;
  backdrop-filter:blur(16px);
  transition:var(--transition);
}

.card:hover{
  transform:translateY(-6px);
  box-shadow:0 14px 34px rgba(0,0,0,.5);
}

.card h3{
  font-size:1.35rem;
  font-weight:800;
}

.card p{
  color:var(--muted);
  font-size:.94rem;
}

.tag{
  align-self:flex-start;
  margin-top:6px;
  padding:5px 12px;
  border-radius:999px;
  font-size:.75rem;
  font-weight:800;
}

.good{background:rgba(74,222,128,.15);color:var(--success)}
.warning{background:rgba(245,158,11,.15);color:var(--warning)}
.danger{background:rgba(239,68,68,.15);color:var(--danger)}

.btn{
  margin-top:auto;
  text-align:center;
  padding:12px;
  border-radius:10px;
  font-weight:800;
  text-decoration:none;
  color:var(--text);
  border:1px solid var(--border);
  transition:var(--transition);
}

.btn:hover{
  background:rgba(255,255,255,.08);
  border-color:rgba(255,255,255,.35);
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:60px 20px;
  color:var(--muted);
  font-size:1.1rem;
}

@media(max-width:600px){
  main{padding:22px 12px}
}
</style>
</head>
<body>

<main>

  <div class="title">Free Minecraft & Game Hosting 2026</div>

  <div class="filters">
    <input id="searchInput" class="filter" placeholder="Search hosting name">
    <select id="uptimeFilter" class="filter">
      <option value="">All Uptime</option>
      <option value="good">Stable 24/7</option>
      <option value="warning">Questionable</option>
      <option value="danger">Unreliable</option>
    </select>
    <select id="locationFilter" class="filter">
      <option value="">All Locations</option>
      <option value="india">India</option>
      <option value="singapore">Singapore</option>
      <option value="france">France</option>
      <option value="germany">Germany</option>
      <option value="usa">USA</option>
      <option value="eu">Europe</option>
    </select>
    <select id="ramFilter" class="filter">
      <option value="">All RAM</option>
      <option value="1">≥ 1 GB</option>
      <option value="2">≥ 2 GB</option>
      <option value="4">≥ 4 GB</option>
      <option value="6">≥ 6 GB</option>
    </select>
  </div>

  <div class="stats" id="resultCount">Loading...</div>
  <div class="grid" id="hostingList"></div>

</main>

<script>
const hostingList=document.getElementById("hostingList");
const resultCount=document.getElementById("resultCount");
const searchInput=document.getElementById("searchInput");
const uptimeFilter=document.getElementById("uptimeFilter");
const locationFilter=document.getElementById("locationFilter");
const ramFilter=document.getElementById("ramFilter");

let hostings=[];

fetch("free.json")
.then(r=>r.json())
.then(d=>{hostings=d;filterRender()});

function filterRender(){
  const q=searchInput.value.toLowerCase();
  const u=uptimeFilter.value;
  const l=locationFilter.value.toLowerCase();
  const r=ramFilter.value?Number(ramFilter.value):0;

  const filtered=hostings.filter(h=>{
    if(q && !h.name.toLowerCase().includes(q)) return false;
    if(u && h.uptime!==u) return false;
    if(l){
      if(l==="eu"){
        if(!/europe|france|germany|netherlands|finland/i.test(h.location)) return false;
      }else if(!h.location.toLowerCase().includes(l)) return false;
    }
    if(r && h.ram<r) return false;
    return true;
  });

  render(filtered);
}

function render(data){
  hostingList.innerHTML="";
  resultCount.textContent=`${data.length} hosting providers found`;

  if(!data.length){
    hostingList.innerHTML=`<div class="empty-state">No results found</div>`;
    return;
  }

  data.forEach(h=>{
    hostingList.innerHTML+=`
    <div class="hosting-card">
      <h3>${h.name}</h3>
      <p><b>RAM:</b> ${h.ram} GB</p>
      <p><b>CPU:</b> ${h.cpu}</p>
      <p><b>Disk:</b> ${h.disk}</p>
      <p><b>Location:</b> ${h.location}</p>
      <span class="tag ${h.uptime}">
        ${h.uptime==="good"?"Stable 24/7":h.uptime==="warning"?"Questionable":"Unreliable"}
      </span>
      <a class="btn-visit" href="${h.link}" target="_blank">Visit Panel →</a>
    </div>`;
  });
}

[searchInput,uptimeFilter,locationFilter,ramFilter]
.forEach(e=>e.addEventListener("input",filterRender));
</script>
</body>
</html>
