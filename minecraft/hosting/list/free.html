<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Free Minecraft Hosting</title>

<meta name="color-scheme" content="dark"/>
<meta name="theme-color" content="#000000"/>

<style>
:root{
  --bg:#000000;
  --card:rgba(18,18,28,0.94);
  --soft:rgba(28,28,40,0.96);
  --border:rgba(255,255,255,0.12);
  --text:#f8f9fa;
  --muted:#a0a0b0;
  --accent:#ffffff;
  --success:#4ade80;
  --warning:#f59e0b;
  --danger:#ef4444;
  --radius:14px;
  --transition:all .35s ease;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  background:linear-gradient(135deg,#000 0%,#0a0a0f 100%);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  min-height:100dvh;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

main{
  max-width:1400px;
  margin:auto;
  padding:28px 14px;
}

.title{
  text-align:center;
  font-size: 25px;
  font-weight:900;
  margin-bottom:2rem;
}

.search-bar{
  display:flex;
  gap:12px;
  align-items:center;
  justify-content:center;
  position:relative;
}

#searchInput{
  flex:1;
  min-width:250px;
  max-width:450px;
  padding:12px 16px;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--soft);
  color:var(--text);
}

#filterBtn{
  padding:12px 16px;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--soft);
  cursor:pointer;
  transition:.3s;
  width: 125px;
}

#filterBtn:hover{
  background:var(--hover-card);
}

/* Filter wrapper */
#filterWrapper{
  position:relative;
  display:none;
  justify-content:center;
  margin-top:12px;
}

/* ONE LINE ONLY */
.filters-line{
  display:flex;
  gap:10px;
  white-space:nowrap;   /* 🚨 important */
  background:var(--card);
  padding:12px;
  border-radius:12px;
  border:1px solid var(--border);
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.filters-line select{
  padding:10px 14px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--soft);
  color:var(--text);
}

.stats{
  text-align:center;
  color:var(--muted);
  margin-bottom:14px;
}

/* ===== ROW LIST ===== */
.list{
  display:flex;
  flex-wrap:wrap;      /* allow multiple cards in a row */
  gap:15px;            /* spacing between cards */
  justify-content:center;
  margin-top:10px;
}

.row{
  display:grid;                /* keep internal grid for row-top/specs/bottom */
  grid-template-columns:1fr auto;
  gap:12px;
  align-items:center;

  background:var(--soft);
  padding:14px 16px;
  border-radius:12px;
  cursor:pointer;
  border:1px solid var(--border);
  overflow:hidden;
  position:relative;
  word-break:break-word;
  transition:transform .35s ease, background .35s ease;

  /* responsive width */
  flex:1 1 calc(33.333% - 15px); /* 3 per row desktop */
  min-width:260px;
  max-width:400px;
}

@media(max-width:900px){
  .row{flex:1 1 calc(50% - 15px);} /* 2 per row tablet */
}

@media(max-width:600px){
  .row{flex:1 1 100%;} /* 1 per row mobile */
}

/* RESPONSIVE BREAKPOINTS */
@media(max-width:900px){
  .row{
    flex:1 1 calc(50% - 15px); /* 2 in a row */
  }
}

@media(max-width:600px){
  .row{
    flex:1 1 100%; /* 1 in a row */
  }
}

/* ===== SHINE EFFECT ===== */
.row::before{
  content:'';
  position:absolute;
  top:0;
  left:-100%;
  width:50%;
  height:100%;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,0.15),
    transparent
  );
  transition:left .7s ease;
  pointer-events:none;
}

.row:hover::before{
  left:100%;
}

/* ===== HOVER EFFECT ===== */
.row:hover{
  background:var(--hover-card);
  transform:translateX(clamp(4px, 2%, 12px)) scale(1.02);
  box-shadow:0 8px 25px rgba(255,255,255,0.1);
  z-index:1;
}

.row-top{
  grid-column:1 / -1;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.name{
  font-weight:800;
  font-size:1rem;
}

.row-specs{
  grid-column:1 / -1;
  display:flex;
  gap:16px;
  color:var(--muted);
  font-size:.9rem;
}

.row-bottom{
  grid-column:1 / -1;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.tag{
  padding:4px 10px;
  border-radius:999px;
  font-size: 14px;
  font-weight:900;
}

.good{background:rgba(74,222,128,.15);color:var(--success)}
.warning{background:rgba(245,158,11,.15);color:var(--warning)}
.danger{background:rgba(239,68,68,.15);color:var(--danger)}

@media(max-width:600px){
  .row-specs{
    flex-wrap:wrap;
    gap:10px;
  }
}
  
.btn{
  text-decoration:none;
  padding:8px 12px;
  border-radius:8px;
  border:1px solid var(--border);
  color:var(--text);
  font-size:.85rem;
  text-align:center;
  font-weight:900;
}

.btn:hover{
  background:rgba(255,255,255,.08);
}

</style>
</head>
<body>

<main>

<div class="title">Free Minecraft Hosting</div>

<div class="search-bar">
  <input id="searchInput" placeholder="Search hosting name">

  <button id="filterBtn">⚙ Filters</button>
</div>

<div id="filterWrapper">
  <div class="filters-line">
    <select id="uptimeFilter">
      <option value="">Uptime</option>
      <option value="good">24/7</option>
      <option value="danger">non-24/7</option>
    </select>

    <select id="locationFilter">
      <option value="">Location</option>
      <option value="india">India</option>
      <option value="singapore">Singapore</option>
      <option value="france">France</option>
      <option value="germany">Germany</option>
      <option value="usa">USA</option>
    </select>

    <select id="ramFilter">
      <option value="">RAM</option>
      <option value="1">≥1 GB</option>
      <option value="2">≥2 GB</option>
      <option value="4">≥4 GB</option>
      <option value="6">≥6 GB</option>
    </select>
  </div>
</div>
  
<div class="stats" id="resultCount">Loading Hostings...</div>


<div class="list" id="hostingList"></div>

</main>

<script>
const hostingList=document.getElementById("hostingList");
const resultCount=document.getElementById("resultCount");
const searchInput=document.getElementById("searchInput");
const uptimeFilter=document.getElementById("uptimeFilter");
const locationFilter=document.getElementById("locationFilter");
const ramFilter=document.getElementById("ramFilter");

let hostings=[];

fetch("free.json")
.then(r=>r.json())
.then(d=>{hostings=d;filterRender()});

function filterRender(){
  const q=searchInput.value.toLowerCase();
  const u=uptimeFilter.value;
  const l=locationFilter.value.toLowerCase();
  const r=ramFilter.value?Number(ramFilter.value):0;

  const filtered=hostings.filter(h=>{
    if(q && !h.name.toLowerCase().includes(q)) return false;
    if(u && h.uptime!==u) return false;
    if(l){
      if(l==="eu"){
        if(!/europe|france|germany|netherlands|finland/i.test(h.location)) return false;
      }else if(!h.location.toLowerCase().includes(l)) return false;
    }
    if(r && h.ram<r) return false;
    return true;
  });

  render(filtered);
}

function render(data){
  hostingList.innerHTML="";
  resultCount.textContent=`${data.length} hosting providers found`;

  data.forEach(h=>{
    hostingList.innerHTML+=`
      <div class="row">

        <div class="row-top">
          <div class="name">${h.name}</div>
          <a class="btn" href="${h.link}" target="_blank">Visit</a>
        </div>

        <div class="row-specs">
          <div><b>RAM:</b> ${h.ram} GB</div>
          <div><b>CPU:</b> ${h.cpu}</div>
          <div><b>DISK:</b> ${h.disk} GB</div>
        </div>

        <div class="row-bottom">
          <div><b>Location:</b> ${h.location}</div>
          <span class="tag ${h.uptime}">
            ${h.uptime === "good" ? "24/7" : "24/7"}
          </span>
        </div>

      </div>
    `;
  });
}

[searchInput,uptimeFilter,locationFilter,ramFilter]
.forEach(e=>e.addEventListener("input",filterRender));
</script>
<script>
const btn = document.getElementById("filterBtn");
const wrapper = document.getElementById("filterWrapper");
const filters = wrapper.querySelector(".filters-line");

btn.onclick = () => {
  wrapper.style.display =
    wrapper.style.display === "flex" ? "none" : "flex";

  setTimeout(positionFilters, 0);
};

function positionFilters(){
  const rect = filters.getBoundingClientRect();
  const vw = window.innerWidth;

  // If fits horizontally → show normally
  if(rect.width + 40 < vw){
    wrapper.style.justifyContent = "center";
  }else{
    // Otherwise still ONE LINE, but scrollable
    filters.style.overflowX = "auto";
  }
}

window.addEventListener("resize", positionFilters);
</script>
</body>
</html>
