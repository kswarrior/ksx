<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KS Warrior • Free Game Hosting 2026</title>

<meta name="color-scheme" content="dark"/>
<meta name="theme-color" content="#000000"/>

<style>
:root{
  --bg:#000000;
  --card:rgba(18,18,28,0.94);
  --soft:rgba(28,28,40,0.96);
  --border:rgba(255,255,255,0.12);
  --text:#f8f9fa;
  --muted:#a0a0b0;
  --accent:#ffffff;
  --success:#4ade80;
  --warning:#f59e0b;
  --danger:#ef4444;
  --radius:14px;
  --transition:all .35s ease;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  background:linear-gradient(135deg,#000 0%,#0a0a0f 100%);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  min-height:100dvh;
}

main{
  max-width:1400px;
  margin:auto;
  padding:28px 14px;
}

.title{
  text-align:center;
  font-size: 20px;
  font-weight:900;
  margin-bottom:2rem;
}

.filters{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  justify-content:center;
  margin-bottom:20px;
}

.filter{
  background:var(--soft);
  border:1px solid var(--border);
  color:var(--text);
  padding:12px 14px;
  border-radius:10px;
  min-width:100px;
}

.stats{
  text-align:center;
  color:var(--muted);
  margin-bottom:14px;
}

/* ===== TABLE HEADER ===== */
.table-head{
  display:grid;
  
  gap:12px;
  padding:14px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--soft);
  font-size: 14px;
  color:var(--muted);
  font-weight:700;
}

/* ===== ROW LIST ===== */
.list{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:10px;
}

.row{
  display:grid;
  gap:12px;
  padding:14px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--card);
  transition:var(--transition);
}

.row:hover{
  background:rgba(255,255,255,.04);
}

.name{
  font-weight:800;
}

.info {
  display:flex;
}

.tag{
  padding:4px 10px;
  border-radius:999px;
  font-size:.75rem;
  font-weight:800;
  width:max-content;
}

.good{background:rgba(74,222,128,.15);color:var(--success)}
.warning{background:rgba(245,158,11,.15);color:var(--warning)}
.danger{background:rgba(239,68,68,.15);color:var(--danger)}

.btn{
  text-decoration:none;
  padding:8px 12px;
  border-radius:8px;
  border:1px solid var(--border);
  color:var(--text);
  font-size:.85rem;
  text-align:center;
}

.btn:hover{
  background:rgba(255,255,255,.08);
}

/* ===== MOBILE ===== */
@media(max-width:900px){
  .table-head{display:none}
  .row{
    grid-template-columns:1fr 1fr;
    row-gap:8px;
  }
}
</style>
</head>
<body>

<main>

<div class="title">Free Minecraft Hosting</div>

<div class="filters">
  <input id="searchInput" class="filter" placeholder="Search hosting name">
  <select id="uptimeFilter" class="filter">
    <option value="">All Uptime</option>
    <option value="good">Stable 24/7</option>
    <option value="warning">Questionable</option>
    <option value="danger">Unreliable</option>
  </select>
  <select id="locationFilter" class="filter">
    <option value="">All Locations</option>
    <option value="india">India</option>
    <option value="singapore">Singapore</option>
    <option value="france">France</option>
    <option value="germany">Germany</option>
    <option value="usa">USA</option>
    <option value="eu">Europe</option>
  </select>
  <select id="ramFilter" class="filter">
    <option value="">All RAM</option>
    <option value="1">≥ 1 GB</option>
    <option value="2">≥ 2 GB</option>
    <option value="4">≥ 4 GB</option>
    <option value="6">≥ 6 GB</option>
  </select>
</div>
  
<div class="table-head">
  <p>Name</p>
  <p>RAM</p>
  <p>CPU</p>
  <p>Disk</p>
  <p>Location</p>
  <p>Uptime</p>
  <p>Link</p>
</div>
  
<div class="stats" id="resultCount">Loading...</div>


<div class="list" id="hostingList"></div>

</main>

<script>
const hostingList=document.getElementById("hostingList");
const resultCount=document.getElementById("resultCount");
const searchInput=document.getElementById("searchInput");
const uptimeFilter=document.getElementById("uptimeFilter");
const locationFilter=document.getElementById("locationFilter");
const ramFilter=document.getElementById("ramFilter");

let hostings=[];

fetch("free.json")
.then(r=>r.json())
.then(d=>{hostings=d;filterRender()});

function filterRender(){
  const q=searchInput.value.toLowerCase();
  const u=uptimeFilter.value;
  const l=locationFilter.value.toLowerCase();
  const r=ramFilter.value?Number(ramFilter.value):0;

  const filtered=hostings.filter(h=>{
    if(q && !h.name.toLowerCase().includes(q)) return false;
    if(u && h.uptime!==u) return false;
    if(l){
      if(l==="eu"){
        if(!/europe|france|germany|netherlands|finland/i.test(h.location)) return false;
      }else if(!h.location.toLowerCase().includes(l)) return false;
    }
    if(r && h.ram<r) return false;
    return true;
  });

  render(filtered);
}

function render(data){
  hostingList.innerHTML="";
  resultCount.textContent=`${data.length} hosting providers found`;

  data.forEach(h=>{
    hostingList.innerHTML+=`
      <div class="row">
        <div class="name">${h.name}</div>
        <a class="btn" href="${h.link}" target="_blank">Visit</a>
        <br>
      <div class"info">
        <div>${h.ram} GB</div>
        <div>${h.cpu}</div>
        <div>${h.disk} GB</div>
        <div>${h.location}</div>
        <div><span class="tag ${h.uptime}">${h.uptime}</span></div>
      </div>
      </div>
    `;
  });
}

[searchInput,uptimeFilter,locationFilter,ramFilter]
.forEach(e=>e.addEventListener("input",filterRender));
</script>

</body>
</html>
