<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KS Warrior - Free Game Hosting 2026</title>

<style>
:root{
  --primary:#1d2ddc;
  --primary-dark:#0f1ac9;
  --bg:#f8f9ff;
  --card:#ffffff;
  --text:#111;
  --text-light:#444;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  background:linear-gradient(135deg,#eef1ff,#f8f9ff);
  padding:20px 12px;
}

.container{max-width:1400px;margin:auto}

.section-title{
  text-align:center;
  font-size:clamp(1.8rem,5vw,2.6rem);
  color:var(--primary);
  margin:1.2em 0;
  font-weight:800;
}

.filters{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  justify-content:center;
  margin-bottom:24px;
}

.filter{
  padding:10px 16px;
  border:1px solid #d0d5ff;
  border-radius:10px;
  background:white;
  font-size:.95rem;
}

#searchInput{min-width:240px;max-width:420px;flex:1}

.stats{
  text-align:center;
  margin-bottom:20px;
  color:#555;
}

.hosting-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:22px;
}

.hosting-card{
  background:var(--card);
  border-left:5px solid var(--primary);
  border-radius:14px;
  padding:1.4rem;
  box-shadow:0 4px 14px rgba(0,0,0,.08);
  display:flex;
  flex-direction:column;
  gap:.5rem;
  transition:.25s;
}

.hosting-card:hover{
  transform:translateY(-6px);
}

.hosting-card h3{font-size:1.35rem}

.hosting-card p{color:var(--text-light);font-size:.95rem}

.tag{
  padding:4px 10px;
  border-radius:6px;
  font-size:.8rem;
  font-weight:700;
}

.tag.good{background:#28a745;color:#fff}
.tag.warning{background:#fd7e14;color:#fff}
.tag.danger{background:#dc3545;color:#fff}

.btn-visit{
  margin-top:auto;
  padding:12px;
  background:var(--primary);
  color:white;
  text-decoration:none;
  border-radius:10px;
  font-weight:700;
  text-align:center;
}

.btn-visit:hover{background:var(--primary-dark)}

.empty-state{
  text-align:center;
  padding:60px;
  color:#777;
  font-size:1.2rem;
}
</style>
</head>
<body>

<div class="container">
<h1 class="section-title">Free Minecraft & Game Hosting 2026</h1>

<div class="filters">
  <input id="searchInput" class="filter" placeholder="Search hosting name">
  <select id="uptimeFilter" class="filter">
    <option value="">All Uptime</option>
    <option value="good">Stable 24/7</option>
    <option value="warning">Questionable</option>
    <option value="danger">Unreliable</option>
  </select>
  <select id="locationFilter" class="filter">
    <option value="">All Locations</option>
    <option value="india">India</option>
    <option value="singapore">Singapore</option>
    <option value="france">France</option>
    <option value="germany">Germany</option>
    <option value="usa">USA</option>
    <option value="eu">Europe</option>
  </select>
  <select id="ramFilter" class="filter">
    <option value="">All RAM</option>
    <option value="1">≥ 1 GB</option>
    <option value="2">≥ 2 GB</option>
    <option value="4">≥ 4 GB</option>
    <option value="6">≥ 6 GB</option>
  </select>
</div>

<div class="stats" id="resultCount">Loading...</div>
<div class="hosting-grid" id="hostingList"></div>
</div>

<script>
const hostingList=document.getElementById("hostingList");
const resultCount=document.getElementById("resultCount");
const searchInput=document.getElementById("searchInput");
const uptimeFilter=document.getElementById("uptimeFilter");
const locationFilter=document.getElementById("locationFilter");
const ramFilter=document.getElementById("ramFilter");

let hostings=[];

fetch("free.json")
.then(r=>r.json())
.then(d=>{hostings=d;filterRender()});

function filterRender(){
  const q=searchInput.value.toLowerCase();
  const u=uptimeFilter.value;
  const l=locationFilter.value.toLowerCase();
  const r=ramFilter.value?Number(ramFilter.value):0;

  const filtered=hostings.filter(h=>{
    if(q && !h.name.toLowerCase().includes(q)) return false;
    if(u && h.uptime!==u) return false;
    if(l){
      if(l==="eu"){
        if(!/europe|france|germany|netherlands|finland/i.test(h.location)) return false;
      }else if(!h.location.toLowerCase().includes(l)) return false;
    }
    if(r && h.ram<r) return false;
    return true;
  });

  render(filtered);
}

function render(data){
  hostingList.innerHTML="";
  resultCount.textContent=`${data.length} hosting providers found`;

  if(!data.length){
    hostingList.innerHTML=`<div class="empty-state">No results found</div>`;
    return;
  }

  data.forEach(h=>{
    hostingList.innerHTML+=`
    <div class="hosting-card">
      <h3>${h.name}</h3>
      <p><b>RAM:</b> ${h.ram} GB</p>
      <p><b>CPU:</b> ${h.cpu}</p>
      <p><b>Disk:</b> ${h.disk}</p>
      <p><b>Location:</b> ${h.location}</p>
      <span class="tag ${h.uptime}">
        ${h.uptime==="good"?"Stable 24/7":h.uptime==="warning"?"Questionable":"Unreliable"}
      </span>
      <a class="btn-visit" href="${h.link}" target="_blank">Visit Panel →</a>
    </div>`;
  });
}

[searchInput,uptimeFilter,locationFilter,ramFilter]
.forEach(e=>e.addEventListener("input",filterRender));
</script>
</body>
</html>
