<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KS Warrior • Skyport Panel Installer</title>

  <meta name="color-scheme" content="light"/>

  <style>
    :root {
      --primary: #1d4ed8;        /* blue-700 */
      --primary-dark: #1e40af;   /* blue-800 */
      --primary-light: #3b82f6;  /* blue-500 */
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow: 0 6px 20px rgba(0,0,0,0.07);
      --transition: all 0.32s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      line-height: 1.6;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 2.5rem 1.2rem;
    }

    #installer-name {
      text-align: center;
      font-size: clamp(2.2rem, 6.5vw, 3.4rem);
      font-weight: 900;
      background: linear-gradient(90deg, #1d4ed8, #60a5fa, #1d4ed8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-size: 200% auto;
      animation: shine 5.5s linear infinite;
      margin-bottom: 3.2rem;
      letter-spacing: -1px;
    }

    @keyframes shine {
      to { background-position: 200% center; }
    }

    .section {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 1.9rem;
      margin-bottom: 1.8rem;
      box-shadow: var(--shadow);
      transition: var(--transition);
    }

    .section:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 32px rgba(29, 78, 216, 0.14);
    }

    .section h2 {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }

    .codespre {
      background: #0f172a;
      color: #e2e8f0;
      padding: 1.1rem;
      border-radius: 9px;
      font-family: 'JetBrains Mono', 'Consolas', monospace;
      font-size: 0.92rem;
      overflow-x: auto;
      margin: 1.1rem 0;
      border: 1px solid #1e293b;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .btn {
      background: linear-gradient(to right, var(--primary), var(--primary-light));
      color: white;
      border: none;
      padding: 0.78rem 1.5rem;
      border-radius: 8px;
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
    }

    .btn:hover {
      background: linear-gradient(to right, var(--primary-dark), #2563eb);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(29,78,216,0.25);
    }

    .btn:active {
      transform: translateY(0);
    }

    .copied {
      margin-left: 1.1rem;
      color: #16a34a;
      font-weight: 600;
      opacity: 0;
      transform: translateY(-5px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .copied.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .flex-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 1rem;
    }

    @media (max-width: 620px) {
      .container { padding: 1.6rem 1rem; }
      .section { padding: 1.5rem; }
      .btn { flex: 1 1 100%; justify-content: center; }
    }
  </style>
</head>
<body>

<div class="container">

  <h1 id="installer-name">Skyport Panel Installer</h1>

  <!-- Quick Links -->
  <div class="section">
    <div class="flex-buttons">
      <button class="btn" onclick="window.open('https://www.youtube.com/results?search_query=skyport+panel+install+tutorial','_blank')">
        🎥 YouTube Tutorials
      </button>
      <button class="btn" onclick="window.open('https://github.com/Skyport-Dev','_blank')">
        🌐 Skyport GitHub
      </button>
    </div>
  </div>

  <!-- Install Panel -->
  <div class="section">
    <h2>🔧 Install Panel</h2>
    <pre class="codespre" id="panelCmd">bash <(curl -sSL https://raw.githubusercontent.com/KSWarrior/moh-codes/refs/heads/main/skyportpanel/panel.sh)</pre>
    <button class="btn" onclick="copyCommand('panelCmd', this)">📋 Copy Command</button>
    <span class="copied">Copied!</span>
  </div>

  <!-- Install Wings -->
  <div class="section">
    <h2>🛰️ Install Wings</h2>
    <pre class="codespre" id="wingsCmd">bash <(curl -sSL https://raw.githubusercontent.com/KSWarrior/moh-codes/refs/heads/main/skyportpanel/wings.sh)</pre>
    <button class="btn" onclick="copyCommand('wingsCmd', this)">📋 Copy Command</button>
    <span class="copied">Copied!</span>
  </div>

</div>

<script>
function copyCommand(preId, button) {
  const pre = document.getElementById(preId);
  const copied = button.nextElementSibling;
  
  if (!pre) return;

  const text = pre.textContent.trim();

  navigator.clipboard.writeText(text).then(() => {
    copied.classList.add('visible');
    setTimeout(() => copied.classList.remove('visible'), 2300);
  }).catch(err => {
    console.error('Copy failed:', err);
    copied.textContent = 'Failed :(';
    copied.classList.add('visible');
    setTimeout(() => {
      copied.classList.remove('visible');
      copied.textContent = 'Copied!';
    }, 2200);
  });
}
</script>

</body>
</html>
