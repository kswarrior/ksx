<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puffer Panel Installer – KS Warrior</title>

<style>
:root{
  --bg:#0b1020;
  --card:rgba(22,28,55,0.9);
  --soft:rgba(32,40,80,0.95);
  --border:rgba(255,255,255,0.14);
  --text:#ffffff;
  --muted:#cfd7ff;
  --accent:#4fc3ff;
  --accent-glow:rgba(79,195,255,0.45);
  --radius:14px;
  --gap:26px;
  --transition:0.45s cubic-bezier(0.22,1,0.36,1);
}

*{box-sizing:border-box;margin:0;padding:0}
body{
  background:radial-gradient(circle at top,#111a3a,#060916);
  color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

main{
  max-width:980px;
  margin:auto;
  padding:26px 16px;
  animation:fadeUp 0.8s ease;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(24px)}
  to{opacity:1;transform:translateY(0)}
}

/* TITLE */
.title{
  text-align:center;
  font-size:32px;
  font-weight:900;
  margin-bottom:10px;
  background:linear-gradient(90deg,#4fc3ff,#9be7ff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:0 0 25px var(--accent-glow);
}

.subtitle{
  text-align:center;
  color:var(--muted);
  margin-bottom:40px;
  font-size:14px;
}

/* SECTION */
.section{
  background:linear-gradient(145deg,rgba(79,195,255,0.06),var(--card));
  border-radius:var(--radius);
  border:1px solid var(--border);
  padding:26px;
  margin-bottom:var(--gap);
  transition:all var(--transition);
  backdrop-filter:blur(18px);
}

.section:hover{
  transform:translateY(-4px);
  box-shadow:0 0 35px rgba(79,195,255,0.25);
}

.section h2{
  font-size:18px;
  font-weight:800;
  margin-bottom:18px;
  display:flex;
  align-items:center;
  gap:8px;
}

/* CODE */
.codespre{
  background:#070c1f;
  color:#e8f4ff;
  border-radius:10px;
  padding:16px;
  font-size:13px;
  line-height:1.7;
  overflow-x:auto;
  border:1px solid rgba(79,195,255,0.25);
  margin-bottom:16px;
}

/* BUTTON */
.btn{
  background:linear-gradient(135deg,#4fc3ff,#2f8cff);
  color:#000;
  border:none;
  padding:11px 20px;
  border-radius:9px;
  font-weight:800;
  cursor:pointer;
  transition:all 0.3s ease;
}

.btn:hover{
  transform:scale(1.06);
  box-shadow:0 0 25px var(--accent-glow);
}

/* COPY STATUS */
.copied{
  margin-left:14px;
  font-size:13px;
  color:#7dffb3;
  opacity:0;
  transition:opacity 0.3s ease;
}
.copied.show{opacity:1}

/* MOBILE */
@media (hover:none){
  .section:hover,.btn:hover{
    transform:none;
    box-shadow:none;
  }
}
</style>
</head>

<body>
<main>

  <div class="title">Puffer Panel Installer</div>
  <div class="subtitle">
    Fast • Secure • Beginner-Friendly Setup
  </div>

  <div class="section">
    <h2>🎥 Watch & Learn</h2>
    <button class="btn" onclick="window.open('','_blank')">
      Open YouTube Tutorial
    </button>
  </div>

  <div class="section">
    <h2>🚀 Install in One Command</h2>

    <pre class="codespre" id="installCmd">
bash <(curl -sSL https://raw.githubusercontent.com/KSWarrior/moh-codes/refs/heads/main/pufferpanel/ks-install.sh)
    </pre>

    <button class="btn" onclick="copyCmd()">Copy Command</button>
    <span class="copied" id="copiedTxt">Copied ✓</span>
  </div>

</main>

<script>
function copyCmd(){
  const text = document.getElementById("installCmd").textContent.trim();
  const tag = document.getElementById("copiedTxt");

  navigator.clipboard.writeText(text).then(()=>{
    tag.classList.add("show");
    setTimeout(()=>tag.classList.remove("show"),2000);
  });
}
</script>

</body>
</html>
