<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puffer Panel – KS Warrior</title>

<style>
:root{
  --bg:#000000;
  --card:rgba(18,18,28,0.9);
  --soft:rgba(28,28,40,0.95);
  --border:rgba(255,255,255,0.12);
  --text:#ffffff;
  --muted:#aaaaaa;
  --accent:#ffffff;
  --radius:12px;
  --gap:24px;
  --transition:0.45s cubic-bezier(0.22,1,0.36,1);
}

*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

main{
  max-width:980px;
  margin:auto;
  padding:24px 16px;
  animation:fadeIn 0.8s ease;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

/* TITLE */
.title{
  text-align:center;
  font-size:30px;
  font-weight:900;
  margin-bottom:36px;
  background:linear-gradient(90deg,#ffffff,#bfbfbf);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* SECTION CARD */
.section{
  background:var(--card);
  border-radius:var(--radius);
  border:1px solid var(--border);
  padding:24px;
  margin-bottom:var(--gap);
  transition:all var(--transition);
  backdrop-filter:blur(18px);
}

.section:hover{
  transform:translateY(-4px);
  box-shadow:0 0 25px rgba(255,255,255,0.15);
}

.section h2{
  font-size:18px;
  font-weight:800;
  margin-bottom:16px;
  display:flex;
  align-items:center;
  gap:8px;
}

/* CODE BLOCK */
.codespre{
  background:#0f0f18;
  color:#eaeaea;
  border-radius:10px;
  padding:14px;
  font-size:13px;
  line-height:1.6;
  overflow-x:auto;
  border:1px solid var(--border);
  margin-bottom:14px;
  word-break:break-all;
}

/* BUTTONS */
.btn{
  background:linear-gradient(135deg,#ffffff,#dcdcdc);
  color:#000;
  border:none;
  padding:10px 18px;
  border-radius:8px;
  font-weight:700;
  cursor:pointer;
  transition:all 0.3s ease;
}

.btn:hover{
  transform:scale(1.05);
  box-shadow:0 0 20px rgba(255,255,255,0.3);
}

.btn.secondary{
  background:transparent;
  color:var(--text);
  border:1px solid var(--border);
}

/* COPY STATUS */
.copied{
  margin-left:12px;
  font-size:13px;
  color:#4cff8f;
  opacity:0;
  transition:opacity 0.3s ease;
}

.copied.show{opacity:1}

/* MOBILE SAFETY */
@media (hover:none){
  .section:hover,
  .btn:hover{
    transform:none;
    box-shadow:none;
  }
}
</style>
</head>

<body>
<main>

  <div class="title">Puffer Panel Installer</div>

  <!-- VIDEO -->
  <div class="section">
    <h2>🎥 Tutorial</h2>
    <button class="btn secondary" onclick="window.open('','_blank')">
      Watch YouTube Video
    </button>
  </div>

  <!-- INSTALL -->
  <div class="section">
    <h2>🔧 Install Panel</h2>

    <pre class="codespre" id="installCmd">
bash <(curl -sSL https://raw.githubusercontent.com/KSWarrior/moh-codes/refs/heads/main/pufferpanel/ks-install.sh)
    </pre>

    <button class="btn" onclick="copyCmd()">Copy Command</button>
    <span class="copied" id="copiedTxt">Copied!</span>
  </div>

</main>

<script>
function copyCmd(){
  const pre = document.getElementById("installCmd");
  const copied = document.getElementById("copiedTxt");
  const text = pre.textContent.trim();

  navigator.clipboard.writeText(text).then(()=>{
    copied.classList.add("show");
    setTimeout(()=>copied.classList.remove("show"),2000);
  });
}
</script>

</body>
</html>
