<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modrinth Downloader</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
/* =========================================================
   ROOT VARIABLES (Theme System)
========================================================= */
:root{
    --bg: #000000;
    --card: rgba(18,18,28,0.88);
    --soft: rgba(28,28,40,0.9);
    --hover-card: rgba(45,45,60,0.95);

    --text: #ffffff;
    --muted: #a8a8a8;
    --light-muted: #d4d4d4;
    --accent: #ffffff;

    --border: rgba(255,255,255,0.12);

    --radius: 14px;
    --gap: 28px;

    --shadow: 0 8px 25px rgba(0,0,0,0.45);
    --transition: 0.25s ease;
}

/* =========================================================
   GLOBAL RESET
========================================================= */
*,
*::before,
*::after{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html{
    scroll-behavior: smooth;
}

body{
    font-family: 'Poppins', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    line-height: 1.6;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
}

#Title{
    text-align: center;
    font-size: 35px;
    font-weight: 900;
    animation: fadeUp 0.8s ease;
}

/* Scrollbar */
::-webkit-scrollbar{
    width: 8px;
}
::-webkit-scrollbar-track{
    background: var(--bg);
}
::-webkit-scrollbar-thumb{
    background: rgba(255,255,255,0.15);
    border-radius: 10px;
}
::-webkit-scrollbar-thumb:hover{
    background: rgba(255,255,255,0.3);
}

/* =========================================================
   ANIMATIONS
========================================================= */
@keyframes fadeUp{
    from{
        opacity: 0;
        transform: translateY(40px);
    }
    to{
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes spin{
    to{ transform: rotate(360deg); }
}

/* =========================================================
   LAYOUT
========================================================= */
.dashboard{
    max-width: 1200px;
    margin: auto;
    padding: var(--gap) 20px;
    display: flex;
    flex-direction: column;
    gap: var(--gap);
}

/* =========================================================
   CONTROLS
========================================================= */
.controls{
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content: center;
    align-items: center;

    padding: var(--gap);
    background: var(--card);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);

    animation: fadeUp 0.9s ease;
}

/* =========================================================
   FORM ELEMENTS (CLASS-BASED ONLY)
========================================================= */
.form-element{
    padding: 12px 18px;
    background: var(--soft);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 0.95rem;
    transition: var(--transition);
    outline: none;
    color: var(--text);
}

.form-element:focus{
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(255,255,255,0.15);
}

/* Custom select arrow */
.select-element{
    appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg fill='%23ffffff' viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M7 10l5 5 5-5z'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 12px center;
    background-size: 16px;
}

/* =========================================================
   BUTTONS (CLASS-BASED)
========================================================= */
.button-element{
    background: var(--accent);
    color: #000;
    font-weight: 600;
    cursor: pointer;
    border: none;
}

.button-element:hover{
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(255,255,255,0.15);
}

/* =========================================================
   CARD GRID
========================================================= */
.grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: var(--gap);
}

/* =========================================================
   CARDS
========================================================= */
.card{
    background: var(--card);
    padding: var(--gap);
    border-radius: var(--radius);
    border: 1px solid var(--border);

    display: flex;
    flex-direction: column;
    gap: 16px;

    cursor: pointer;
    transition: var(--transition);
    animation: fadeUp 1s ease;
}

.card:hover{
    background: var(--hover-card);
    transform: translateY(-5px);
    box-shadow: var(--shadow);
}

/* =========================================================
   CARD CONTENT
========================================================= */
.icon{
    width: 52px;
    height: 52px;
    border-radius: var(--radius);
    object-fit: cover;
    border: 1px solid var(--border);
    transition: var(--transition);
}

.card:hover .icon{
    transform: scale(1.05);
}

.info h3{
    font-size: 1.1rem;
    font-weight: 700;
}

.info p{
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 6px;
}

/* =========================================================
   LOADING
========================================================= */
#loading{
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    padding: 40px 0;
    color: var(--muted);
}

#loading::before{
    content: "";
    width: 24px;
    height: 24px;
    border: 3px solid var(--accent);
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

.empty{
    text-align: center;
    padding: 60px 0;
    color: var(--muted);
}

/* =========================================================
   MODALS
========================================================= */
.modal{
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(6px);
    z-index: 1000;

    align-items: center;
    justify-content: center;
    padding: 5px;
}

.modal.active{
    display: flex;
}

.modal-content{
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    width: 100%;
    max-height: 100dvh;
    overflow-y: auto;
    animation: fadeUp 0.4s ease;
}

.full-modal{
    max-width: 1100px;
}

.small-modal{
    max-width: 420px;
}

.close{
    font-size: 26px;
    font-weight: bold;
    cursor: pointer;
    float: right;
}

.close:hover{
    opacity: 0.7;
}

/* =========================================================
   MODAL CONTENT STRUCTURE
========================================================= */
.header{
    display: flex;
    gap: 16px;
    align-items: center;
    margin-bottom: 20px;
}

#projectIcon{
    width: 70px;
    height: 70px;
    border-radius: var(--radius);
    object-fit: cover;
}

#projectTitle{
    font-size: 22px;
}

#shortDesc{
    color: var(--muted);
    margin-top: 6px;
    font-size: 10px;
}

.stats{
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    margin-bottom: 25px;
}

#downloadBtn{
    background: #fff;
    color: #000;
    padding: 10px 22px;
    border-radius: 5px;
    border: none;
    font-weight: 900;
    font-size: 0.95rem;
    display: inline-block;
    margin-bottom: 15px;
}

.final-download {
    background: #fff;
    color: #000;
    padding: 10px 22px;
    border-radius: 5px;
    border: none;
    margin-top: 15px;
    font-weight: 900;
    font-size: 0.95rem;
    display: inline-block;
    margin-bottom: 15px;
}

#projectDescription{
    width: 100%;
    font-size: 14px;
    color: var(--light-muted);
    margin-bottom: 25px;
}

#projectGallery img{
    width: 100%;
    border-radius: var(--radius);
}

.links{
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin-top: 20px;
}

.links a{
    color: var(--accent);
    text-decoration: none;
}

.links a:hover{
    text-decoration: underline;
}

/* =========================================================
   RESPONSIVE
========================================================= */
@media (max-width: 768px){
    .select-element {
        width: 100%;
    }

    .header{
        flex-direction: column;
        align-items: flex-start;
    }
    
    #type,
    #loader {
        max-width: 47%;
    }
    
    #version,
    #sort {}
    
    .button-element {
        width: 55px;
        color: #000;
    }
}
</style>
</head> 
<body>

<div class="dashboard">
    <h1 id="Title">Downloader</h1>

    <div class="controls">
        <select id="type" class="form-element select-element"></select>

        <select id="loader" class="form-element select-element"></select>

        <select id="version" class="form-element select-element"></select>

        <select id="sort" class="form-element select-element">
            <option value="relevance">Relevance</option>
            <option value="downloads">Downloads</option>
            <option value="newest">Newest</option>
            <option value="updated">Updated</option>
        </select>

        <input 
            type="text" 
            id="search" 
            class="form-element" 
            placeholder="Search by name"
        >

        <button 
            onclick="searchContent()" 
            class="form-element button-element"
        >
            🔍
        </button>
    </div>

    <div class="grid" id="grid"></div>
    <div id="loading"></div>
</div>

<!-- Details Modal -->
<div id="detailsModal" class="modal">
    <div class="modal-content full-modal">
        <span class="close" onclick="closeDetails()">&times;</span>

        <div class="header">
            <img id="projectIcon" src="" alt="Project Icon">
            <div>
                <h1 id="projectTitle"></h1>
                <p id="shortDesc"></p>
            </div>
        </div>

        <button id="downloadBtn">
            Download
        </button>

        <div id="projectStats" class="stats"></div>
        <div id="projectDescription"></div>
        <div id="projectGallery"></div>
        <div id="additionalInfo"></div>
        <div id="projectLinks" class="links"></div>
    </div>
</div>

<!-- Download Modal -->
<div id="downloadModal" class="modal">
    <div class="modal-content small-modal">
        <span class="close" onclick="closeDownload()">&times;</span>

        <h3>Download Options</h3>

        <label for="dlVersion">Select version</label>
        <select id="dlVersion" class="form-element select-element"></select>

        <label for="dlLoader">Select platform</label>
        <select id="dlLoader" class="form-element select-element"></select>

        <button 
            id="performDownloadBtn" 
            class="final-download"
        >
            Download
        </button>
    </div>
</div>

<script>
/* =========================================================
   MODRINTH BROWSER – OPTIMIZED FULL JS
========================================================= */

"use strict";

/* ================== ELEMENTS ================== */
const grid = document.getElementById("grid");
const typeEl = document.getElementById("type");
const loaderEl = document.getElementById("loader");
const versionEl = document.getElementById("version");
const searchEl = document.getElementById("search");
const sortEl = document.getElementById("sort");
const loadingEl = document.getElementById("loading");

const detailsModal = document.getElementById("detailsModal");
const projectTitle = document.getElementById("projectTitle");
const projectIcon = document.getElementById("projectIcon");
const shortDesc = document.getElementById("shortDesc");
const projectStats = document.getElementById("projectStats");
const projectDescription = document.getElementById("projectDescription");
const projectGallery = document.getElementById("projectGallery");
const additionalInfo = document.getElementById("additionalInfo");
const projectLinks = document.getElementById("projectLinks");
const downloadBtn = document.getElementById("downloadBtn");

const downloadModal = document.getElementById("downloadModal");
const dlVersion = document.getElementById("dlVersion");
const dlLoader = document.getElementById("dlLoader");
const performDownloadBtn = document.getElementById("performDownloadBtn");

/* ================== CONSTANTS ================== */
const API = "https://api.modrinth.com/v2";
const LIMIT = 20;

const PROJECT_TYPES = ["mod", "modpack", "resourcepack", "shader", "plugin"];
const CLIENT_LOADERS = ["fabric", "forge", "quilt", "neoforge"];
const SERVER_LOADERS = ["paper", "spigot", "purpur", "bukkit", "velocity"];

/* ================== STATE ================== */
let currentPage = 0;
let isLoading = false;
let hasMore = true;
let currentParams = {};
let currentProjectId = null;

/* ================== UTILITIES ================== */

function safeText(text) {
    return text || "N/A";
}

function formatNumber(num = 0) {
    if (num >= 1_000_000) return (num / 1_000_000).toFixed(2) + "M";
    if (num >= 1_000) return (num / 1_000).toFixed(1) + "K";
    return num;
}

function populateDropdown(el, options, emptyText = "All") {
    el.innerHTML = `<option value="">${emptyText}</option>`;
    options.forEach(opt => {
        const option = document.createElement("option");
        option.value = opt;
        option.textContent = opt.charAt(0).toUpperCase() + opt.slice(1);
        el.appendChild(option);
    });
}

async function fetchJSON(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error("API Error");
    return res.json();
}

/* ================== INIT ================== */

async function init() {
    populateDropdown(typeEl, PROJECT_TYPES, "Select Type");
    typeEl.value = "mod";
    typeEl.addEventListener("change", updateLoaders);

    await loadGameVersions();
    updateLoaders();
    searchContent();
}

/* ================== LOADERS ================== */

function updateLoaders() {
    const type = typeEl.value;

    if (type === "shader" || type === "resourcepack") {
        loaderEl.style.display = "none";
        loaderEl.innerHTML = "";
        return;
    }

    loaderEl.style.display = "inline-block";
    const loaders = type === "plugin" ? SERVER_LOADERS : CLIENT_LOADERS;
    populateDropdown(loaderEl, loaders, "All Platforms");
}

/* ================== GAME VERSIONS ================== */

async function loadGameVersions() {
    try {
        const data = await fetchJSON(`${API}/tag/game_version`);
        const versions = data
            .filter(v => v.version_type === "release")
            .map(v => v.version)
            .sort((a, b) => b.localeCompare(a, undefined, { numeric: true }));

        populateDropdown(versionEl, versions, "All Versions");
    } catch (err) {
        console.error("Version load failed", err);
    }
}

/* ================== SEARCH ================== */

function searchContent() {
    currentParams = {
        type: typeEl.value,
        loader: loaderEl.value,
        version: versionEl.value,
        search: searchEl.value.trim(),
        sort: sortEl.value
    };

    grid.innerHTML = "";
    currentPage = 0;
    hasMore = true;
    loadMore();
}

/* ================== LOAD MORE ================== */

async function loadMore() {
    if (isLoading || !hasMore) return;

    isLoading = true;
    loadingEl.textContent = "Loading...";

    try {
        const results = await loadProjects(currentParams, currentPage);
        results.forEach(createCard);

        if (results.length < LIMIT) hasMore = false;
        currentPage++;
    } catch (err) {
        console.error("Load failed", err);
    }

    loadingEl.textContent = "";
    isLoading = false;
}

/* ================== FETCH PROJECTS ================== */

async function loadProjects(params, page) {
    const { type, loader, version, search, sort } = params;

    let facets = [];
    if (type) facets.push(`["project_type:${type}"]`);
    if (loader) facets.push(`["categories:${loader}"]`);
    if (version) facets.push(`["versions:${version}"]`);

    const facetsParam = facets.length ? `&facets=[${facets.join(",")}]` : "";
    const queryParam = search ? `&query=${encodeURIComponent(search)}` : "";

    let index = "";
    if (sort === "newest") index = "&index=created";
    if (sort === "updated") index = "&index=updated";
    if (sort === "downloads") index = "&index=downloads";

    const offset = `&offset=${page * LIMIT}`;
    const url = `${API}/search?limit=${LIMIT}${offset}${facetsParam}${queryParam}${index}`;

    const data = await fetchJSON(url);

    return data.hits.map(p => ({
        id: p.project_id,
        title: p.title,
        desc: p.description,
        icon: p.icon_url,
        type: p.project_type
    }));
}

/* ================== CARD ================== */

function createCard(item) {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
        <img class="icon" src="${item.icon || 'https://via.placeholder.com/80'}">
        <div class="info">
            <h3>${safeText(item.title)}</h3>
            <p>${safeText(item.desc)}</p>
        </div>
    `;

    card.addEventListener("click", () => openDetails(item.id));
    grid.appendChild(card);
}

/* ================== DETAILS ================== */

async function openDetails(id) {
    currentProjectId = id;
    detailsModal.style.display = "block";

    try {
        const data = await fetchJSON(`${API}/project/${id}`);

        projectTitle.textContent = safeText(data.title);
        projectIcon.src = data.icon_url || "https://via.placeholder.com/64";
        shortDesc.textContent = safeText(data.description);

        projectStats.innerHTML = `
            <span>Downloads: ${formatNumber(data.downloads)}</span>
            <span>Followers: ${formatNumber(data.follows)}</span>
        `;

        projectDescription.innerHTML = marked.parse(data.body || "");

        additionalInfo.innerHTML = `
            <p>Game Versions: ${data.game_versions?.join(", ") || "N/A"}</p>
            <p>Loaders: ${data.loaders?.join(", ") || "N/A"}</p>
            <p>License: ${data.license?.name || "N/A"}</p>
        `;

        downloadBtn.onclick = () => openDownloadModal(id);

    } catch (err) {
        alert("Failed to load project.");
        console.error(err);
    }
}

/* ================== DOWNLOAD ================== */

async function openDownloadModal(id) {
    downloadModal.style.display = "block";

    try {
        const versions = await fetchJSON(`${API}/project/${id}/version`);

        const gameVersions = [...new Set(versions.flatMap(v => v.game_versions))];
        const loaders = [...new Set(versions.flatMap(v => v.loaders))];

        populateDropdown(dlVersion, gameVersions, "Select Version");
        populateDropdown(dlLoader, loaders, "Select Loader");

        performDownloadBtn.onclick = () => {
            const gv = dlVersion.value;
            const ld = dlLoader.value;

            let filtered = versions.filter(v =>
                (!gv || v.game_versions.includes(gv)) &&
                (!ld || v.loaders.includes(ld))
            );

            if (!filtered.length) {
                alert("No matching version found.");
                return;
            }

            filtered.sort((a, b) =>
                new Date(b.date_published) - new Date(a.date_published)
            );

            const file = filtered[0].files.find(f => f.primary) || filtered[0].files[0];
            window.location.href = file.url;
        };

    } catch (err) {
        alert("Failed to load versions.");
        console.error(err);
    }
}

/* ================== MODAL CLOSE ================== */

function closeDetails() {
    detailsModal.style.display = "none";
}

function closeDownload() {
    downloadModal.style.display = "none";
}

/* ================== INFINITE SCROLL ================== */

window.addEventListener("scroll", () => {
    if (
        window.innerHeight + window.scrollY >= document.body.offsetHeight - 200 &&
        !isLoading &&
        hasMore
    ) {
        loadMore();
    }
});

/* ================== START ================== */

init();
</script>

</body>
</html>
