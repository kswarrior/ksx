<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modrinth Downloader</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* =========================================================
   ROOT VARIABLES
   (Theme, spacing, motion)
========================================================= */
:root{
    --bg: #000000;
    --card: rgba(18,18,28,0.85);
    --soft: rgba(28,28,40,0.9);
    --hover-card: rgba(40,40,55,0.95);

    --text: #ffffff;
    --muted: #aaaaaa;
    --accent: #ffffff;

    --border: rgba(255,255,255,0.12);
    --radius: 12px;
    --gap: 28px;
    --transition: 0.3s ease;
}

/* =========================================================
   GLOBAL RESET & BASE
========================================================= */
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body{
    font-family: 'Poppins', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    overflow-x: hidden;
    line-height: 1.5;
}

/* =========================================================
   ANIMATIONS
========================================================= */
@keyframes floatIn{
    0%{
        opacity: 0;
        transform: translateY(50px);
    }
    100%{
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes spin{
    to{
        transform: rotate(360deg);
    }
}

/* =========================================================
   LAYOUT
========================================================= */
.dashboard{
    display: grid;
    gap: var(--gap);
    max-width: 1180px;
    margin: 0;
    padding: var(--gap) 16px;
}

/* =========================================================
   HEADINGS
========================================================= */
h1{
    text-align: center;
    margin-bottom: 20px;
    font-size: 2.5em;
    font-weight: 700;
    letter-spacing: 1px;
    animation: floatIn 1.2s ease-out;
}

/* =========================================================
   CONTROLS
========================================================= */
.controls{
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;

    background: var(--card);
    padding: var(--gap);
    border-radius: var(--radius);
    border: 1px solid var(--border);

    animation: floatIn 1.2s ease-out;
}

/* =========================================================
   FORM ELEMENTS
========================================================= */
select,
input[type="text"],
button{
    min-width: 160px;
    padding: 12px 18px;

    background: var(--soft);
    color: var(--text);

    border: 1px solid var(--border);
    border-radius: var(--radius);

    font-size: 1em;
    outline: none;
    transition: var(--transition);
}

select{
    appearance: none;
    background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23FFFFFF%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095.1c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.9z%22%2F%3E%3C%2Fsvg%3E');
    background-repeat: no-repeat;
    background-position: right 12px center;
    background-size: 12px;
}

select:focus,
input[type="text"]:focus,
button:focus{
    border-color: var(--accent);
}

/* =========================================================
   BUTTONS
========================================================= */
button{
    background: var(--accent);
    color: #000;
    font-weight: 600;
    cursor: pointer;
    border: none;
}

button:hover{
    transform: translateY(-2px);
}

/* =========================================================
   CARD GRID
========================================================= */
.grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: var(--gap);

    max-width: 1180px;
    width: 100%;
    padding: 0 16px;
}

/* =========================================================
   CARDS
========================================================= */
.card{
    display: flex;
    flex-direction: column;
    gap: 16px;

    background: var(--card);
    padding: var(--gap);
    border-radius: var(--radius);
    border: 1px solid var(--border);

    transition: var(--transition);
    animation: floatIn 1.4s ease-out;
}

.card:hover{
    background: var(--hover-card);
    transform: translateY(-4px);
}

/* =========================================================
   CARD CONTENT
========================================================= */
.icon{
    width: 80px;
    height: 80px;
    object-fit: cover;

    border-radius: var(--radius);
    border: 1px solid var(--border);

    transition: var(--transition);
}

.card:hover .icon{
    transform: scale(1.05);
}

.info h3{
    font-size: 1.4em;
    font-weight: 600;
}

.info p{
    margin-top: 8px;
    font-size: 0.95em;
    color: var(--muted);
}

/* =========================================================
   CARD BUTTONS – FIXED WIDTH (HARD FIX)
========================================================= */

.card .buttons{
    display: flex;
    gap: 12px;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

/* REMOVE FLEX GROW COMPLETELY */
.card .buttons button{
    flex: 0 0 auto;     /* 🔥 this fixes width issue */
    width: 100%;       /* fixed width */
    padding: 10px;
    font-weight: 500;
    border-radius: var(--radius);
    transition: var(--transition);
}

/* OUTLINE BUTTON */
.card .buttons button:first-child{
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
}

/* HOVER EFFECT */
.card .buttons button:first-child:hover{
    background: var(--accent);
    color: #000;
}
/* =========================================================
   LOADING & EMPTY STATES
========================================================= */
#loading{
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;

    padding: 60px 0;
    font-size: 1.1em;
    color: var(--muted);

    animation: floatIn 1.2s ease-out;
}

#loading::before{
    content: '';
    width: 24px;
    height: 24px;

    border: 3px solid var(--accent);
    border-top-color: transparent;
    border-radius: 50%;

    animation: spin 1s linear infinite;
}

.empty{
    padding: 60px 0;
    text-align: center;
    font-size: 16px;
    color: var(--muted);
}

/* =========================================================
   RESPONSIVE
========================================================= */
@media (max-width: 820px){
    .grid{
        grid-template-columns: 1fr;
    }
}

@media (max-width: 768px){
    h1{
        font-size: 2em;
    }

    .controls{
        flex-direction: column;
        gap: 16px;
    }

    select,
    input[type="text"],
    button{
        width: 100%;
    }

    .grid{
        padding: 20px;
    }
}
    </style>
</head>
<body>

    <div class="dashboard">
        <h1>Modrinth Downloader</h1>

        <div class="controls">
            <select id="type"></select>
            <select id="loader"></select>
            <select id="version"></select>
            <input type="text" id="search" placeholder="Search by name">
            <select id="sort">
                <option value="relevance">Relevance</option>
                <option value="downloads">Downloads</option>
                <option value="newest">Newest</option>
                <option value="updated">Updated</option>
            </select>
            <button onclick="searchContent()">Search</button>
        </div>

        <div class="grid" id="grid"></div>
        <div id="loading"></div>
    </div>

<script>
        const grid = document.getElementById("grid");
        const typeEl = document.getElementById("type");
        const loaderEl = document.getElementById("loader");
        const versionEl = document.getElementById("version");
        const searchEl = document.getElementById("search");
        const sortEl = document.getElementById("sort");
        const loadingEl = document.getElementById("loading");

        // Hardcoded project types for Modrinth
        const modrinthTypes = ["mod", "modpack", "resourcepack", "shader", "plugin"];

        let currentPage = 0;
        let isLoading = false;
        let hasMore = true;
        let currentParams = {};

        function populateDropdown(dropdown, options, includeEmpty = true, capitalize = true) {
            dropdown.innerHTML = includeEmpty ? '<option value="">All</option>' : '';
            options.forEach(opt => {
                const el = document.createElement("option");
                el.value = opt;
                el.textContent = capitalize ? opt.charAt(0).toUpperCase() + opt.slice(1) : opt;
                dropdown.appendChild(el);
            });
        }

        async function initModrinth() {
            populateDropdown(typeEl, modrinthTypes);
            await fetchLoaders();
            await fetchVersions();
        }

        async function fetchLoaders() {
            loaderEl.innerHTML = '<option value="">All</option>';
            try {
                const res = await fetch("https://api.modrinth.com/v2/tag/loader");
                const data = await res.json();
                populateDropdown(loaderEl, data, false, true);
            } catch (e) {
                console.error(e);
                const fallbackLoaders = ["bukkit", "canvas", "datastore", "fabric", "folia", "forge", "liteloader", "neoforge", "paper", "purpur", "quilt", "rift", "spigot", "sponge", "velocity", "waterfall"];
                populateDropdown(loaderEl, fallbackLoaders, false, true);
            }
        }

        function createCard(item) {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
                <img class="icon" src="${item.icon || "https://via.placeholder.com/80"}" onerror="this.src='https://via.placeholder.com/80';">
                <div class="info">
                    <h3>${item.title}</h3>
                    <p>${item.desc || "No description"}</p>
                </div>
                <div class="buttons">
                    <button onclick="openPage('${item.url}')">View</button>
                    <button onclick="downloadMod('${item.id}', '${item.type || ''}', '${item.loader || ''}', '${item.version || ''}')">Download</button>
                </div>
            `;
            grid.appendChild(card);
        }

        function openPage(url) {
            window.open(url, "_blank");
        }

        async function downloadMod(id, type, loader, version) {
            let downloadUrl = "";
            try {
                let params = new URLSearchParams();
                if (loader) params.append("loaders", `["${loader}"]`);
                if (version) params.append("game_versions", `["${version}"]`);
                const res = await fetch(`https://api.modrinth.com/v2/project/${id}/version?${params.toString()}`);
                const data = await res.json();
                if (data.length > 0) {
                    downloadUrl = data[0].files.find(f => f.primary)?.url || data[0].files[0].url;
                }
                if (downloadUrl) {
                    window.open(downloadUrl, '_blank');
                } else {
                    alert("No compatible download found.");
                }
            } catch (e) {
                console.error(e);
                alert("Error downloading.");
            }
        }

        /* ====== FETCH VERSIONS DYNAMICALLY ====== */
        async function fetchVersions() {
            versionEl.innerHTML = '<option value="">All Versions</option>';
            let versions = [];
            try {
                const res = await fetch("https://api.modrinth.com/v2/tag/game_version");
                const data = await res.json();
                versions = data.filter(v => v.version_type === "release").map(v => v.version).sort((a,b) => b.localeCompare(a, undefined, {numeric: true}));
                populateDropdown(versionEl, versions, false, false);
            } catch (e) {
                console.error(e);
            }
        }

        /* ====== SEARCH CONTENT ====== */
        function searchContent() {
            currentParams = {
                type: typeEl.value,
                loader: loaderEl.value,
                version: versionEl.value,
                search: searchEl.value.trim(),
                sort: sortEl.value
            };
            grid.innerHTML = "";
            currentPage = 0;
            hasMore = true;
            loadMore();
        }

        async function loadMore() {
            if (isLoading || !hasMore) return;
            isLoading = true;
            loadingEl.textContent = "Loading more...";

            const {type, loader, version, search, sort} = currentParams;
            let results = [];

            try {
                results = await loadModrinth(type, loader, version, search, sort, currentPage);
            } catch (e) {
                console.error(e);
            }

            results.forEach(createCard);
            if (results.length < 20) hasMore = false;
            loadingEl.textContent = "";
            isLoading = false;
            currentPage++;
        }

        window.addEventListener('scroll', () => {
            if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 200 && !isLoading && hasMore) {
                loadMore();
            }
        });

        /* ===== MODRINTH ===== */
        async function loadModrinth(type, loader, version, search, sort, page) {
            let facets = [];
            if (type) {
                let projectType = type;
                if (type === "resourcepack") projectType = "resourcepack";
                if (type === "shader") projectType = "shader";
                facets.push(`["project_type:${projectType}"]`);
            }
            if (loader) facets.push(`["categories:${loader}"]`);
            if (version) facets.push(`["versions:${version}"]`);
            const facetsParam = facets.length ? `&facets=[${facets.join(",")}]` : "";
            const queryParam = search ? `&query=${encodeURIComponent(search)}` : "";
            let index = "";
            if (sort !== "relevance") {
                if (sort === "newest") index = "&index=created";
                else if (sort === "updated") index = "&index=updated";
                else if (sort === "downloads") index = "&index=downloads";
            }
            const offset = `&offset=${page * 20}`;
            const url = `https://api.modrinth.com/v2/search?limit=20${offset}${facetsParam}${queryParam}${index}`;
            const res = await fetch(url);
            const data = await res.json();
            return data.hits.map(p => ({
                title: p.title,
                desc: p.description,
                icon: p.icon_url,
                url: `https://modrinth.com/${p.project_type}/${p.slug}`,
                id: p.project_id,
                type, loader, version
            }));
        }

        // Initial setup
        initModrinth();
        searchContent();
    </script>

</body>
</html>
