<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modrinth Downloader</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* =========================================================
   ROOT VARIABLES
   (Theme, spacing, motion)
========================================================= */
:root{
    --bg: #000000;
    --card: rgba(18,18,28,0.85);
    --soft: rgba(28,28,40,0.9);
    --hover-card: rgba(40,40,55,0.95);

    --text: #ffffff;
    --muted: #aaaaaa;
    --accent: #ffffff;

    --border: rgba(255,255,255,0.12);
    --radius: 12px;
    --gap: 28px;
    --transition: 0.3s ease;
}

/* =========================================================
   GLOBAL RESET & BASE
========================================================= */
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body{
    font-family: 'Poppins', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    overflow-x: hidden;
    line-height: 1.5;
}

/* =========================================================
   ANIMATIONS
========================================================= */
@keyframes floatIn{
    0%{
        opacity: 0;
        transform: translateY(50px);
    }
    100%{
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes spin{
    to{
        transform: rotate(360deg);
    }
}

/* =========================================================
   LAYOUT
========================================================= */
.dashboard{
    display: grid;
    gap: var(--gap);
    max-width: 1180px;
    margin: 0;
    padding: var(--gap) 16px;
}

/* =========================================================
   HEADINGS
========================================================= */
h1{
    text-align: center;
    margin-bottom: 20px;
    font-size: 2.5em;
    font-weight: 700;
    letter-spacing: 1px;
    animation: floatIn 1.2s ease-out;
}

/* =========================================================
   CONTROLS
========================================================= */
.controls{
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;

    background: var(--card);
    padding: var(--gap);
    border-radius: var(--radius);
    border: 1px solid var(--border);

    animation: floatIn 1.2s ease-out;
}

/* =========================================================
   FORM ELEMENTS
========================================================= */
select,
input[type="text"],
button{
    min-width: 160px;
    padding: 12px 18px;

    background: var(--soft);
    color: var(--text);

    border: 1px solid var(--border);
    border-radius: var(--radius);

    font-size: 1em;
    outline: none;
    transition: var(--transition);
}

select{
    appearance: none;
    background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23FFFFFF%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095.1c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.9z%22%2F%3E%3C%2Fsvg%3E');
    background-repeat: no-repeat;
    background-position: right 12px center;
    background-size: 12px;
}

select:focus,
input[type="text"]:focus,
button:focus{
    border-color: var(--accent);
}

/* =========================================================
   BUTTONS
========================================================= */
button{
    background: var(--accent);
    color: #000;
    font-weight: 600;
    cursor: pointer;
    border: none;
}

button:hover{
    transform: translateY(-2px);
}

/* =========================================================
   CARD GRID
========================================================= */
.grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: var(--gap);

    max-width: 1180px;
    width: 100%;
    padding: 0 16px;
}

/* =========================================================
   CARDS
========================================================= */
.card{
    display: flex;
    flex-direction: column;
    gap: 16px;

    background: var(--card);
    padding: var(--gap);
    border-radius: var(--radius);
    border: 1px solid var(--border);

    transition: var(--transition);
    animation: floatIn 1.4s ease-out;
    cursor: pointer;
}

.card:hover{
    background: var(--hover-card);
    transform: translateY(-4px);
}

/* =========================================================
   CARD CONTENT
========================================================= */
.icon{
    width: 80px;
    height: 80px;
    object-fit: cover;

    border-radius: var(--radius);
    border: 1px solid var(--border);

    transition: var(--transition);
}

.card:hover .icon{
    transform: scale(1.05);
}

.info h3{
    font-size: 1.4em;
    font-weight: 600;
}

.info p{
    margin-top: 8px;
    font-size: 0.95em;
    color: var(--muted);
}

/* =========================================================
   LOADING & EMPTY STATES
========================================================= */
#loading{
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;

    padding: 60px 0;
    font-size: 1.1em;
    color: var(--muted);

    animation: floatIn 1.2s ease-out;
}

#loading::before{
    content: '';
    width: 24px;
    height: 24px;

    border: 3px solid var(--accent);
    border-top-color: transparent;
    border-radius: 50%;

    animation: spin 1s linear infinite;
}

.empty{
    padding: 60px 0;
    text-align: center;
    font-size: 16px;
    color: var(--muted);
}

/* =========================================================
   RESPONSIVE
========================================================= */
@media (max-width: 820px){
    .grid{
        grid-template-columns: 1fr;
    }
}

@media (max-width: 768px){
    h1{
        font-size: 2em;
    }

    .controls{
        flex-direction: column;
        gap: 16px;
    }

    select,
    input[type="text"],
    button{
        width: 100%;
    }

    .grid{
        padding: 20px;
    }
}

/* =========================================================
   MODALS
========================================================= */
.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: rgba(0,0,0,0.7);
}

.modal-content {
    background: var(--card);
    margin: 5% auto;
    padding: 20px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    max-height: 90%;
    overflow: auto;
}

.full-modal {
    width: 90%;
    max-width: 1200px;
}

.small-modal {
    width: 40%;
    max-width: 400px;
}

.close {
    color: var(--text);
    float: right;
    font-size: 28px;
    font-weight: bold;
    cursor: pointer;
}

.close:hover {
    color: var(--accent);
}

#projectIcon {
    width: 200px;
    height: 200px;
    object-fit: cover;
    border-radius: var(--radius);
}

#projectGallery img {
    max-width: 100%;
    margin: 10px 0;
    border-radius: var(--radius);
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

    </style>
</head>
<body>

    <div class="dashboard">
        <h1>Modrinth Downloader</h1>

        <div class="controls">
            <select id="type"></select>
            <select id="loader"></select>
            <select id="version"></select>
            <input type="text" id="search" placeholder="Search by name">
            <select id="sort">
                <option value="relevance">Relevance</option>
                <option value="downloads">Downloads</option>
                <option value="newest">Newest</option>
                <option value="updated">Updated</option>
            </select>
            <button onclick="searchContent()">Search</button>
        </div>

        <div class="grid" id="grid"></div>
        <div id="loading"></div>
    </div>

    <!-- Details Modal -->
    <div id="detailsModal" class="modal">
        <div class="modal-content full-modal">
            <div class="top-bar">
                <h2 id="projectTitle"></h2>
                <button id="downloadBtn">Download</button>
                <span class="close" onclick="closeDetails()">&times;</span>
            </div>
            <img id="projectIcon" src="" alt="Project Icon">
            <div id="projectDescription"></div>
            <div id="projectGallery"></div>
        </div>
    </div>

    <!-- Download Modal -->
    <div id="downloadModal" class="modal">
        <div class="modal-content small-modal">
            <span class="close" onclick="closeDownload()">&times;</span>
            <h3>Download Options</h3>
            <label for="dlVersion">Select game version</label>
            <select id="dlVersion"></select>
            <label for="dlLoader">Select platform</label>
            <select id="dlLoader"></select>
            <button id="performDownloadBtn">Download</button>
        </div>
    </div>

<script>
        const grid = document.getElementById("grid");
        const typeEl = document.getElementById("type");
        const loaderEl = document.getElementById("loader");
        const versionEl = document.getElementById("version");
        const searchEl = document.getElementById("search");
        const sortEl = document.getElementById("sort");
        const loadingEl = document.getElementById("loading");

        const detailsModal = document.getElementById("detailsModal");
        const projectTitle = document.getElementById("projectTitle");
        const projectIcon = document.getElementById("projectIcon");
        const projectDescription = document.getElementById("projectDescription");
        const projectGallery = document.getElementById("projectGallery");
        const downloadBtn = document.getElementById("downloadBtn");

        const downloadModal = document.getElementById("downloadModal");
        const dlVersion = document.getElementById("dlVersion");
        const dlLoader = document.getElementById("dlLoader");
        const performDownloadBtn = document.getElementById("performDownloadBtn");

        // Hardcoded project types for Modrinth
        const modrinthTypes = ["mod", "modpack", "resourcepack", "shader", "plugin"];

        // Hardcoded loader categories
        const clientLoaders = ["fabric", "forge", "quilt", "neoforge", "liteloader", "rift"];
        const serverLoaders = ["bukkit", "folia", "paper", "purpur", "spigot", "sponge", "velocity", "waterfall"];

        let currentPage = 0;
        let isLoading = false;
        let hasMore = true;
        let currentParams = {};

        function populateDropdown(dropdown, options, includeEmpty = true, capitalize = true, emptyText = "All") {
            dropdown.innerHTML = includeEmpty ? `<option value="">${emptyText}</option>` : '';
            options.forEach(opt => {
                const el = document.createElement("option");
                el.value = opt;
                el.textContent = capitalize ? opt.charAt(0).toUpperCase() + opt.slice(1) : opt;
                dropdown.appendChild(el);
            });
        }

        async function initModrinth() {
            populateDropdown(typeEl, modrinthTypes, false, true);
            typeEl.value = "mod";
            typeEl.onchange = updateLoaders;
            await fetchVersions();
            updateLoaders();
        }

        function updateLoaders() {
            const selectedType = typeEl.value;
            if (selectedType === "shader" || selectedType === "resourcepack") {
                loaderEl.style.display = "none";
                loaderEl.value = "";
            } else {
                loaderEl.style.display = "inline-block";
                let loadersList = (selectedType === "plugin") ? serverLoaders : clientLoaders;
                populateDropdown(loaderEl, loadersList, true, true);
            }
        }

        function createCard(item) {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
                <img class="icon" src="${item.icon || "https://via.placeholder.com/80"}" onerror="this.src='https://via.placeholder.com/80';">
                <div class="info">
                    <h3>${item.title}</h3>
                    <p>${item.desc || "No description"}</p>
                </div>
            `;
            card.onclick = () => openDetails(item.id);
            grid.appendChild(card);
        }

        async function openDetails(id) {
            detailsModal.style.display = "block";
            try {
                const res = await fetch(`https://api.modrinth.com/v2/project/${id}`);
                const data = await res.json();
                projectTitle.textContent = data.title;
                projectIcon.src = data.icon_url || "https://via.placeholder.com/200";
                projectDescription.innerHTML = marked.parse(data.description);
                projectGallery.innerHTML = '';
                if (data.gallery && data.gallery.length > 0) {
                    data.gallery.forEach(url => {
                        const img = document.createElement('img');
                        img.src = url;
                        projectGallery.appendChild(img);
                    });
                }
                downloadBtn.onclick = () => openDownloadModal(id);
            } catch (e) {
                console.error(e);
                alert("Error loading project details.");
            }
        }

        function closeDetails() {
            detailsModal.style.display = "none";
        }

        async function openDownloadModal(id) {
            downloadModal.style.display = "block";
            try {
                const res = await fetch(`https://api.modrinth.com/v2/project/${id}/version`);
                const versions = await res.json();
                const gameVersionsSet = new Set();
                const loadersSet = new Set();
                versions.forEach(v => {
                    v.game_versions.forEach(gv => gameVersionsSet.add(gv));
                    v.loaders.forEach(l => loadersSet.add(l));
                });
                const gameVersions = Array.from(gameVersionsSet).sort((a, b) => b.localeCompare(a, { numeric: true }));
                const loaders = Array.from(loadersSet);
                populateDropdown(dlVersion, gameVersions, true, false, "Select game version");
                populateDropdown(dlLoader, loaders, true, true, "Select platform");
                performDownloadBtn.onclick = () => {
                    const gv = dlVersion.value;
                    const ld = dlLoader.value;
                    let matching = versions.filter(v => (!gv || v.game_versions.includes(gv)) && (!ld || v.loaders.includes(ld)));
                    if (matching.length) {
                        matching.sort((a, b) => new Date(b.date_published) - new Date(a.date_published));
                        const ver = matching[0];
                        const file = ver.files.find(f => f.primary) || ver.files[0];
                        window.open(file.url, '_blank');
                    } else {
                        alert('No matching version found.');
                    }
                };
            } catch (e) {
                console.error(e);
                alert("Error loading versions.");
            }
        }

        function closeDownload() {
            downloadModal.style.display = "none";
        }

        /* ====== FETCH VERSIONS DYNAMICALLY ====== */
        async function fetchVersions() {
            versionEl.innerHTML = '<option value="">All Versions</option>';
            let versions = [];
            try {
                const res = await fetch("https://api.modrinth.com/v2/tag/game_version");
                const data = await res.json();
                versions = data.filter(v => v.version_type === "release").map(v => v.version).sort((a,b) => b.localeCompare(a, undefined, {numeric: true}));
                populateDropdown(versionEl, versions, false, false);
            } catch (e) {
                console.error(e);
            }
        }

        /* ====== SEARCH CONTENT ====== */
        function searchContent() {
            currentParams = {
                type: typeEl.value,
                loader: loaderEl.value,
                version: versionEl.value,
                search: searchEl.value.trim(),
                sort: sortEl.value
            };
            grid.innerHTML = "";
            currentPage = 0;
            hasMore = true;
            loadMore();
        }

        async function loadMore() {
            if (isLoading || !hasMore) return;
            isLoading = true;
            loadingEl.textContent = "Loading more...";

            const {type, loader, version, search, sort} = currentParams;
            let results = [];

            try {
                results = await loadModrinth(type, loader, version, search, sort, currentPage);
            } catch (e) {
                console.error(e);
            }

            results.forEach(createCard);
            if (results.length < 20) hasMore = false;
            loadingEl.textContent = "";
            isLoading = false;
            currentPage++;
        }

        window.addEventListener('scroll', () => {
            if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 200 && !isLoading && hasMore) {
                loadMore();
            }
        });

        /* ===== MODRINTH ===== */
        async function loadModrinth(type, loader, version, search, sort, page) {
            let facets = [];
            if (type) {
                let projectType = type;
                facets.push(`["project_type:${projectType}"]`);
            }
            if (loader) facets.push(`["categories:${loader}"]`);
            if (version) facets.push(`["versions:${version}"]`);
            const facetsParam = facets.length ? `&facets=[${facets.join(",")}]` : "";
            const queryParam = search ? `&query=${encodeURIComponent(search)}` : "";
            let index = "";
            if (sort !== "relevance") {
                if (sort === "newest") index = "&index=created";
                else if (sort === "updated") index = "&index=updated";
                else if (sort === "downloads") index = "&index=downloads";
            }
            const offset = `&offset=${page * 20}`;
            const url = `https://api.modrinth.com/v2/search?limit=20${offset}${facetsParam}${queryParam}${index}`;
            const res = await fetch(url);
            const data = await res.json();
            return data.hits.map(p => ({
                title: p.title,
                desc: p.description,
                icon: p.icon_url,
                url: `https://modrinth.com/${p.project_type}/${p.slug}`,
                id: p.project_id,
                type: p.project_type
            }));
        }

        // Initial setup
        initModrinth();
        searchContent();
    </script>

</body>
</html>
