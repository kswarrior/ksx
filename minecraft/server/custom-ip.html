<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Custom IP Address</title>

<style>
:root{
  --bg:#000000;
  --card:rgba(18,18,28,0.85);
  --soft:rgba(28,28,40,0.9);
  --hover-card:rgba(40,40,55,0.95);
  --text:#ffffff;
  --muted:#aaaaaa;
  --accent:#ffffff;
  --accent-glow:rgba(255,255,255,0.4);
  --border:rgba(255,255,255,0.12);
  --glow:0 0 20px rgba(255,255,255,0.15);
  --radius:12px;
  --gap:28px;
  --transition:0.5s cubic-bezier(0.22, 1, 0.36, 1);
}

*{ box-sizing:border-box; margin:0; padding:0; }
body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  line-height:1.5;
  overflow-x:hidden;
  user-select:none;
  -webkit-tap-highlight-color: transparent;
  animation:bgPulse 18s ease-in-out infinite alternate;
}

@keyframes bgPulse {
  0% { background:#000000; }
  100% { background:#0a0a0a; }
}

h1.title{
  font-size:28px;
  font-weight:900;
  text-align:center;
  margin-top:40px;
  margin-bottom:10px;
}
h1.my-name{
  font-size:20px;
  font-weight:600;
  text-align:center;
  margin-bottom:40px;
  color:var(--muted);
}
h1.injoy{
  font-size:22px;
  font-weight:800;
  text-align:center;
  margin:40px 0 20px;
}

.all-step{
  max-width:960px;
  margin:auto;
  padding:0 16px 60px;
  display:grid;
  gap:var(--gap);
}

.step-one, .step-two{
  background:var(--card);
  border-radius:var(--radius);
  padding:var(--gap);
  border:1px solid var(--border);
  backdrop-filter:blur(20px);
  transition:all var(--transition);
  cursor:default;
  overflow:hidden;
  position:relative;
}
.step-one:hover, .step-two:hover{
  background:var(--hover-card);
  transform:scale(1.02);
}
.step{
  font-size:18px;
  font-weight:900;
  margin-bottom:12px;
}
.step pre{
  font-family:inherit;
  font-size:inherit;
  display:inline-block;
  background:var(--accent);
  color:#000;
  padding:4px 14px;
  border-radius:999px;
  box-shadow:0 0 10px var(--accent-glow);
}
.step p{
  font-size:14px;
  color:var(--muted);
  margin-bottom:12px;
}

/* ---------- INPUT / BUTTON ---------- */
input.ip-input{
  width:calc(100% - 130px);
  padding:10px 14px;
  border-radius:8px;
  border:none;
  outline:none;
  margin-right:10px;
  font-size:16px;
  background:rgba(255,255,255,0.05);
  color:#fff;
}
button.ip-search{
  padding:10px 20px;
  font-size:16px;
  border:none;
  border-radius:8px;
  background:var(--accent);
  color:#000;
  font-weight:700;
  cursor:pointer;
  transition:all 0.3s ease;
}
button.ip-search:hover{
  transform:scale(1.05);
  box-shadow:0 0 15px var(--accent-glow);
}

/* ---------- RESULT BOX ---------- */
.result-box{
  margin-top:20px;
  background:rgba(255,255,255,0.05);
  border:1px solid var(--border);
  border-radius:12px;
  padding:16px;
  color:#fff;
}
.result-box p{
  margin:6px 0;
  font-size:14px;
}
.label{
  font-weight:700;
  color:var(--accent);
}
.copy-btn{
  background:var(--accent);
  border:none;
  border-radius:6px;
  color:#000;
  font-weight:700;
  padding:2px 8px;
  cursor:pointer;
  margin-left:8px;
  font-size:12px;
  transition:all 0.3s ease;
}
.copy-btn:hover{
  transform:scale(1.1);
  box-shadow:0 0 8px var(--accent-glow);
}

/* ------------------------------
   BUTTONS / LINKS
--------------------------------*/
a.discord{
  display:inline-block;
  text-align:center;
  font-weight:700;
  background:var(--accent);
  color:#000;
  padding:10px 24px;
  border-radius:999px;
  text-decoration:none;
  box-shadow:0 0 10px var(--accent-glow);
  transition:all 0.4s ease;
  margin:20px auto 0;
}
a.discord:hover{
  transform:scale(1.05);
  box-shadow:0 0 25px var(--accent-glow);
}

.end{
  text-align:center;
  font-size:13px;
  color:var(--muted);
  margin-top:8px;
}

@media(max-width:820px){
  .all-step{ gap:20px; }
  h1.title{ font-size:24px; }
  h1.my-name{ font-size:18px; }
  h1.injoy{ font-size:20px; }
  input.ip-input{ width:100%; margin-bottom:10px; }
  button.ip-search{ width:100%; }
}
iframe {
  border: none;
}
</style>
</head>
<body>
<script src="open-main-page.js"></script>
<h1 class="title">Custom IP Address</h1>
<h1 class="my-name">KS Warrior</h1>

<div class="all-step">

  <!-- STEP 1 -->
  <div class="step-one">
    <h3 class="step"><pre>  Step {1}  </pre></h3>
    <p>Enter your server IP or domain:</p>
    <div style="display:flex; flex-wrap:wrap;">
      <input id="ipInput" class="ip-input" placeholder="e.g. aternos.org or 8.8.8.8">
      <button class="ip-search" onclick="loadIPInfo()">Search</button>
    </div>
    <div id="result" class="result-box"></div>
  </div>

  <!-- STEP 2 -->
  <div class="step-two">
    <h3 class="step"><pre>  Step {2}  </pre></h3>
    <p>Fill all information</p>
    <p>Click on create button</p>
    <iframe class="link-two" height="455px" width="100%" src="https://shockbyte.com/es/subdomain-creator"></iframe>
  </div>

  <!-- ENJOY SECTION -->
  <h1 class="injoy">Enjoy Custom IP</h1>
  <a class="discord" href="https://zhhdy.com" target="_blank">Join Discord</a>
  <p class="end">For more things like this</p>
  <p class="end">Also support me</p>

</div>

<script>
const ipv4Regex = /^(?:(?:25[0-5]|2[0-4]\d|1?\d{1,2})\.){3}(?:25[0-5]|2[0-4]\d|1?\d{1,2})$/;
const ipv6Regex = /^[0-9a-fA-F:]+$/;

// resolve domain to IP using Google DNS
async function resolveDomain(domain){
  try{
    const res = await fetch(`https://dns.google/resolve?name=${encodeURIComponent(domain)}&type=A`);
    const data = await res.json();
    if(data.Answer && data.Answer.length > 0){
      const record = data.Answer.find(a=>a.type===1);
      return record ? record.data : null;
    }
    return null;
  }catch{
    return null;
  }
}

async function loadIPInfo(){
  const input = document.getElementById("ipInput").value.trim();
  const result = document.getElementById("result");

  if(!input) return alert("Please enter an IP or domain");

  result.innerHTML = "🔍 Fetching data...";

  let targetIP = input;

  if(ipv4Regex.test(input) || ipv6Regex.test(input)){
    // Valid IP
  }else{
    const resolved = await resolveDomain(input);
    if(!resolved){
      result.innerHTML = "<p style='color:#b91c1c;font-weight:700;'>❌ Domain cannot be resolved.</p>";
      return;
    }
    targetIP = resolved;
  }

  try{
    const res = await fetch(`https://ipapi.co/${targetIP}/json/`);
    const data = await res.json();
    if(data.error){
      result.innerHTML = `<p style='color:#b91c1c;font-weight:700;'>❌ ${data.reason || "Invalid IP Address"}</p>`;
      return;
    }

    result.innerHTML = `
      <p><span class="label">IP Address:</span> ${data.ip} <button class="copy-btn" onclick="copyToClipboard('${data.ip}')">Copy</button></p>
      <p><span class="label">City:</span> ${data.city || 'N/A'}</p>
      <p><span class="label">Region:</span> ${data.region || 'N/A'}</p>
      <p><span class="label">Country:</span> ${data.country_name || 'N/A'}</p>
      <p><span class="label">ISP:</span> ${data.org || 'N/A'}</p>
      <p><span class="label">Timezone:</span> ${data.timezone || 'N/A'}</p>
    `;
  }catch(err){
    result.innerHTML = `<p style='color:#b91c1c;font-weight:700;'>❌ Error: ${err.message}</p>`;
  }
}

function copyToClipboard(text){
  navigator.clipboard.writeText(text).then(()=>{
    alert(`Copied: ${text}`);
  });
}
</script>

</body>
</html>
