<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Server Info</title>

<style>
/* ===============================
   VARIABLES
================================*/
:root{
  --bg:#000000;
  --card:rgba(18,18,28,0.85);
  --soft:rgba(28,28,40,0.9);
  --hover-card:rgba(40,40,55,0.95);
  --text:#ffffff;
  --muted:#aaaaaa;
  --accent:#ffffff;
  --accent-glow:rgba(255,255,255,0.4);
  --border:rgba(255,255,255,0.12);
  --glow:0 0 20px rgba(255,255,255,0.15);
  --radius:12px;
  --gap:28px;
  --transition:0.5s cubic-bezier(0.22, 1, 0.36, 1);
}

/* ------------------------------
   GLOBAL
--------------------------------*/
* { box-sizing:border-box; margin:0; padding:0; }
body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:40px 16px;
  animation:bgPulse 18s ease-in-out infinite alternate;
  user-select:none;
  -webkit-tap-highlight-color: transparent;
  line-height:1.5;
}

@keyframes bgPulse {
  0% { background:#000000; }
  100% { background:#0a0a0a; }
}

/* ------------------------------
   HEADINGS
--------------------------------*/
h1{
  font-size:28px;
  font-weight:900;
  margin-bottom:30px;
  text-align:center;
}
h1 + p{
  text-align:center;
  color:var(--muted);
  margin-bottom:30px;
}

/* ------------------------------
   INPUT & BUTTON
--------------------------------*/
input, button{
  padding:12px 16px;
  margin:5px;
  border-radius:var(--radius);
  border:1px solid var(--border);
  background:var(--soft);
  color:var(--text);
  font-size:14px;
  outline:none;
  transition:all var(--transition);
}
input:focus{
  border-color:var(--accent);
  box-shadow:0 0 10px var(--accent-glow);
  background:var(--hover-card);
}
button{
  background:var(--accent);
  color:#000;
  font-weight:600;
  cursor:pointer;
  box-shadow:0 0 10px var(--accent-glow);
  border:none;
}
button:hover{
  transform:scale(1.05);
  box-shadow:0 0 25px var(--accent-glow);
}

/* ------------------------------
   INFO CARD
--------------------------------*/
.info{
  margin-top:30px;
  background:var(--card);
  padding:var(--gap);
  border-radius:var(--radius);
  width:100%;
  max-width:400px;
  text-align:left;
  word-wrap:break-word;
  border:1px solid var(--border);
  backdrop-filter:blur(20px);
  box-shadow: var(--glow);
  opacity:0;
  transform:translateY(20px);
  transition:all 0.6s ease;
}
.info.show{
  opacity:1;
  transform:translateY(0);
}
.info p{
  margin-bottom:10px;
  font-size:14px;
}
.info p strong{
  color:var(--accent);
}
.info ul {
  list-style-type: none;
  padding-left: 20px;
}
.info ul li {
  margin-bottom: 5px;
}
.info img {
  max-width: 100%;
  height: auto;
  margin-bottom: 10px;
}

/* ------------------------------
   RESPONSIVE
--------------------------------*/
@media(max-width:480px){
  input, button{
    width:100%;
  }
  .info{
    width:100%;
  }
}
</style>
</head>
<body>
<script src="/open-main-page.js"></script>
<h1>Minecraft Server Info</h1>
<p>Enter the IP to fetch server details</p>

<input type="text" id="ipInput" placeholder="Enter server IP">
<button onclick="getServerInfo()">Search</button>

<div class="info" id="serverInfo">
    <img id="icon" alt="Server Icon">
    <p><strong>MOTD:</strong> <span id="motd"></span></p>
    <p><strong>Players:</strong> <span id="players"></span></p>
    <p><strong>Version:</strong> <span id="version"></span></p>
    <p><strong>EULA Blocked:</strong> <span id="eulaBlocked"></span></p>
    <p><strong>Software:</strong> <span id="software"></span></p>
    <p><strong>Map:</strong> <span id="map"></span></p>
    <p><strong>Protocol:</strong> <span id="protocol"></span></p>
    <p><strong>Hostname:</strong> <span id="hostname"></span></p>
    <p><strong>Resolved IP:</strong> <span id="resolvedIp"></span></p>
    <p><strong>Additional Info:</strong> <span id="info"></span></p>
    <p><strong>Player List:</strong></p>
    <ul id="playerList"></ul>
    <p><strong>Plugins:</strong></p>
    <ul id="plugins"></ul>
    <p><strong>Mods:</strong></p>
    <ul id="mods"></ul>
</div>

<script>
async function getServerInfo() {
    const ip = document.getElementById("ipInput").value.trim();
    if(!ip) return alert("Please enter a server IP");

    try {
        const response = await fetch(`https://api.mcsrvstat.us/3/${ip}`);
        if(!response.ok) throw new Error("Failed to fetch server data");
        const data = await response.json();

        if(data.online) {
            const motdText = data.motd && data.motd.clean ? data.motd.clean.join("\n") : "N/A";
            const playersText = data.players ? `${data.players.online}/${data.players.max}` : "N/A";
            const versionText = data.version || "N/A";
            const eulaBlockedText = data.eula_blocked === true ? "Yes" : "No";
            const softwareText = data.software || "N/A";
            const mapText = data.map && data.map.clean ? data.map.clean : "N/A";
            const protocolText = data.protocol && data.protocol.name ? data.protocol.name : (data.protocol && data.protocol.version ? data.protocol.version : "N/A");
            const hostnameText = data.hostname || "N/A";
            const resolvedIpText = `${data.ip}:${data.port}`;
            const infoText = data.info && data.info.clean ? data.info.clean.join("\n") : "N/A";

            document.getElementById("motd").innerText = motdText;
            document.getElementById("players").innerText = playersText;
            document.getElementById("version").innerText = versionText;
            document.getElementById("eulaBlocked").innerText = eulaBlockedText;
            document.getElementById("software").innerText = softwareText;
            document.getElementById("map").innerText = mapText;
            document.getElementById("protocol").innerText = protocolText;
            document.getElementById("hostname").innerText = hostnameText;
            document.getElementById("resolvedIp").innerText = resolvedIpText;
            document.getElementById("info").innerText = infoText;
            document.getElementById("icon").src = data.icon || "";

            // Player List
            const playerListUl = document.getElementById("playerList");
            playerListUl.innerHTML = "";
            if (data.players && data.players.list) {
                data.players.list.forEach(player => {
                    const li = document.createElement("li");
                    li.innerText = `${player.name} (UUID: ${player.uuid})`;
                    playerListUl.appendChild(li);
                });
            } else {
                const li = document.createElement("li");
                li.innerText = "N/A or Query not enabled";
                playerListUl.appendChild(li);
            }

            // Plugins
            const pluginsUl = document.getElementById("plugins");
            pluginsUl.innerHTML = "";
            if (data.plugins) {
                data.plugins.forEach(plugin => {
                    const li = document.createElement("li");
                    li.innerText = `${plugin.name} v${plugin.version}`;
                    pluginsUl.appendChild(li);
                });
            } else {
                const li = document.createElement("li");
                li.innerText = "N/A or Query not enabled";
                pluginsUl.appendChild(li);
            }

            // Mods
            const modsUl = document.getElementById("mods");
            modsUl.innerHTML = "";
            if (data.mods) {
                data.mods.forEach(mod => {
                    const li = document.createElement("li");
                    li.innerText = `${mod.name} v${mod.version}`;
                    modsUl.appendChild(li);
                });
            } else {
                const li = document.createElement("li");
                li.innerText = "N/A or Query not enabled";
                modsUl.appendChild(li);
            }

            const infoDiv = document.getElementById("serverInfo");
            infoDiv.style.display = "block";
            setTimeout(()=>infoDiv.classList.add("show"),10);
        } else {
            alert("Server is offline or invalid IP!");
            const infoDiv = document.getElementById("serverInfo");
            infoDiv.style.display = "none";
            infoDiv.classList.remove("show");
        }
    } catch (error) {
        console.error(error);
        alert("Error fetching server info. Check the IP or try again later.");
        const infoDiv = document.getElementById("serverInfo");
        infoDiv.style.display = "none";
        infoDiv.classList.remove("show");
    }
}
</script>

</body>
</html>
