<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Server Info</title>

<style>
/* ===============================
   VARIABLES
================================*/
:root{
  --bg:#000000;
  --card:rgba(18,18,28,0.85);
  --soft:rgba(28,28,40,0.9);
  --hover-card:rgba(40,40,55,0.95);
  --text:#ffffff;
  --muted:#aaaaaa;
  --accent:#ffffff;
  --accent-glow:rgba(255,255,255,0.4);
  --border:rgba(255,255,255,0.12);
  --glow:0 0 20px rgba(255,255,255,0.15);
  --radius:12px;
  --gap:28px;
  --transition:0.5s cubic-bezier(0.22, 1, 0.36, 1);
}

/* ------------------------------
   GLOBAL
--------------------------------*/
*{ box-sizing:border-box; margin:0; padding:0; }
body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:40px 16px;
  animation:bgPulse 18s ease-in-out infinite alternate;
  user-select:none;
  -webkit-tap-highlight-color: transparent;
  line-height:1.5;
}

@keyframes bgPulse {
  0% { background:#000000; }
  100% { background:#0a0a0a; }
}

/* ------------------------------
   HEADINGS
--------------------------------*/
h1{
  font-size:28px;
  font-weight:900;
  margin-bottom:30px;
  text-align:center;
}
h1 + p{
  text-align:center;
  color:var(--muted);
  margin-bottom:30px;
}

/* ------------------------------
   INPUT & BUTTON
--------------------------------*/
input, button{
  padding:12px 16px;
  margin:5px;
  border-radius:var(--radius);
  border:1px solid var(--border);
  background:var(--soft);
  color:var(--text);
  font-size:14px;
  outline:none;
  transition:all var(--transition);
}
input:focus{
  border-color:var(--accent);
  box-shadow:0 0 10px var(--accent-glow);
  background:var(--hover-card);
}
button{
  background:var(--accent);
  color:#000;
  font-weight:600;
  cursor:pointer;
  box-shadow:0 0 10px var(--accent-glow);
  border:none;
}
button:hover{
  transform:scale(1.05);
  box-shadow:0 0 25px var(--accent-glow);
}

/* ------------------------------
   INFO CARD
--------------------------------*/
.info{
  margin-top:30px;
  background:var(--card);
  padding:var(--gap);
  border-radius:var(--radius);
  width:100%;
  max-width:400px;
  text-align:left;
  word-wrap:break-word;
  border:1px solid var(--border);
  backdrop-filter:blur(20px);
  box-shadow: var(--glow);
  opacity:0;
  transform:translateY(20px);
  transition:all 0.6s ease;
}
.info.show{
  opacity:1;
  transform:translateY(0);
}
.info p{
  margin-bottom:10px;
  font-size:14px;
}
.info p strong{
  color:var(--accent);
}

/* ------------------------------
   RESPONSIVE
--------------------------------*/
@media(max-width:480px){
  input, button{
    width:100%;
  }
  .info{
    width:100%;
  }
}
</style>
</head>
<body>

<h1>Minecraft Server Info</h1>
<p>Enter the IP to fetch server details</p>

<input type="text" id="ipInput" placeholder="Enter server IP">
<button onclick="getServerInfo()">Search</button>

<div class="info" id="serverInfo">
    <p><strong>MOTD:</strong> <span id="motd"></span></p>
    <p><strong>Players:</strong> <span id="players"></span></p>
    <p><strong>Version:</strong> <span id="version"></span></p>
    <p><strong>Online Mode:</strong> <span id="onlineMode"></span></p>
    <p><strong>IP:</strong> <span id="ip"></span></p>
</div>

<script>
async function getServerInfo() {
    const ip = document.getElementById("ipInput").value.trim();
    if(!ip) return alert("Please enter a server IP");

    try {
        const response = await fetch(`https://api.mcsrvstat.us/2/${ip}`);
        if(!response.ok) throw new Error("Failed to fetch server data");
        const data = await response.json();

        if(data.online) {
            const motdText = data.motd && data.motd.clean ? data.motd.clean.join("\n") : "N/A";
            const playersText = data.players ? `${data.players.online}/${data.players.max}` : "N/A";
            const versionText = data.version || "N/A";
            const onlineModeText = data.authenticating === true ? "Yes" : "No";

            document.getElementById("motd").innerText = motdText;
            document.getElementById("players").innerText = playersText;
            document.getElementById("version").innerText = versionText;
            document.getElementById("onlineMode").innerText = onlineModeText;
            document.getElementById("ip").innerText = ip;

            const infoDiv = document.getElementById("serverInfo");
            infoDiv.style.display = "block";
            setTimeout(()=>infoDiv.classList.add("show"),10);
        } else {
            alert("Server is offline or invalid IP!");
            const infoDiv = document.getElementById("serverInfo");
            infoDiv.style.display = "none";
            infoDiv.classList.remove("show");
        }
    } catch (error) {
        console.error(error);
        alert("Error fetching server info. Check the IP or try again later.");
        const infoDiv = document.getElementById("serverInfo");
        infoDiv.style.display = "none";
        infoDiv.classList.remove("show");
    }
}
</script>

</body>
</html>
