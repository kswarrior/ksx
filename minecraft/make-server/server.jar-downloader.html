<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MC Server.jar Downloader</title>

<style>
/* ================= ROOT ================= */
:root{
  --bg:#000;
  --panel:#0f0f0f;
  --panel-soft:#141414;
  --text:#ffffff;
  --muted:#9a9a9a;
  --border:rgba(255,255,255,.12);
  --accent:#ffffff;
  --success:#7dff9a;
  --error:#ff6b6b;
}

/* ================= RESET ================= */
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

/* ================= BODY ================= */
body{
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  background:
    radial-gradient(circle at top, #111, #000 60%);
  color:var(--text);
  min-height:100dvh;
  display:flex;
  justify-content:center;
}

/* ================= CONTAINER ================= */
.container{
  width:100%;
  max-width:720px;
  padding:50px 35px;
}

/* ================= HEADER ================= */
h1{
  font-size:25px;
  font-weight:900;
  letter-spacing:.3px;
}

.subtitle{
  margin-top:6px;
  font-size:14px;
  color:var(--muted);
  margin-bottom:32px;
}

/* ================= FORM ================= */
.form-group{
  display:flex;
  flex-direction:column;
  gap:8px;
  flex:1;
}

label{
  font-size:15px;
}

.row{
  display:flex;
  gap:14px;
  margin-bottom:18px;
}

select,
input{
  background:var(--panel);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:10px;
  padding:14px 15px;
  font-size:15px;
  outline:none;
  transition:.2s ease;
  width: 100%;
}

select:hover,
input:hover{
  border-color:rgba(255,255,255,.25);
}

select:focus,
input:focus{
  border-color:var(--accent);
}

/* ================= BUTTON ================= */
button{
  width:100%;
  margin-top:8px;
  background:var(--accent);
  color:#000;
  border:none;
  border-radius:10px;
  padding:15px;
  font-weight:900;
  font-size:15px;
  cursor:pointer;
  transition:.2s ease;
}

button:hover{
  opacity:.85;
  transform:translateY(-1px);
}

button.secondary{
  background:transparent;
  color:var(--text);
  border:1px solid var(--border);
}

/* ================= RESULT ================= */
.result{
  margin-top:28px;
  display:none;
  background:var(--panel-soft);
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px;
}

.status{
  font-size:14px;
  margin-bottom:14px;
}

.loading{color:var(--muted)}
.success{color:var(--success)}
.error{color:var(--error)}

.actions{
  display:flex;
  gap:10px;
  margin-top:12px;
}

.actions button{
  flex:1;
  margin-top:0;
}

#url{
  font-size:13px;
  background:#060606;
  cursor:text;
}
</style>
</head>

<body>

<div class="container">

  <h1>MC Server.jar Downloader</h1>
  <div class="subtitle">Fast, clean & direct server downloads</div>

  <!-- TYPE + VERSION -->
  <div class="row">
    <div class="form-group">
      <label for="type">Server Type</label>
      <select id="type">
        <option value="paper">Paper</option>
        <option value="folia">Folia</option>
        <option value="purpur">Purpur</option>
        <option value="velocity">Velocity</option>
        <option value="waterfall">Waterfall</option>
        <option value="vanilla">Vanilla</option>
        <option value="fabric">Fabric</option>
        <option value="quilt">Quilt</option>
        <option value="forge">Forge</option>
        <option value="neoforge">NeoForge (Not complete)</option>
        <option value="spigot">Spigot</option>
      </select>
    </div>

    <div class="form-group">
      <label for="version">Version</label>
      <input id="version" placeholder="e.g. 1.21.4">
    </div>
  </div>

  <button onclick="startFetch()">Find Server.jar</button>

  <!-- RESULT -->
  <div class="result" id="result">
    <div class="status loading" id="status">Waiting…</div>
    <input id="url" readonly>

    <div class="actions" id="actions" style="display:none">
      <button onclick="downloadJar()">Download</button>
      <button class="secondary" onclick="copyURL()">Copy URL</button>
    </div>
  </div>

</div>

<script>
/* =======================
   API ENDPOINTS
======================= */
const API = {
  PAPER: "https://api.papermc.io/v2/projects",
  PURPUR: "https://api.purpurmc.org/v2/purpur",
  MOJANG: "https://launchermeta.mojang.com/mc/game/version_manifest.json",
  FABRIC: "https://meta.fabricmc.net/v2/versions/installer",
  QUILT: "https://meta.quiltmc.org/v3/versions/installer",
  FORGE_PROMOS: "https://files.minecraftforge.net/maven/net/minecraftforge/forge/promotions_slim.json",
  NEOFORGE_META: "https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml"
};

/* =======================
   ELEMENTS
======================= */
const typeSelect   = document.getElementById("type");
const versionInput = document.getElementById("version");
const resultBox    = document.getElementById("result");
const statusText   = document.getElementById("status");
const urlBox       = document.getElementById("url");
const actionsBox   = document.getElementById("actions");

/* =======================
   PLACEHOLDER HANDLING
======================= */
typeSelect.addEventListener("change", updatePlaceholder);
updatePlaceholder();

function updatePlaceholder(){
  const t = typeSelect.value;

  if (t === "spigot") {
    versionInput.placeholder = "Not required";
  } 
  else if (t === "velocity") {
    versionInput.placeholder = "optional";
  } 
  else if (t === "fabric" || t === "quilt") {
    versionInput.placeholder = "optional";
  } 
  else {
    versionInput.placeholder = "required";
  }
}

/* =======================
   UI HELPERS
======================= */
function setStatus(text, type="loading"){
  statusText.textContent = text;
  statusText.className = "status " + type;
}

function showResult(){
  resultBox.style.display = "block";
  actionsBox.style.display = "flex";
}

/* =======================
   PAPER-LIKE HANDLER
======================= */
async function getPaperLike(project, version){
  const r = await fetch(`${API.PAPER}/${project}/versions/${version}`);
  if (!r.ok) throw "Version not found";

  const d = await r.json();
  const build = Math.max(...d.builds);

  return `${API.PAPER}/${project}/versions/${version}/builds/${build}/downloads/${project}-${version}-${build}.jar`;
}

/* =======================
   MAIN FETCH
======================= */
async function startFetch(){
  const type    = typeSelect.value;
  let version   = versionInput.value.trim();

  urlBox.value = "";
  actionsBox.style.display = "none";
  resultBox.style.display = "block";
  setStatus("Fetching download link…", "loading");

  try {
    let url = "";

    /* ---- PAPER BASED ---- */
    if (["paper","folia","velocity","waterfall"].includes(type)) {

      if (!version && type !== "velocity")
        throw "Version required";

      if (type === "waterfall")
        version = version.split(".").slice(0,2).join(".");

      if (type === "velocity" && !version){
        const r = await fetch(`${API.PAPER}/velocity`);
        const d = await r.json();
        const stable = d.versions.filter(v => !v.includes("SNAPSHOT"));
        version = stable.at(-1);
      }

      url = await getPaperLike(type, version);
    }

    /* ---- PURPUR ---- */
    else if (type === "purpur"){
      if (!version) throw "Version required";
      url = `${API.PURPUR}/${version}/latest/download`;
    }

    /* ---- VANILLA ---- */
    else if (type === "vanilla"){
      if (!version) throw "Version required";

      const manifest = await fetch(API.MOJANG).then(r=>r.json());
      const found = manifest.versions.find(v => v.id === version);
      if (!found) throw "Version not found";

      const data = await fetch(found.url).then(r=>r.json());
      url = data.downloads.server.url;
    }

    /* ---- SPIGOT ---- */
    else if (type === "spigot"){
      url = "https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/BuildTools.jar";
    }

    /* ---- FABRIC ---- */
    else if (type === "fabric"){
      const meta = await fetch(API.FABRIC).then(r=>r.json());
      const selected = version ? meta.find(v=>v.version===version) : meta[0];
      if (!selected) throw "Installer version not found";
      url = selected.url;
    }

    /* ---- QUILT ---- */
    else if (type === "quilt"){
      const meta = await fetch(API.QUILT).then(r=>r.json());
      const selected = version ? meta.find(v=>v.version===version) : meta[0];
      if (!selected) throw "Installer version not found";
      url = selected.url;
    }

    /* ---- FORGE ---- */
    else if (type === "forge") {
  if (!version) throw "Version required";

  const metaUrl = `https://maven.minecraftforge.net/net/minecraftforge/forge/maven-metadata.xml`;
  const xml = await fetch(metaUrl).then(r => r.text());
  const doc = new DOMParser().parseFromString(xml, "text/xml");

  const versions = [...doc.getElementsByTagName("version")]
    .map(v => v.textContent)
    .filter(v => v.startsWith(version + "-"));

  if (!versions.length) throw "Version not found";

  versions.sort((a,b)=>a.localeCompare(b, undefined, {numeric:true}));
  const latest = versions.at(-1);

  url = `https://maven.minecraftforge.net/net/minecraftforge/forge/${latest}/forge-${latest}-installer.jar`;
}

    /* ---- NEOFORGE ---- */
    else if (type === "neoforge") {
  if (!version) throw "Version required";

  const mc = version.replace(/^1\./, "");
  const [major] = mc.split(".");

  const minor = major === "21" ? "0" : mc.split(".")[1];
  const prefix = `${major}.${minor}.`;

  const metaUrl = cors(
    "https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml"
  );

  const xml = await fetch(metaUrl).then(r => r.text());
  const doc = new DOMParser().parseFromString(xml, "text/xml");

  const versions = [...doc.getElementsByTagName("version")]
    .map(v => v.textContent)
    .filter(v => v.startsWith(prefix));

  if (!versions.length) throw "Version not found";

  versions.sort((a,b)=>a.localeCompare(b, undefined, {numeric:true}));
  const latest = versions.at(-1);

  url = `https://maven.neoforged.net/releases/net/neoforged/neoforge/${latest}/neoforge-${latest}-installer.jar`;
}

    /* ---- SUCCESS ---- */
    urlBox.value = url;
    setStatus("Ready to download", "success");
    showResult();

  } catch(err){
    setStatus("Error: " + err, "error");
  }
}

/* =======================
   ACTIONS
======================= */
function downloadJar(){
  if (urlBox.value) window.location.href = urlBox.value;
}

function copyURL(){
  if (!urlBox.value) return;
  navigator.clipboard.writeText(urlBox.value);
  setStatus("Copied to clipboard", "success");
}
</script>

</body>
</html>
