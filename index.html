<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KS Warrior – KSX Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #eef3ff;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      flex-grow: 1;
    }
  </style>
</head>
<body>

<iframe id="page-frame"></iframe>

<script>
  // Map of keys to full URLs or local files
  const pageMap = {
    "dashboard": "https://ksx.pages.dev/dashboard.html",
    "about": "https://ksx.pages.dev/about.html",
    "contact": "https://ksx.pages.dev/contact.html",
    "free": "mc/hosting/free.html"
  };

  // Get query string (everything after ?)
  let query = window.location.search;

  // Remove leading "?" and optional "="
  if (query.startsWith("?=")) {
    query = query.slice(2); // removes ?=
  } else if (query.startsWith("?")) {
    query = query.slice(1); // removes ?
  }

  // Default to "dashboard" if no query or invalid key
  const key = query in pageMap ? query : "dashboard";

  // Set iframe src
  document.getElementById("page-frame").src = pageMap[key];
</script>

</body>
</html>
