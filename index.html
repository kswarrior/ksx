<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <!-- Mobile + performance -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <!-- SEO Essentials -->
  <title>KS Warrior</title>
  <meta name="description" content="KS Warrior – Fast, modern tech website with clean UI and powerful tools." />
  <meta name="robots" content="index, follow" />

  <!-- Social Sharing -->
  <meta property="og:title" content="KS Warrior">
  <meta property="og:description" content="Explore KS Warrior – modern tools, gaming, and tech content.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ks-main.pages.dev/">

  <!-- Performance -->
  <link rel="preconnect" href="https://ks-main.pages.dev">
  <link rel="dns-prefetch" href="https://ks-main.pages.dev">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #000;
    }

    iframe {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
    }
  </style>
</head>

<body>
  <iframe
    src="https://ks-main.pages.dev/"
    title="KS Warrior Main"
    loading="eager"
    allowfullscreen
    referrerpolicy="no-referrer"
    sandbox="allow-same-origin allow-scripts allow-popups allow-forms"
  >
  </iframe>
</body>
</html>
