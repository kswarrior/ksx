<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>KS Warrior</title>
<style>
  /* ---------------------------
     Base & layout (keep ids)
     --------------------------- */
  :root{
    --bg:#f4f7fb;
    --top:#091233;
    --muted:#718096;
    --accent-1: #2563eb;
    --accent-2: #60a5fa;
    --glass: rgba(255,255,255,0.6);
  }

  html,body{height:100%;margin:0;background:linear-gradient(180deg,var(--bg),#eef4ff);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial; color:#0b1220}

  /* Top bar */
  #topbar{
    width:100%;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 14px;
    background: linear-gradient(90deg, rgba(13,37,77,0.95), rgba(6,25,52,0.92));
    color:#fff;
    position:fixed;
    top:0;
    left:0;
    z-index:80;
    height:56px;
    backdrop-filter: blur(6px) saturate(120%);
    box-shadow: 0 6px 18px rgba(6,20,40,0.35);
  }

  /* Logo (top-left) */
  .logo-wrap{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
  }

 .logo img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  }

  /* Keep existing searchBox id; hidden by default and animated open */
  #searchBox{
    flex:1;
    padding:10px 14px;
    border:0;
    border-radius:10px;
    font-size:15px;
    outline:none;
    background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    color: #e6eefc;
    box-shadow: inset 0 -1px 0 rgba(255,255,255,0.02);
    transition: width .28s cubic-bezier(.2,.9,.2,1), opacity .18s ease, transform .18s ease;
    width: 0;
    max-width: 20%;
    opacity: 0;
    transform: translateX(8px);
    margin-left:6px;
  }

  /* Search button (original id preserved) - only used in expanded mode */
  #searchBtn{
    padding:9px 14px;
    background: linear-gradient(90deg,var(--accent-1),var(--accent-2));
    color:#fff;
    border:0;
    border-radius:10px;
    cursor:pointer;
    font-size:14px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    box-shadow: 0 6px 18px rgba(37,99,235,0.18);
    transform-origin:center right;
    transition: transform .12s ease, opacity .12s ease;
    opacity:0;
    pointer-events:none;
  }

  /* visible state for search (added/removed by JS on topbar) */
  #topbar.search-active #searchBox {
    width: clamp(220px, 45vw, 700px);
    opacity:1;
    transform:none;
  }
  #topbar.search-active #searchBtn {
    opacity:1;
    pointer-events:auto;
  }

  /* Search icon button (initial visible) */
  .btn-icon {
    width:40px;
    height:40px;
    display:inline-grid;
    place-items:center;
    background:transparent;
    border-radius:10px;
    cursor:pointer;
    border:1px solid rgba(255,255,255,0.06);
    transition: background .14s ease, transform .12s ease;
  }

  .btn-icon:hover{ background: rgba(255,255,255,0.03); transform: translateY(-1px); }

  /* Left-side sidebar (hidden by default) */
  #sidebar {
    --w:280px;
    position:fixed;
    left:calc(-1 * var(--w));
    top:56px; /* below topbar */
    width:var(--w);
    height:calc(100% - 56px);
    background: linear-gradient(180deg,#ffffff, #f3f7ff);
    box-shadow: 8px 0 28px rgba(11,20,40,0.12);
    border-right:1px solid rgba(6,25,52,0.04);
    padding:16px;
    box-sizing:border-box;
    transition: left .26s cubic-bezier(.2,.9,.2,1);
    z-index:70;
    overflow:auto;
    backdrop-filter: blur(6px);
  }
  /* when open (class toggled by JS on body) */
  body.sidebar-open #sidebar{ left:0; }

  /* content inside sidebar */
  #sidebar h3{ margin:0 0 10px 0; font-size:14px; color:#072048; letter-spacing:0.4px }
  #sidebar a{ display:block; padding:8px 10px; margin:6px 0; border-radius:8px; text-decoration:none; color:#072048; font-weight:600; font-size:14px }
  #sidebar a:hover{ background: linear-gradient(90deg, rgba(37,99,235,0.06), rgba(96,165,250,0.03)); }

  /* Hamburger button (top-right) */
  #hamburger {
    margin-left:auto;
    display:inline-grid;
    place-items:center;
    width:40px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,0.06);
    background:transparent; cursor:pointer;
    transition: transform .12s ease, background .12s ease;
  }
  #hamburger:hover{ background: rgba(255,255,255,0.03); transform: translateY(-1px); }

  /* Page frame area (original id preserved) */
  #frame {
    position:fixed;
    left:0;
    top:56px;
    width:100vw;
    height:calc(100vh - 56px);
    border:0;
    background: #fff;
    transition: transform .26s cubic-bezier(.2,.9,.2,1);
    z-index:0;
  }

  /* When sidebar open, nudge frame to the right on wide screens */
  @media (min-width:720px){
    body.sidebar-open #frame{
      transform: translateX(260px) scale(.995);
      box-shadow: -8px 0 30px rgba(12,25,48,0.06);
      border-radius:10px 0 0 10px;
      overflow:hidden;
    }
  }

  /* Small screens: sidebar overlays */
  @media (max-width:719px){
    #sidebar{ left:-100%; width:78vw; }
    body.sidebar-open #sidebar{ left:0; }
    body.sidebar-open #frame{ transform: none; filter: brightness(.92) blur(.0px); }
  }

  /* Small touch-friendly spacing for topbar items */
  .right-controls{ display:flex; gap:10px; align-items:center; margin-left:auto; }

  /* Logo visuals */
  .logo {
    width:42px; height:42px; border-radius:8px;
    display:grid;place-items:center;
    background: linear-gradient(135deg,var(--accent-2),var(--accent-1));
    box-shadow: 0 6px 18px rgba(37,99,235,0.18);
    font-weight:800; color:white; font-size:14px;
    user-select:none;
  }
  .brand-text{ font-weight:700; font-size:14px; color: #eaf2ff; margin-left:6px; display:none; }

  /* show brand text on wider screens */
  @media (min-width:920px){ .brand-text{ display:inline-block } }

  /* subtle helper */
  .sr-only{ position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0; }
</style>
</head>
<body>

<!-- Top Bar (ids preserved) -->
<div id="topbar" aria-label="Top bar">
  <!-- Logo left -->
  <div class="logo-wrap" role="img" aria-label="KS logo">
    <div class="logo" id="ksLogo">
  <img src="/image/ks-logo.webp" alt="KSX Logo">
    </div>
    <div class="brand-text">KS</div>
  </div>

  <!-- Search icon (visible initially). clicking toggles search input -->
  <button class="btn-icon" id="searchIcon" aria-label="Open search" title="Search">
    <!-- magnifier svg -->
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <!-- Keep original searchBox & searchBtn IDs (hidden by default, revealed by JS) -->
  <input id="searchBox" type="text" placeholder="Search ... " aria-label="Search" />
  <button id="searchBtn" title="Search">Search</button>

  <!-- right controls: hamburger -->
  <div class="right-controls" role="group" aria-label="Right controls">
    <button id="hamburger" aria-label="Open menu" title="Menu">
      <!-- hamburger SVG -->
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</div>

<!-- Sidebar that opens from left -->
<nav id="sidebar" aria-label="Sidebar navigation">
  <h3>ks_warrior_pro</h3>
  <a href="#" onclick="loadInFrame('about.html')">About</a>
  <a href="#" onclick="loadInFrame('dashboard.html')">Dashboard</a>
  <a href="#" onclick="loadInFrame('search.html')">Search</a>
  <hr style="opacity:.06;margin:12px 0;">
</nav>

<!-- Keep original iframe id -->
<iframe id="frame" src="" title="Content frame"></iframe>

<script>
/* =========================================================
   UI ELEMENTS
========================================================= */
const topbar = document.getElementById('topbar');
const searchIcon = document.getElementById('searchIcon');
const searchBox = document.getElementById('searchBox');
const searchBtn = document.getElementById('searchBtn');
const hamburger = document.getElementById('hamburger');
const frame = document.getElementById('frame');


/* =========================================================
   SEARCH ICON TOGGLE (open/close)
========================================================= */
searchIcon.addEventListener('click', () => {
  const active = topbar.classList.toggle('search-active');

  if (active) {
    setTimeout(() => searchBox.focus(), 160);
    searchIcon.setAttribute('aria-label','Close search');
    searchIcon.title = 'Close';
  } else {
    searchBox.value = "";
    searchIcon.setAttribute('aria-label','Open search');
    searchIcon.title = 'Search';
  }
});

/* close search when clicking outside */
document.addEventListener('click', (ev) => {
  if (!topbar.contains(ev.target) && topbar.classList.contains('search-active')) {
    topbar.classList.remove('search-active');
  }
});

/* keyboard shortcuts */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (topbar.classList.contains('search-active'))
      topbar.classList.remove('search-active');

    if (document.body.classList.contains('sidebar-open'))
      document.body.classList.remove('sidebar-open');
  }

  if (e.key === 'Enter' && document.activeElement === searchBox) {
    performSearch(searchBox.value);
  }
});

/* search button */
searchBtn.addEventListener('click', () => performSearch(searchBox.value));

function performSearch(q){
  q = String(q || "").trim();
  if (!q) {
    loadInFrame("search.html");
    return;
  }
  const encoded = encodeURIComponent(q);
  loadInFrame("search.html?s=" + encoded);
  topbar.classList.remove('search-active');
}


/* =========================================================
   SIDEBAR / HAMBURGER
========================================================= */
hamburger.addEventListener('click', () => {
  document.body.classList.toggle('sidebar-open');
});


/* =========================================================
   IFRAME LOADER
========================================================= */
function loadInFrame(path){
  frame.src = path;
  document.body.classList.remove('sidebar-open');
}


/* =========================================================
   MAIN LOGIC FOR ?m= AND ?s=
   (This is from your second script — primary logic)
========================================================= */

/* 1. Pages for ?m= */
const pages = {
  dashboard: "dashboard.html",
  about: "about.html",
  contact: "contact.html",
  free: "mc/hosting/free.html"
};

/* helper */
function getQuery(name){
  const p = new URLSearchParams(location.search);
  return p.get(name);
}

/* 2. Handle URL params */
async function init(){
  const m = getQuery("m");
  const s = getQuery("s");

  /* Case 1: ?m=pageKey */
  if(m){
    const key = m.toLowerCase();
    if(pages[key]){
      frame.src = pages[key];
      return;
    }
  }

  /* Case 2: ?s=value (search from JSON) */
  if(s){
    try{
      const res = await fetch("search-data.json");
      const data = await res.json();
      const q = s.toLowerCase();

      const found = data.find(x =>
        (x.name || "").toLowerCase().includes(q)
      );

      if(found && found.url){
        frame.src = found.url;
        return;
      }
    }catch(e){
      console.warn("search-data.json error", e);
    }
  }

  /* Default → Dashboard */
  frame.src = "dashboard.html";
}

init();

/* 3. Top bar search triggers ?s= */
searchBtn.onclick = () => {
  const value = searchBox.value.trim();
  if (value) {
    location.href = "?s=" + encodeURIComponent(value);
  }
};
</script>

</body>
</html>
