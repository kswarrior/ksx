<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="KS Warrior">
<title>Official KS Warrior Website</title>

<style>
:root {
  --bg: #0a0a0f;
  --top: #0b0b10;
  --panel: #15151b;
  --border: #24242c;
  --text: #e6e6eb;
  --muted: #9aa0aa;
  --accent: #3b82f6;
  --accent-hover: #2563eb;
  --hover: #1f1f2a;
  --glass: rgba(20, 20, 30, 0.85);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  overflow: hidden;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

/* TOPBAR */
#topbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 56px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 16px;
  background: var(--top);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  z-index: 1000;
}

/* LOGO & TITLE */
.logo {
  width: 30px; height: 30px;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  flex-shrink: 0;
}
.logo img { width: 100%; height: 100%; object-fit: cover; }

.owner-name {
  font-size: 15px;
  font-weight: 900;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  user-select: none;
}

/* SEARCH CONTAINER - NEW DESIGN */
.search-container {
  position: relative;
  width: 45px; /* Initial collapsed width (just icon) */
  transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  overflow: hidden;
}

#topbar.search-active .search-container {
  width: 320px; /* Expanded width */
  max-width: 60vw;
}

#searchBox {
  width: 100%;
  height: 40px;
  padding: 0 14px 0 44px; /* Left padding for icon */
  background: rgba(18, 18, 24, 0.9);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-size: 14px;
  outline: none;
  opacity: 0;
  transition: opacity 0.3s ease 0.1s;
}

#topbar.search-active #searchBox {
  opacity: 1;
}

/* Search Icon - Now inside the bar on the left */
#searchTrigger {
  position: absolute;
  left: 0;
  top: 0;
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  cursor: pointer;
  color: var(--text);
  font-size: 20px;
  z-index: 2;
  transition: color 0.2s ease;
  -webkit-tap-highlight-color: transparent;
}

#searchTrigger:hover {
  color: var(--accent);
}

  .search-svg {
  width: 22px;
  height: 22px;
  stroke: #F5F5F5;
  stroke-width: 2.2;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition:
    stroke 0.25s ease,
    transform 0.25s ease,
    filter 0.25s ease;
}

/* Hover effect */
#searchTrigger:hover .search-svg {
  stroke: var(--accent);
  transform: scale(1.15);
  filter: drop-shadow(0 0 6px rgba(59,130,246,0.6));
}

/* Active (search opened) */
#topbar.search-active .search-svg {
  stroke: var(--accent);
}

/* HAMBURGER */
#hamburger {
  width: 40px; height: 40px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  cursor: pointer;
  font-size: 22px;
  display: grid;
  place-items: center;
  transition: all 0.2s ease;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
}
#hamburger:hover {
  background: var(--hover);
  border-color: var(--accent);
}

  .menu-svg {
  width: 20px;
  height: 20px;
  stroke: #F5F5F5;
  stroke-width: 2.2;
  fill: none;
  stroke-linecap: round;
  transition:
    stroke 0.25s ease,
    transform 0.25s ease,
    filter 0.25s ease;
}

/* Hover */
#hamburger:hover .menu-svg {
  stroke: var(--accent);
  transform: scale(1.1);
  filter: drop-shadow(0 0 6px rgba(59,130,246,0.5));
}
  
/* SUGGESTIONS */
#suggestBox {
  position: fixed;
  top: 64px;
  left: 16px; right: 16px;
  max-width: 560px;
  margin: 0 auto;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  list-style: none;
  padding: 8px 0;
  box-shadow: 0 12px 32px rgba(0,0,0,0.5);
  display: none;
  z-index: 900;
  max-height: 360px;
  overflow-y: auto;
  backdrop-filter: blur(12px);
}
#suggestBox li {
  padding: 12px 18px;
  cursor: pointer;
  transition: background 0.2s ease;
}
#suggestBox li:hover,
#suggestBox li.active {
  background: var(--hover);
}

/* SIDEBAR & FRAME (unchanged but polished) */
#sidebar {
  position: fixed;
  top: 56px;
  left: -175px;
  width: 175px;
  height: calc(100% - 56px);
  background: var(--glass);
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  padding: 20px 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
  transition: left 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  z-index: 800;
}
body.sidebar-open #sidebar { left: 0; }

#sidebar a {
  display: block;
  padding: 14px 24px;
  color: var(--text);
  text-decoration: none;
  font-size: 16px;
  transition: all 0.25s ease;
  border-left: 3px solid transparent;
  user-select: none;
}
#sidebar a:hover {
  background: var(--hover);
  border-left-color: var(--accent);
  padding-left: 28px;
}

#frame {
  position: fixed;
  top: 56px;
  left: 0;
  width: 100%;
  height: calc(100% - 56px);
  border: none;
  background: #fff;
  transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
}
 /* Favorite Button Hover & Filled */
#favButton {
  cursor: pointer;
  color: var(--accent);
  font-size: 35px;
  font-weight: 900;
  user-select: none;
  transition: transform 0.2s ease, color 0.2s ease;
}

#favButton:hover {
  color: var(--accent);
  transform: scale(1.2);
}

#favButton.filled {
  color: var(--accent); /* Blue color when added to favorites */
}

.fav-svg {
  filter: drop-shadow(0 0 2px rgba(0,0,0,0.35));
}

/* ICON */
.s-icon {
  display: inline-grid;
  place-items: center;
  width: 22px;
  height: 22px;
  margin-right: 8px;
  border-radius: 6px;
  background: rgba(59, 130, 246, 0.15);
  color: var(--accent);
  font-size: 13px;
  flex-shrink: 0;
}

/* CATEGORY */
.s-category {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 15px;
  font-weight: 800;
  color: var(--accent);
  padding: 12px 18px 8px;
  margin-top: 4px;
  cursor: default;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  opacity: 0.95;
}

/* subtle divider under category */
.s-category::after {
  content: "";
  display: block;
  width: 100%;
  height: 1px;
  background: linear-gradient(
    to right,
    var(--accent),
    transparent
  );
  margin-top: 6px;
  opacity: 0.25;
}

/* TITLE */
.s-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  padding: 8px 28px 6px;
  margin-left: 35px;
  opacity: 0.85;
  cursor: default;
  position: relative;
}

/* small dot before title */
.s-title::before {
  content: "❯❯";
  position: absolute;
  left: -5px;
  color: var(--accent);
  opacity: 0.6;
}

/* PAGE */
.s-page {
  font-size: 12px;
  padding: 10px 40px;
  margin-left: 55px;
  color: var(--muted);
  border-radius: 8px;
  transition: all 0.2s ease;
  position: relative;
}

/* hover + keyboard */
.s-page:hover,
.s-page.active {
  background: linear-gradient(
    90deg,
    rgba(59, 130, 246, 0.15),
    transparent
  );
  color: var(--text);
}

/* left highlight bar */
.s-page::before {
  content: "➣";
  position: absolute;
  left: -5px;
  top: 8px;
  bottom: 8px;
  width: 3px;
  opacity: 0;
  border-radius: 3px;
  background: var(--accent);
  transition: opacity 0.2s ease;
}

.s-page:hover::before,
.s-page.active::before {
  opacity: 1;
}

/* smooth appear animation */
#suggestBox li {
  animation: fadeIn 0.15s ease;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(4px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>
</head>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const frame = document.getElementById("frame");

  // ---------- PAGE LOADER ----------
  const pageLoader = document.createElement("div");
  pageLoader.id = "pageLoader";
  pageLoader.innerHTML = `
    <div class="loader-box">
      <svg class="ks-loader" width="120" height="40" viewBox="0 0 120 40">
        <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" 
          font-family="monospace" font-size="28" fill="none" stroke="var(--accent)" 
          stroke-width="1.5" stroke-dasharray="100" stroke-dashoffset="100">
          ❰🔹❰❰ 𝑲𝑺 ❱❱🔹❱
        </text>
      </svg>
    </div>
  `;
  document.body.appendChild(pageLoader);

  // ---------- TOP LOADER ----------
  const topLoader = document.createElement("div");
  topLoader.id = "topLoader";
  document.body.appendChild(topLoader);

  /* Loader CSS */
  const loaderCSS = document.createElement("style");
  loaderCSS.innerHTML = `
    #pageLoader {
      position: fixed;
      inset: 56px 0 0 0;
      background: rgba(10, 10, 15, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    #pageLoader.active {
      opacity: 1;
      pointer-events: all;
    }
    .loader-box { display:flex; flex-direction:column; align-items:center; gap:14px; }

    .ks-loader text {
      stroke: var(--accent);
      stroke-width: 1.5;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: ks-draw 2s cubic-bezier(0.65, 0, 0.35, 1) infinite alternate;
    }

    @keyframes ks-draw {
      0% { stroke-dashoffset: 100; fill: none; opacity: 0.25; }
      40% { stroke-dashoffset: 0; fill: var(--accent); opacity: 1; }
      100% { stroke-dashoffset: 100; fill: none; opacity: 0.25; }
    }

    /* Top progress bar */
    #topLoader {
      position: fixed;
      top: 56px;
      left: 0;
      width: 0%;
      height: 2px;
      background: var(--accent);
      z-index: 1300;
      transition: width 0.5s ease;
    }
  `;
  document.head.appendChild(loaderCSS);

  // ---------- TOP LOADER FUNCTIONS ----------
  function startTopLoader() {
    topLoader.style.width = "0%";
    let width = 0;
    const interval = setInterval(() => {
      width += Math.random() * 10; // random increment for realistic feel
      if (width < 90) topLoader.style.width = width + "%";
    }, 150);
    return interval;
  }

  function finishTopLoader(interval) {
    clearInterval(interval);
    topLoader.style.width = "100%";
    setTimeout(() => { topLoader.style.width = "0%"; }, 300);
  }

  /* ------------------------
     SINGLE loadInFrame
  ------------------------ */
  window.loadInFrame = function(url, nameFromSearch = null) {
    const fullUrl = url.startsWith("http") ? url : url;
    const target = new URL(fullUrl, location.href).href;

    if (frame.src === target) return;

    pageLoader.classList.add("active");
    const startTime = Date.now();

    frame.src = fullUrl;

    document.body.classList.remove("sidebar-open");
    document.getElementById("topbar").classList.remove("search-active");
    document.getElementById("suggestBox").style.display = "none";
    document.getElementById("searchBox").value = "";

    if (nameFromSearch) {
      saveToRecent(nameFromSearch, fullUrl);
    }

    // Start top loader
    const loaderInterval = startTopLoader();

    // Ensure minimum loader duration 3.5s
    frame.addEventListener("load", function onLoad() {
      const elapsed = Date.now() - startTime;
      const remaining = Math.max(3500 - elapsed, 0);

      setTimeout(() => {
        pageLoader.classList.remove("active");
        if (window.innerWidth >= 768) document.body.classList.remove("sidebar-open");
        if (typeof updateFavIcon === "function") updateFavIcon();

        finishTopLoader(loaderInterval);
      }, remaining);

      frame.removeEventListener("load", onLoad);
    });
  };

});
</script>

<script>
const frame = document.getElementById("frame");
const searchBox = document.getElementById("searchBox");
const suggestBox = document.getElementById("suggestBox");
const searchTrigger = document.getElementById("searchTrigger");
const hamburger = document.getElementById("hamburger");
const topbar = document.getElementById("topbar");

const RECENT_KEY = "ks-web-recent";
const MAX_RECENT = 5;
let searchData = [];

/* Load sitemap.json (icon → category → title → pages) */
fetch("/sitemap.json")
  .then(r => r.ok ? r.json() : [])
  .then(data => {
    const list = [];

    data.forEach(cat => {
      const category = cat.category;
      const icon = cat.icon || "";

      (cat.sections || []).forEach(sec => {
        const title = sec.title;

        (sec.pages || []).forEach(page => {
          list.push({
            icon,
            category,
            title,
            name: page.name,
            url: page.url
          });
        });
      });
    });

    searchData = list;
  })
  .catch(err => {
    console.warn("Failed to load sitemap.json:", err);
    searchData = [];
  });

/* Save to recent */
function saveToRecent(name, url) {
  if (!name || !url) return;

  let recent = JSON.parse(localStorage.getItem(RECENT_KEY) || "[]");
  recent = recent.filter(item => item.url !== url);
  recent.unshift({ name, url, time: Date.now() });
  recent = recent.slice(0, MAX_RECENT);
  localStorage.setItem(RECENT_KEY, JSON.stringify(recent));
}

/* Load page */
function loadInFrame(url, nameFromSearch = null) {
  const fullUrl = url.startsWith("http") ? url : url;
  if (frame.src === new URL(fullUrl, location.href).href) return;

  frame.src = fullUrl;

  document.body.classList.remove("sidebar-open");
  topbar.classList.remove("search-active");
  suggestBox.style.display = "none";
  searchBox.value = "";

  if (nameFromSearch) {
    saveToRecent(nameFromSearch, fullUrl);
  }
}

/* Search suggestions */
let activeIndex = -1;

function updateSuggestions() {
  const query = searchBox.value.trim().toLowerCase();
  suggestBox.innerHTML = "";
  suggestBox.style.display = "none";
  activeIndex = -1;

  if (!query || searchData.length === 0) return;

  const matched = searchData.filter(item =>
    item.name.toLowerCase().includes(query) ||
    item.title.toLowerCase().includes(query) ||
    item.category.toLowerCase().includes(query)
  );

  if (matched.length === 0) {
    suggestBox.innerHTML =
      `<li style="background: var(--glass);backdrop-filter: blur(20px) saturate(160%);-webkit-backdrop-filter: blur(20px) saturate(160%);;padding:12px 18px;">No results found</li>`;
    suggestBox.style.display = "block";
    return;
  }

  /* Build tree: icon + category → title → pages */
  const tree = {};
  matched.forEach(i => {
    tree[i.category] ??= { icon: i.icon, titles: {} };
    tree[i.category].titles[i.title] ??= [];
    tree[i.category].titles[i.title].push(i);
  });

  let html = "";

  Object.entries(tree).forEach(([category, data]) => {
    html += `
      <li class="s-category">
        <span class="s-icon">${data.icon}</span>
        <span>${category}</span>
      </li>
    `;

    Object.entries(data.titles).forEach(([title, pages]) => {
      html += `<li class="s-title">${title}</li>`;

      pages.forEach(p => {
        html += `
          <li class="s-page" tabindex="0" role="option"
              data-url="${p.url}"
              data-name="${p.name}">
              ${p.name}
          </li>
        `;
      });
    });
  });

  suggestBox.innerHTML = html;
  suggestBox.style.display = "block";
}

searchBox.addEventListener("input", updateSuggestions);

searchBox.addEventListener("keydown", (e) => {
  const items = [...suggestBox.querySelectorAll("li[role='option']")];
  if (items.length === 0) return;

  if (e.key === "ArrowDown") {
    e.preventDefault();
    activeIndex = (activeIndex + 1) % items.length;
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    activeIndex = (activeIndex - 1 + items.length) % items.length;
  } else if (e.key === "Enter") {
    e.preventDefault();
    if (activeIndex >= 0) {
      const item = items[activeIndex];
      loadInFrame(item.dataset.url, item.dataset.name);
    }
    return;
  } else if (e.key === "Escape") {
    topbar.classList.remove("search-active");
    suggestBox.style.display = "none";
    searchBox.value = "";
    searchBox.blur();
    return;
  }

  items.forEach(i => i.classList.remove("active"));
  if (activeIndex >= 0) items[activeIndex].classList.add("active");
});

suggestBox.addEventListener("click", (e) => {
  const li = e.target.closest("li[role='option']");
  if (li) {
    loadInFrame(li.dataset.url, li.dataset.name);
  }
});

/* Activate search */
searchTrigger.addEventListener("click", (e) => {
  e.stopPropagation();
  topbar.classList.add("search-active");
  searchBox.focus();
  updateSuggestions();
});

/* Close search on outside click */
document.addEventListener("click", (e) => {
  if (!topbar.contains(e.target) && !suggestBox.contains(e.target)) {
    topbar.classList.remove("search-active");
    suggestBox.style.display = "none";
    searchBox.value = "";
  }
});

suggestBox.addEventListener("click", (e) => e.stopPropagation());

hamburger.addEventListener("click", () => {
  document.body.classList.toggle("sidebar-open");
});

frame.addEventListener("load", () => {
  if (window.innerWidth >= 768) {
    document.body.classList.remove("sidebar-open");
  }
});
</script>
<script>
const FAV_KEY = "ks-web-fav";
const favButton = document.getElementById("favButton");

// Get favorites from localStorage
const getFavorites = () => JSON.parse(localStorage.getItem(FAV_KEY) || "[]");

// Check if a URL is in favorites
const isFavorite = (url) => getFavorites().some(item => new URL(item.url, location.href).href === url);

// Update star icon and color
const updateFavIcon = () => {
  const frameUrl = frame.src;

  // SVG icons as strings (no xmlns)
  const filledStarSVG = `
  <svg class="fav-svg" width="18" height="18"
       fill="#F5F5F5"
       stroke="#F5F5F5"
       stroke-width="1"
       viewBox="0 0 24 24">
    <path d="M12 .587l3.668 7.431 8.2 1.192-5.934 5.778 1.4 8.164L12 18.897l-7.334 3.855 1.4-8.164L.132 9.21l8.2-1.192z"/>
  </svg>
`;

const emptyStarSVG = `
  <svg class="fav-svg" width="18" height="18"
       fill="none"
       stroke="#F5F5F5"
       stroke-width="2"
       viewBox="0 0 24 24">
    <path d="M12 .587l3.668 7.431 8.2 1.192-5.934 5.778 1.4 8.164L12 18.897l-7.334 3.855 1.4-8.164L.132 9.21l8.2-1.192z"/>
  </svg>
`;

  if (isFavorite(frameUrl)) {
    favButton.innerHTML = filledStarSVG;
    favButton.classList.add("filled");
  } else {
    favButton.innerHTML = emptyStarSVG;
    favButton.classList.remove("filled");
  }
};

// Add or remove current iframe page from favorites
favButton.addEventListener("click", () => {
  const frameUrl = frame.src;
  const found = searchData.find(item => new URL(item.url, location.href).href === frameUrl);
  const pageName = found ? found.name : frameUrl;

  let favs = getFavorites();

  if (isFavorite(frameUrl)) {
    // Remove from favorites
    favs = favs.filter(item => new URL(item.url, location.href).href !== frameUrl);
  } else {
    // Add to favorites
    favs.unshift({ name: pageName, url: frameUrl, time: Date.now() });
  }

  localStorage.setItem(FAV_KEY, JSON.stringify(favs));
  updateFavIcon();

  // Optional: small "pop" animation
  favButton.style.transform = "scale(1.4)";
  setTimeout(() => favButton.style.transform = "", 150);
});

// Update star when iframe loads
frame.addEventListener("load", updateFavIcon);

// Update on page load
window.addEventListener("DOMContentLoaded", updateFavIcon);
</script>
</body>
</html>
