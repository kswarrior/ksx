<style>
:root {
  --bg: #0a0a0f;
  --surface: #12121a;
  --panel: #1a1a24;
  --border: #2a2a35;
  --text: #f0f0f5;
  --muted: #8b8b9a;
  --accent: #3b82f6;
  --accent-glow: rgba(59, 130, 246, 0.4);
  --hover: #252530;
  --topbar-height: 60px;
  --sidebar-width: 260px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ============================================
   CINEMATIC LOADER - Multi-layer Gaming Style
   ============================================ */
#loader-container {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity 0.6s ease, visibility 0.6s ease;
}

#loader-container.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

/* Background grid animation */
.loader-grid {
  position: absolute;
  inset: 0;
  background-image: 
    linear-gradient(rgba(59, 130, 246, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(59, 130, 246, 0.03) 1px, transparent 1px);
  background-size: 50px 50px;
  animation: gridMove 20s linear infinite;
}

@keyframes gridMove {
  0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
  100% { transform: perspective(500px) rotateX(60deg) translateY(50px); }
}

/* Central logo container */
.loader-content {
  position: relative;
  z-index: 2;
  text-align: center;
}

/* Glowing ring */
.loader-ring {
  width: 120px;
  height: 120px;
  border: 3px solid transparent;
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  position: relative;
  margin: 0 auto 24px;
}

.loader-ring::before,
.loader-ring::after {
  content: '';
  position: absolute;
  border: 3px solid transparent;
  border-radius: 50%;
}

.loader-ring::before {
  inset: -10px;
  border-top-color: rgba(59, 130, 246, 0.3);
  animation: spin 2s linear infinite reverse;
}

.loader-ring::after {
  inset: 5px;
  border-top-color: rgba(59, 130, 246, 0.6);
  animation: spin 1.5s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* Logo text with glitch effect */
.loader-logo {
  font-size: 28px;
  font-weight: 900;
  letter-spacing: 2px;
  background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  position: relative;
  animation: glitch 3s infinite;
}

@keyframes glitch {
  0%, 100% { transform: translate(0); }
  20% { transform: translate(-2px, 2px); }
  40% { transform: translate(-2px, -2px); }
  60% { transform: translate(2px, 2px); }
  80% { transform: translate(2px, -2px); }
}

/* Progress bar */
.loader-progress {
  width: 200px;
  height: 3px;
  background: var(--border);
  border-radius: 3px;
  margin-top: 24px;
  overflow: hidden;
  position: relative;
}

.loader-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--accent), #60a5fa);
  border-radius: 3px;
  transition: width 0.3s ease;
  box-shadow: 0 0 10px var(--accent-glow);
}

/* Floating particles */
.particle {
  position: absolute;
  width: 4px;
  height: 4px;
  background: var(--accent);
  border-radius: 50%;
  opacity: 0.6;
  animation: float 3s ease-in-out infinite;
}

.particle:nth-child(1) { left: 10%; top: 20%; animation-delay: 0s; }
.particle:nth-child(2) { left: 20%; top: 60%; animation-delay: 0.5s; }
.particle:nth-child(3) { left: 80%; top: 30%; animation-delay: 1s; }
.particle:nth-child(4) { left: 70%; top: 70%; animation-delay: 1.5s; }
.particle:nth-child(5) { left: 40%; top: 80%; animation-delay: 2s; }

@keyframes float {
  0%, 100% { transform: translateY(0) scale(1); opacity: 0.6; }
  50% { transform: translateY(-20px) scale(1.2); opacity: 1; }
}

/* ============================================
   TOPBAR - Fixed Layout Management
   ============================================ */
#topbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: var(--topbar-height);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  z-index: 1000;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

/* Left section: Logo + Title */
.topbar-left {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
  min-width: 0;
}

.logo {
  width: 36px;
  height: 36px;
  border: 2px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  flex-shrink: 0;
  transition: all 0.3s ease;
}

.logo:hover {
  border-color: var(--accent);
  box-shadow: 0 0 15px var(--accent-glow);
}

.logo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.owner-name {
  font-size: 16px;
  font-weight: 800;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 0.5px;
}

/* Right section: Search + Fav + Menu */
.topbar-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

/* Search Container */
.search-wrapper {
  position: relative;
  display: flex;
  align-items: center;
}

#searchBox {
  width: 40px;
  height: 40px;
  padding: 0 16px 0 40px;
  background: var(--panel);
  border: 2px solid var(--border);
  border-radius: 20px;
  color: var(--text);
  font-size: 14px;
  outline: none;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  cursor: pointer;
}

#searchBox:focus,
#searchBox.active {
  width: 280px;
  cursor: text;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

#searchTrigger {
  position: absolute;
  left: 12px;
  width: 20px;
  height: 20px;
  pointer-events: none;
  color: var(--muted);
  transition: color 0.3s ease;
}

#searchBox:focus + #searchTrigger,
#searchBox.active + #searchTrigger {
  color: var(--accent);
}

.search-icon {
  width: 100%;
  height: 100%;
}

/* Favorite Button */
#favButton {
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--panel);
  border: 2px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.3s ease;
  color: var(--muted);
}

#favButton:hover {
  border-color: var(--accent);
  color: var(--accent);
  transform: scale(1.05);
  box-shadow: 0 0 15px var(--accent-glow);
}

#favButton.filled {
  color: var(--accent);
  background: rgba(59, 130, 246, 0.1);
}

/* Hamburger - Clean 3-line design */
#hamburger {
  width: 40px;
  height: 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: var(--panel);
  border: 2px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.3s ease;
  padding: 0;
}

#hamburger:hover {
  border-color: var(--accent);
  box-shadow: 0 0 15px var(--accent-glow);
}

#hamburger span {
  display: block;
  width: 20px;
  height: 2px;
  background: var(--text);
  border-radius: 2px;
  transition: all 0.3s ease;
  transform-origin: center;
}

#hamburger.active span:nth-child(1) {
  transform: translateY(7px) rotate(45deg);
}

#hamburger.active span:nth-child(2) {
  opacity: 0;
  transform: scaleX(0);
}

#hamburger.active span:nth-child(3) {
  transform: translateY(-7px) rotate(-45deg);
}

/* ============================================
   SIDEBAR - Professional Slide-out
   ============================================ */
#sidebar {
  position: fixed;
  top: var(--topbar-height);
  left: 0;
  width: var(--sidebar-width);
  height: calc(100% - var(--topbar-height));
  background: var(--surface);
  border-right: 1px solid var(--border);
  transform: translateX(-100%);
  transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 900;
  overflow-y: auto;
  padding: 20px 0;
}

#sidebar.open {
  transform: translateX(0);
}

/* Sidebar overlay */
#sidebar-overlay {
  position: fixed;
  inset: var(--topbar-height) 0 0 0;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(4px);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 800;
}

#sidebar-overlay.visible {
  opacity: 1;
  visibility: visible;
}

/* Sidebar items */
#sidebar a {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 24px;
  margin: 4px 12px;
  color: var(--text);
  text-decoration: none;
  font-size: 15px;
  font-weight: 500;
  border-radius: 10px;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}

#sidebar a::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  background: var(--accent);
  transform: scaleY(0);
  transition: transform 0.3s ease;
}

#sidebar a:hover,
#sidebar a.active {
  background: var(--hover);
  color: var(--accent);
}

#sidebar a:hover::before,
#sidebar a.active::before {
  transform: scaleY(1);
}

.nav-icon {
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}

/* ============================================
   SEARCH SUGGESTIONS
   ============================================ */
#suggestBox {
  position: fixed;
  top: calc(var(--topbar-height) + 8px);
  left: 50%;
  transform: translateX(-50%);
  width: min(560px, calc(100% - 32px));
  max-height: 400px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  overflow-y: auto;
  z-index: 950;
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  padding: 8px 0;
}

#suggestBox.visible {
  opacity: 1;
  visibility: visible;
}

.suggest-item {
  padding: 12px 20px;
  cursor: pointer;
  transition: all 0.2s ease;
  border-left: 3px solid transparent;
}

.suggest-item:hover,
.suggest-item.active {
  background: var(--hover);
  border-left-color: var(--accent);
  padding-left: 24px;
}

.suggest-category {
  padding: 8px 20px;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--accent);
  margin-top: 8px;
}

/* ============================================
   MAIN FRAME
   ============================================ */
#frame {
  position: fixed;
  top: var(--topbar-height);
  left: 0;
  width: 100%;
  height: calc(100% - var(--topbar-height));
  border: none;
  background: #fff;
  transition: all 0.4s ease;
}

/* ============================================
   RESPONSIVE DESIGN
   ============================================ */
/* Tablet and Desktop */
@media (min-width: 1024px) {
  #sidebar {
    transform: translateX(0);
  }
  
  #hamburger {
    display: none;
  }
  
  #frame {
    left: var(--sidebar-width);
    width: calc(100% - var(--sidebar-width));
  }
  
  #sidebar-overlay {
    display: none;
  }
  
  #searchBox:focus,
  #searchBox.active {
    width: 320px;
  }
}

/* Mobile optimizations */
@media (max-width: 767px) {
  :root {
    --topbar-height: 56px;
  }
  
  .owner-name {
    font-size: 14px;
    max-width: 140px;
  }
  
  #searchBox:focus,
  #searchBox.active {
    width: calc(100vw - 140px);
    position: fixed;
    right: 16px;
    z-index: 1001;
  }
  
  .loader-logo {
    font-size: 24px;
  }
  
  .loader-ring {
    width: 100px;
    height: 100px;
  }
}

/* Small mobile */
@media (max-width: 380px) {
  .owner-name {
    font-size: 12px;
    max-width: 100px;
  }
  
  .logo {
    width: 32px;
    height: 32px;
  }
}

/* Landscape */
@media (max-height: 500px) and (orientation: landscape) {
  #sidebar {
    padding: 10px 0;
  }
  
  #sidebar a {
    padding: 10px 20px;
  }
}

/* Safe area for notched phones */
@supports (padding-top: env(safe-area-inset-top)) {
  #topbar {
    padding-top: env(safe-area-inset-top);
    height: calc(var(--topbar-height) + env(safe-area-inset-top));
  }
  
  #sidebar,
  #frame,
  #sidebar-overlay {
    top: calc(var(--topbar-height) + env(safe-area-inset-top));
    height: calc(100% - var(--topbar-height) - env(safe-area-inset-top));
  }
}
</style>
</head>

<script>
// ==========================================
// CINEMATIC LOADER
// ==========================================
window.addEventListener('load', () => {
  const loaderBar = document.getElementById('loaderBar');
  const loaderContainer = document.getElementById('loader-container');
  let progress = 0;
  
  // Simulate loading progress
  const interval = setInterval(() => {
    progress += Math.random() * 15;
    if (progress > 100) progress = 100;
    loaderBar.style.width = progress + '%';
    
    if (progress === 100) {
      clearInterval(interval);
      setTimeout(() => {
        loaderContainer.classList.add('hidden');
        // Initialize app after loader
        initApp();
      }, 400);
    }
  }, 150);
});

// ==========================================
// APP INITIALIZATION
// ==========================================
function initApp() {
  const frame = document.getElementById('frame');
  const sidebar = document.getElementById('sidebar');
  const hamburger = document.getElementById('hamburger');
  const overlay = document.getElementById('sidebar-overlay');
  const searchBox = document.getElementById('searchBox');
  const suggestBox = document.getElementById('suggestBox');
  const favButton = document.getElementById('favButton');
  
  let searchData = [];
  let activeIndex = -1;
  
  // Load initial page
  const lastPage = localStorage.getItem('ks-last-page') || 'dashboard.html';
  loadPage(lastPage, false);
  
  // ==========================================
  // SIDEBAR TOGGLE
  // ==========================================
  function toggleSidebar() {
    const isOpen = sidebar.classList.toggle('open');
    hamburger.classList.toggle('active', isOpen);
    overlay.classList.toggle('visible', isOpen);
  }
  
  hamburger.addEventListener('click', toggleSidebar);
  overlay.addEventListener('click', toggleSidebar);
  
  // Close sidebar on escape
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && sidebar.classList.contains('open')) {
      toggleSidebar();
    }
  });
  
  // ==========================================
  // SEARCH FUNCTIONALITY
  // ==========================================
  fetch('/sitemap.json')
    .then(r => r.ok ? r.json() : [])
    .then(data => {
      data.forEach(cat => {
        (cat.sections || []).forEach(sec => {
          (sec.pages || []).forEach(page => {
            searchData.push({
              category: cat.category,
              title: sec.title,
              name: page.name,
              url: page.url,
              icon: cat.icon || '•'
            });
          });
        });
      });
    })
    .catch(() => {});
  
  function updateSuggestions() {
    const query = searchBox.value.trim().toLowerCase();
    suggestBox.innerHTML = '';
    activeIndex = -1;
    
    if (!query || !searchData.length) {
      suggestBox.classList.remove('visible');
      return;
    }
    
    const matches = searchData.filter(item => 
      item.name.toLowerCase().includes(query) ||
      item.category.toLowerCase().includes(query)
    );
    
    if (!matches.length) {
      suggestBox.innerHTML = '<li class="suggest-item">No results found</li>';
      suggestBox.classList.add('visible');
      return;
    }
    
    // Group by category
    const grouped = {};
    matches.forEach(item => {
      if (!grouped[item.category]) grouped[item.category] = [];
      grouped[item.category].push(item);
    });
    
    let html = '';
    Object.entries(grouped).forEach(([cat, items]) => {
      html += `<li class="suggest-category">${cat}</li>`;
      items.forEach(item => {
        html += `
          <li class="suggest-item" data-url="${item.url}" data-name="${item.name}">
            <strong>${item.name}</strong>
            <div style="font-size: 12px; color: var(--muted); margin-top: 2px;">${item.title}</div>
          </li>
        `;
      });
    });
    
    suggestBox.innerHTML = html;
    suggestBox.classList.add('visible');
  }
  
  searchBox.addEventListener('focus', () => {
    searchBox.classList.add('active');
    updateSuggestions();
  });
  
  searchBox.addEventListener('input', updateSuggestions);
  
  searchBox.addEventListener('keydown', (e) => {
    const items = suggestBox.querySelectorAll('.suggest-item[data-url]');
    
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      activeIndex = (activeIndex + 1) % items.length;
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      activeIndex = (activeIndex - 1 + items.length) % items.length;
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (activeIndex >= 0 && items[activeIndex]) {
        const item = items[activeIndex];
        loadPage(item.dataset.url);
        saveRecent(item.dataset.name, item.dataset.url);
      }
      return;
    } else if (e.key === 'Escape') {
      searchBox.classList.remove('active');
      searchBox.blur();
      suggestBox.classList.remove('visible');
      return;
    }
    
    items.forEach((item, i) => {
      item.classList.toggle('active', i === activeIndex);
    });
  });
  
  suggestBox.addEventListener('click', (e) => {
    const item = e.target.closest('.suggest-item[data-url]');
    if (item) {
      loadPage(item.dataset.url);
      saveRecent(item.dataset.name, item.dataset.url);
    }
  });
  
  // Close search when clicking outside
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-wrapper') && !e.target.closest('#suggestBox')) {
      searchBox.classList.remove('active');
      suggestBox.classList.remove('visible');
    }
  });
  
  // ==========================================
  // FAVORITES SYSTEM
  // ==========================================
  const FAV_KEY = 'ks-favorites';
  
  function getFavs() {
    return JSON.parse(localStorage.getItem(FAV_KEY) || '[]');
  }
  
  function isFav(url) {
    return getFavs().some(f => f.url === url);
  }
  
  function updateFavButton() {
    const currentUrl = frame.getAttribute('data-current');
    if (isFav(currentUrl)) {
      favButton.classList.add('filled');
      favButton.innerHTML = `
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
        </svg>
      `;
    } else {
      favButton.classList.remove('filled');
      favButton.innerHTML = `
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
        </svg>
      `;
    }
  }
  
  favButton.addEventListener('click', () => {
    const currentUrl = frame.getAttribute('data-current');
    let favs = getFavs();
    const name = searchData.find(s => s.url === currentUrl)?.name || 'Page';
    
    if (isFav(currentUrl)) {
      favs = favs.filter(f => f.url !== currentUrl);
    } else {
      favs.unshift({ name, url: currentUrl, time: Date.now() });
    }
    
    localStorage.setItem(FAV_KEY, JSON.stringify(favs));
    updateFavButton();
    
    // Pop animation
    favButton.style.transform = 'scale(1.2)';
    setTimeout(() => favButton.style.transform = '', 200);
  });
  
  frame.addEventListener('load', updateFavButton);
  
  // ==========================================
  // PAGE LOADER
  // ==========================================
  window.loadPage = function(url, save = true) {
    if (!url || frame.getAttribute('data-current') === url) return;
    
    // Update sidebar active state
    document.querySelectorAll('#sidebar a').forEach(link => {
      link.classList.remove('active');
      if (link.getAttribute('onclick')?.includes(url)) {
        link.classList.add('active');
      }
    });
    
    // Close mobile sidebar
    if (window.innerWidth < 1024) {
      sidebar.classList.remove('open');
      hamburger.classList.remove('active');
      overlay.classList.remove('visible');
    }
    
    // Hide search
    searchBox.classList.remove('active');
    suggestBox.classList.remove('visible');
    
    // Load page
    frame.setAttribute('data-current', url);
    frame.src = url;
    
    if (save) {
      localStorage.setItem('ks-last-page', url);
    }
  };
  
  function saveRecent(name, url) {
    const key = 'ks-recent';
    let recent = JSON.parse(localStorage.getItem(key) || '[]');
    recent = recent.filter(r => r.url !== url);
    recent.unshift({ name, url, time: Date.now() });
    localStorage.setItem(key, JSON.stringify(recent.slice(0, 5)));
  }
  
  // ==========================================
  // RESPONSIVE HANDLING
  // ==========================================
  let lastWidth = window.innerWidth;
  window.addEventListener('resize', () => {
    const newWidth = window.innerWidth;
    // Reload only when crossing breakpoint to apply CSS changes
    if ((lastWidth < 1024 && newWidth >= 1024) || (lastWidth >= 1024 && newWidth < 1024)) {
      location.reload();
    }
    lastWidth = newWidth;
  });
}

// Touch device detection for hover effects
if (window.matchMedia('(pointer: coarse)').matches) {
  document.body.classList.add('touch-device');
}
</script>
</body>
</html>
