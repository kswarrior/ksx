<style>
:root {
  --bg: #0a0a0f;
  --surface: #12121a;
  --panel: #1a1a24;
  --border: #2a2a35;
  --text: #f0f0f5;
  --muted: #8b8b9a;
  --accent: #3b82f6;
  --accent-glow: rgba(59, 130, 246, 0.4);
  --hover: #252530;
  --topbar-height: 60px;
  --sidebar-width: 280px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ============================================
   CINEMATIC LOADER
   ============================================ */
#loader-container {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 10000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity 0.5s ease, visibility 0.5s ease;
}

#loader-container.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

/* Animated background grid */
.loader-bg {
  position: absolute;
  inset: 0;
  overflow: hidden;
  opacity: 0.4;
}

.loader-grid {
  position: absolute;
  width: 200%;
  height: 200%;
  top: -50%;
  left: -50%;
  background-image: 
    linear-gradient(rgba(59, 130, 246, 0.1) 1px, transparent 1px),
    linear-gradient(90deg, rgba(59, 130, 246, 0.1) 1px, transparent 1px);
  background-size: 40px 40px;
  transform: perspective(500px) rotateX(60deg);
  animation: gridScroll 8s linear infinite;
}

@keyframes gridScroll {
  0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
  100% { transform: perspective(500px) rotateX(60deg) translateY(40px); }
}

/* Floating particles */
.particles {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.particle {
  position: absolute;
  width: 3px;
  height: 3px;
  background: var(--accent);
  border-radius: 50%;
  box-shadow: 0 0 6px var(--accent);
  animation: particleFloat 4s ease-in-out infinite;
}

.particle:nth-child(1) { left: 20%; top: 30%; animation-delay: 0s; }
.particle:nth-child(2) { left: 80%; top: 20%; animation-delay: 0.8s; }
.particle:nth-child(3) { left: 60%; top: 70%; animation-delay: 1.6s; }
.particle:nth-child(4) { left: 30%; top: 60%; animation-delay: 2.4s; }
.particle:nth-child(5) { left: 70%; top: 40%; animation-delay: 3.2s; }

@keyframes particleFloat {
  0%, 100% { transform: translateY(0) scale(1); opacity: 0.4; }
  50% { transform: translateY(-30px) scale(1.5); opacity: 1; }
}

/* Central loader content */
.loader-content {
  position: relative;
  z-index: 10;
  text-align: center;
}

/* Triple ring spinner */
.loader-rings {
  position: relative;
  width: 100px;
  height: 100px;
  margin: 0 auto 30px;
}

.ring {
  position: absolute;
  inset: 0;
  border: 3px solid transparent;
  border-radius: 50%;
  border-top-color: var(--accent);
  animation: spin 1.2s linear infinite;
}

.ring:nth-child(1) {
  inset: 0;
  border-top-color: var(--accent);
  box-shadow: 0 0 10px var(--accent-glow);
}

.ring:nth-child(2) {
  inset: -12px;
  border-top-color: rgba(59, 130, 246, 0.4);
  animation-duration: 1.8s;
  animation-direction: reverse;
}

.ring:nth-child(3) {
  inset: 8px;
  border-top-color: rgba(59, 130, 246, 0.7);
  animation-duration: 0.9s;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* Logo text with pulse */
.loader-logo {
  font-size: 26px;
  font-weight: 900;
  letter-spacing: 3px;
  background: linear-gradient(135deg, #fff 0%, var(--accent) 50%, #fff 100%);
  background-size: 200% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shine 3s linear infinite;
  margin-bottom: 20px;
}

@keyframes shine {
  to { background-position: 200% center; }
}

/* Progress bar */
.loader-progress {
  width: 180px;
  height: 2px;
  background: var(--border);
  border-radius: 2px;
  margin: 0 auto;
  overflow: hidden;
  position: relative;
}

.loader-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--accent), #60a5fa);
  border-radius: 2px;
  transition: width 0.2s ease;
  box-shadow: 0 0 10px var(--accent);
}

/* Loading text */
.loader-text {
  margin-top: 16px;
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 2px;
  text-transform: uppercase;
  animation: pulse 1.5s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 1; }
}

/* ============================================
   TOPBAR
   ============================================ */
#topbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: var(--topbar-height);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  z-index: 1000;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

/* Left: Logo + Title */
.topbar-left {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
  min-width: 0;
}

.logo {
  width: 36px;
  height: 36px;
  border: 2px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  flex-shrink: 0;
  transition: all 0.3s ease;
}

.logo:hover {
  border-color: var(--accent);
  box-shadow: 0 0 15px var(--accent-glow);
}

.logo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.owner-name {
  font-size: 15px;
  font-weight: 800;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 0.5px;
}

/* Right: Controls */
.topbar-right {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

/* Search */
.search-box {
  position: relative;
}

#searchInput {
  width: 42px;
  height: 42px;
  padding: 0 16px 0 42px;
  background: var(--panel);
  border: 2px solid var(--border);
  border-radius: 21px;
  color: var(--text);
  font-size: 14px;
  outline: none;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  cursor: pointer;
}

#searchInput.expanded {
  width: 260px;
  cursor: text;
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
}

#searchIcon {
  position: absolute;
  left: 13px;
  top: 50%;
  transform: translateY(-50%);
  width: 18px;
  height: 18px;
  color: var(--muted);
  pointer-events: none;
  transition: color 0.3s ease;
}

#searchInput.expanded + #searchIcon {
  color: var(--accent);
}

.search-icon-svg {
  width: 100%;
  height: 100%;
}

/* Favorite Button */
#favBtn {
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--panel);
  border: 2px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.3s ease;
  color: var(--muted);
}

#favBtn:hover {
  border-color: var(--accent);
  color: var(--accent);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
}

#favBtn.active {
  color: var(--accent);
  background: rgba(59, 130, 246, 0.1);
}

/* Menu Button */
#menuBtn {
  width: 42px;
  height: 42px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: var(--panel);
  border: 2px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.3s ease;
  padding: 0;
}

#menuBtn:hover {
  border-color: var(--accent);
  box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
}

#menuBtn span {
  display: block;
  width: 18px;
  height: 2px;
  background: var(--text);
  border-radius: 2px;
  transition: all 0.3s ease;
  transform-origin: center;
}

#menuBtn.active span:nth-child(1) {
  transform: translateY(7px) rotate(45deg);
}

#menuBtn.active span:nth-child(2) {
  opacity: 0;
  transform: scaleX(0);
}

#menuBtn.active span:nth-child(3) {
  transform: translateY(-7px) rotate(-45deg);
}

/* ============================================
   SEARCH SUGGESTIONS (Enhanced with old stylish categories)
   ============================================ */
#suggestBox {
  position: fixed;
  top: calc(var(--topbar-height) + 8px);
  right: 16px;
  width: min(360px, calc(100vw - 32px));
  max-height: 420px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.6);
  overflow-y: auto;
  z-index: 999;
  opacity: 0;
  visibility: hidden;
  transform: translateY(-10px);
  transition: all 0.3s ease;
  padding: 8px 0;
}

#suggestBox.visible {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

/* Old stylish suggestion styles (merged for perfect look) */
.suggest-header {
  padding: 8px 16px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--accent);
  border-bottom: 1px solid var(--border);
  margin-bottom: 4px;
}

.s-category {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 15px;
  font-weight: 800;
  color: var(--accent);
  padding: 12px 18px 8px;
  margin-top: 4px;
  cursor: default;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  opacity: 0.95;
}

.s-category::after {
  content: "";
  display: block;
  width: 100%;
  height: 1px;
  background: linear-gradient(to right, var(--accent), transparent);
  margin-top: 6px;
  opacity: 0.25;
}

.s-icon {
  display: inline-grid;
  place-items: center;
  width: 22px;
  height: 22px;
  border-radius: 6px;
  background: rgba(59, 130, 246, 0.15);
  color: var(--accent);
  font-size: 13px;
  flex-shrink: 0;
}

.s-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  padding: 8px 28px 6px;
  margin-left: 35px;
  opacity: 0.85;
  cursor: default;
  position: relative;
}

.s-title::before {
  content: "❯❯";
  position: absolute;
  left: -5px;
  color: var(--accent);
  opacity: 0.6;
}

.s-page {
  font-size: 12px;
  padding: 10px 40px;
  margin-left: 55px;
  color: var(--muted);
  border-radius: 8px;
  transition: all 0.2s ease;
  position: relative;
  cursor: pointer;
}

.s-page:hover,
.s-page.active {
  background: linear-gradient(90deg, rgba(59, 130, 246, 0.15), transparent);
  color: var(--text);
}

.s-page::before {
  content: "➣";
  position: absolute;
  left: -5px;
  top: 8px;
  bottom: 8px;
  width: 3px;
  opacity: 0;
  border-radius: 3px;
  background: var(--accent);
  transition: opacity 0.2s ease;
}

.s-page:hover::before,
.s-page.active::before {
  opacity: 1;
}

/* ============================================
   SIDEBAR
   ============================================ */
#sidebar {
  position: fixed;
  top: var(--topbar-height);
  left: 0;
  width: var(--sidebar-width);
  height: calc(100% - var(--topbar-height));
  background: var(--surface);
  border-right: 1px solid var(--border);
  transform: translateX(-100%);
  transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 900;
  overflow-y: auto;
  padding: 16px 12px;
}

#sidebar.open {
  transform: translateX(0);
}

/* Overlay */
#sidebarOverlay {
  position: fixed;
  inset: var(--topbar-height) 0 0 0;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(8px);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 850;
}

#sidebarOverlay.visible {
  opacity: 1;
  visibility: visible;
}

/* Nav Items */
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  margin: 4px 0;
  color: var(--text);
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  border-radius: 10px;
  transition: all 0.25s ease;
  position: relative;
  overflow: hidden;
}

.nav-item::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  background: var(--accent);
  transform: scaleY(0);
  transition: transform 0.25s ease;
}

.nav-item:hover,
.nav-item.active {
  background: var(--hover);
  color: var(--accent);
  transform: translateX(4px);
}

.nav-item:hover::before,
.nav-item.active::before {
  transform: scaleY(1);
}

.nav-icon {
  width: 22px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}

/* ============================================
   MAIN FRAME
   ============================================ */
#mainFrame {
  position: fixed;
  top: var(--topbar-height);
  left: 0;
  width: 100%;
  height: calc(100% - var(--topbar-height));
  border: none;
  background: #fff;
  transition: all 0.35s ease;
  z-index: 100;
}

/* ============================================
   RESPONSIVE
   ============================================ */
@media (min-width: 1024px) {
  #menuBtn { display: none; }
  #sidebar { transform: translateX(0); }
  #sidebarOverlay { display: none; }
  #mainFrame {
    left: var(--sidebar-width);
    width: calc(100% - var(--sidebar-width));
  }
  #searchInput.expanded { width: 300px; }
  #suggestBox {
    right: auto;
    left: calc(100% - 380px);
  }
}

@media (min-width: 768px) and (max-width: 1023px) {
  #searchInput.expanded { width: 240px; }
}

@media (max-width: 767px) {
  :root { --topbar-height: 56px; }
  .owner-name { font-size: 13px; max-width: 120px; }
  .logo { width: 32px; height: 32px; }
  #searchInput {
    width: 38px;
    height: 38px;
    padding-left: 38px;
  }
  #searchInput.expanded {
    width: calc(100vw - 140px);
    position: fixed;
    right: 12px;
    z-index: 1001;
  }
  #favBtn, #menuBtn {
    width: 38px;
    height: 38px;
  }
  #suggestBox {
    top: calc(var(--topbar-height) + 4px);
    right: 12px;
    left: 12px;
    width: auto;
  }
}

@media (max-width: 380px) {
  .owner-name { font-size: 12px; max-width: 100px; }
  #searchInput.expanded { width: calc(100vw - 120px); }
}

@supports (padding-top: env(safe-area-inset-top)) {
  #topbar { padding-top: env(safe-area-inset-top); height: calc(var(--topbar-height) + env(safe-area-inset-top)); }
  #sidebar, #mainFrame, #sidebarOverlay {
    top: calc(var(--topbar-height) + env(safe-area-inset-top));
    height: calc(100% - var(--topbar-height) - env(safe-area-inset-top));
  }
  #suggestBox { top: calc(var(--topbar-height) + env(safe-area-inset-top) + 8px); }
}

@media (pointer: coarse) {
  .nav-item, #favBtn, #menuBtn, .s-page { min-height: 44px; }
  .nav-item:active, #favBtn:active, #menuBtn:active { transform: scale(0.95); opacity: 0.8; }
}
</style>
</head>

<script>
// ==========================================
// CINEMATIC LOADER
// ==========================================
(function() {
  const loader = document.getElementById('loader-container');
  const bar = document.getElementById('loaderBar');
  let progress = 0;
  
  function updateProgress() {
    progress += Math.random() * 12 + 3;
    if (progress > 100) progress = 100;
    bar.style.width = progress + '%';
    
    if (progress < 100) {
      setTimeout(updateProgress, 100);
    } else {
      setTimeout(() => {
        loader.classList.add('hidden');
        setTimeout(initApp, 150);
      }, 400);
    }
  }
  
  setTimeout(updateProgress, 300);
})();

// ==========================================
// APP CORE
// ==========================================
function initApp() {
  const frame = document.getElementById('mainFrame');
  const sidebar = document.getElementById('sidebar');
  const menuBtn = document.getElementById('menuBtn');
  const overlay = document.getElementById('sidebarOverlay');
  const searchInput = document.getElementById('searchInput');
  const suggestBox = document.getElementById('suggestBox');
  const favBtn = document.getElementById('favBtn');

  let searchData = [];
  let isSearchOpen = false;
  const FAV_KEY = 'ks-web-fav';
  const LAST_PAGE_KEY = 'ks-web-last-page';

  // ====================== FAVORITES (Improved from old code) ======================
  const getFavorites = () => JSON.parse(localStorage.getItem(FAV_KEY) || '[]');
  const isFavorite = (url) => getFavorites().some(item => {
    const itemFull = new URL(item.url, location.href).href;
    const currentFull = new URL(url, location.href).href;
    return itemFull === currentFull;
  });

  const updateFavBtn = () => {
    const current = frame.getAttribute('data-current') || '';
    const isActive = isFavorite(current);

    // SVGs (filled / empty)
    const filledSVG = `<svg width="18" height="18" fill="#3b82f6" stroke="#3b82f6" stroke-width="1" viewBox="0 0 24 24"><path d="M12 .587l3.668 7.431 8.2 1.192-5.934 5.778 1.4 8.164L12 18.897l-7.334 3.855 1.4-8.164L.132 9.21l8.2-1.192z"/></svg>`;
    const emptySVG = `<svg width="18" height="18" fill="none" stroke="#f0f0f5" stroke-width="2" viewBox="0 0 24 24"><path d="M12 .587l3.668 7.431 8.2 1.192-5.934 5.778 1.4 8.164L12 18.897l-7.334 3.855 1.4-8.164L.132 9.21l8.2-1.192z"/></svg>`;

    favBtn.innerHTML = isActive ? filledSVG : emptySVG;
    favBtn.classList.toggle('active', isActive);
  };

  favBtn.addEventListener('click', () => {
    const current = frame.getAttribute('data-current') || '';
    if (!current) return;

    const found = searchData.find(item => new URL(item.url, location.href).href === new URL(current, location.href).href);
    const pageName = found ? found.name : 'Page';

    let favs = getFavorites();

    if (isFavorite(current)) {
      favs = favs.filter(item => new URL(item.url, location.href).href !== new URL(current, location.href).href);
    } else {
      favs.unshift({ name: pageName, url: current, time: Date.now() });
    }

    localStorage.setItem(FAV_KEY, JSON.stringify(favs));
    updateFavBtn();

    // Pop animation
    favBtn.style.transform = 'scale(1.25)';
    setTimeout(() => { favBtn.style.transform = ''; }, 160);
  });

  // ====================== SEARCH DATA (Full old structure) ======================
  fetch('/sitemap.json')
    .then(r => r.ok ? r.json() : [])
    .then(data => {
      const list = [];
      data.forEach(cat => {
        const category = cat.category;
        const icon = cat.icon || '🔹';
        (cat.sections || []).forEach(sec => {
          const title = sec.title;
          (sec.pages || []).forEach(page => {
            list.push({
              icon,
              category,
              title,
              name: page.name,
              url: page.url
            });
          });
        });
      });
      searchData = list;
    })
    .catch(() => {
      // Fallback
      searchData = [
        { icon: '📊', category: 'Main', title: 'Overview', name: 'Dashboard', url: 'dashboard.html' },
        { icon: '🗺️', category: 'Main', title: 'Overview', name: 'Sites Map', url: 'map.html' },
        { icon: '🌐', category: 'Main', title: 'Overview', name: 'Social Media', url: 'social.html' },
        { icon: 'ℹ️', category: 'Main', title: 'Overview', name: 'About', url: 'about.html' }
      ];
    });

  // ====================== SEARCH SUGGESTIONS (Stylish like old) ======================
  let activeIndex = -1;

  function updateSuggestions() {
    const query = searchInput.value.trim().toLowerCase();
    suggestBox.innerHTML = '';
    activeIndex = -1;
    if (!query || searchData.length === 0) {
      suggestBox.classList.remove('visible');
      return;
    }

    const matched = searchData.filter(item =>
      item.name.toLowerCase().includes(query) ||
      item.title.toLowerCase().includes(query) ||
      item.category.toLowerCase().includes(query)
    );

    if (matched.length === 0) {
      suggestBox.innerHTML = `<div class="suggest-item"><span class="suggest-name" style="color:#8b8b9a">No results found</span></div>`;
      suggestBox.classList.add('visible');
      return;
    }

    // Build tree like old code
    const tree = {};
    matched.forEach(i => {
      tree[i.category] ??= { icon: i.icon, titles: {} };
      tree[i.category].titles[i.title] ??= [];
      tree[i.category].titles[i.title].push(i);
    });

    let html = '';
    Object.entries(tree).forEach(([category, data]) => {
      html += `
        <div class="s-category">
          <span class="s-icon">${data.icon}</span>
          <span>${category}</span>
        </div>
      `;

      Object.entries(data.titles).forEach(([title, pages]) => {
        html += `<div class="s-title">${title}</div>`;

        pages.forEach(p => {
          html += `
            <div class="s-page" data-url="${p.url}" data-name="${p.name}">
              ${p.name}
            </div>
          `;
        });
      });
    });

    suggestBox.innerHTML = html;
    suggestBox.classList.add('visible');
  }

  // ====================== PAGE LOADING (Robust like old + new) ======================
  window.loadPage = function(url, navElement = null, save = true) {
    if (!url) return;
    const current = frame.getAttribute('data-current');
    if (current === url) return;

    frame.setAttribute('data-current', url);

    if (save) localStorage.setItem(LAST_PAGE_KEY, url);

    // Update active nav
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    if (navElement) {
      navElement.classList.add('active');
    } else {
      document.querySelectorAll('.nav-item').forEach(el => {
        if (el.getAttribute('onclick')?.includes(url)) el.classList.add('active');
      });
    }

    // Close mobile sidebar
    if (window.innerWidth < 1024 && sidebar.classList.contains('open')) {
      toggleSidebar();
    }

    // Load page
    frame.src = url;

    // Update fav after load
    frame.onload = () => {
      updateFavBtn();
      if (typeof saveRecent === 'function') saveRecent(null, url); // optional recent
    };
  };

  function saveRecent(name, url) {
    if (!name) return;
    const key = 'ks-recent';
    let recent = JSON.parse(localStorage.getItem(key) || '[]');
    recent = recent.filter(r => r.url !== url);
    recent.unshift({ name, url, time: Date.now() });
    localStorage.setItem(key, JSON.stringify(recent.slice(0, 5)));
  }

  // ====================== SIDEBAR ======================
  function toggleSidebar() {
    const isOpen = sidebar.classList.toggle('open');
    menuBtn.classList.toggle('active', isOpen);
    overlay.classList.toggle('visible', isOpen);
  }

  menuBtn.addEventListener('click', e => {
    e.stopPropagation();
    toggleSidebar();
  });

  overlay.addEventListener('click', toggleSidebar);

  // ====================== SEARCH ======================
  function openSearch() {
    isSearchOpen = true;
    searchInput.classList.add('expanded');
    searchInput.focus();
    updateSuggestions();
  }

  function closeSearch() {
    isSearchOpen = false;
    searchInput.classList.remove('expanded');
    searchInput.value = '';
    suggestBox.classList.remove('visible');
  }

  searchInput.addEventListener('click', e => {
    e.stopPropagation();
    if (!isSearchOpen) openSearch();
  });

  searchInput.addEventListener('focus', openSearch);
  searchInput.addEventListener('input', updateSuggestions);

  searchInput.addEventListener('keydown', e => {
    const items = suggestBox.querySelectorAll('.s-page');
    if (items.length === 0) return;

    if (e.key === 'ArrowDown') {
      e.preventDefault();
      activeIndex = (activeIndex + 1) % items.length;
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      activeIndex = (activeIndex - 1 + items.length) % items.length;
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (activeIndex >= 0 && items[activeIndex]) {
        const item = items[activeIndex];
        loadPage(item.dataset.url, null);
        closeSearch();
      }
      return;
    } else if (e.key === 'Escape') {
      closeSearch();
      return;
    }

    items.forEach((item, i) => item.classList.toggle('active', i === activeIndex));
  });

  suggestBox.addEventListener('click', e => {
    const pageEl = e.target.closest('.s-page');
    if (pageEl) {
      loadPage(pageEl.dataset.url, null);
      closeSearch();
    }
  });

  // Close search on outside click
  document.addEventListener('click', e => {
    if (!e.target.closest('.search-box') && !e.target.closest('#suggestBox')) {
      closeSearch();
    }
  });

  // ====================== INITIAL LOAD ======================
  const lastPage = localStorage.getItem(LAST_PAGE_KEY) || 'dashboard.html';
  loadPage(lastPage, null, false);

  // Initial fav state
  frame.onload = updateFavBtn;

  // Keyboard escape
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (sidebar.classList.contains('open')) toggleSidebar();
      if (isSearchOpen) closeSearch();
    }
  });

  // Responsive reload fix
  let lastWidth = window.innerWidth;
  window.addEventListener('resize', () => {
    const newWidth = window.innerWidth;
    if ((lastWidth < 1024 && newWidth >= 1024) || (lastWidth >= 1024 && newWidth < 1024)) {
      location.reload();
    }
    lastWidth = newWidth;
  });
}

// Touch class
if (window.matchMedia('(pointer: coarse)').matches) {
  document.body.classList.add('touch');
}
</script>
</body>
</html>
