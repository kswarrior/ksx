<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Official KS Warrior Website</title>

<style>
:root {
  --bg: #0a0a0f;
  --top: #0b0b0f;
  --panel: #15151b;
  --border: #24242c;
  --text: #e6e6eb;
  --muted: #9aa0aa;
  --accent: #3b82f6;
  --hover: #1f1f2a;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  overflow: hidden;
}

/* TOPBAR */
#topbar {
  position: fixed;
  top: 0; left: 0;
  width: 100%;
  height: 56px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 12px;
  background: var(--top);
  border-bottom: 1px solid var(--border);
  z-index: 1000;
}

/* LOGO */
.logo {
  width: 38px;
  height: 38px;
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}
.logo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* TITLE */
.owner-name {
  font-size: 15px;
  font-weight: 900;
  white-space: nowrap;
  flex: 1;
}

/* ICON BUTTONS */
.btn-icon, #hamburger {
  width: 38px;
  height: 38px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: #fff;
  cursor: pointer;
  font-size: 20px;
  display: grid;
  place-items: center;
}
#hamburger { font-size: 26px; }
.btn-icon:hover, #hamburger:hover {
  background: var(--hover);
}

/* SEARCH */
#searchBox {
  flex: 1;
  max-width: 300px;
  padding: 8px 12px;
  background: #121218;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: #fff;
  outline: none;
  opacity: 0;
  width: 0;
  transition: all 0.25s ease;
}
#topbar.search-active #searchBox {
  width: 100%;
  max-width: 400px;
  opacity: 1;
}
#topbar.search-active #searchIcon { display: none; }

/* SUGGESTIONS */
#suggestBox {
  position: fixed;
  top: 60px;
  left: 12px;
  right: 12px;
  max-width: 520px;
  margin: 0 auto;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  list-style: none;
  padding: 6px 0;
  box-shadow: 0 10px 25px rgba(0,0,0,0.4);
  display: none;
  z-index: 900;
  max-height: 300px;
  overflow-y: auto;
}
#suggestBox li {
  padding: 10px 16px;
  cursor: pointer;
  border-radius: 0;
}
#suggestBox li:hover,
#suggestBox li.active {
  background: var(--hover);
}

/* SIDEBAR */
#sidebar {
  position: fixed;
  top: 56px;
  left: -200px;
  width: 200px;
  height: calc(100% - 56px);
  background: linear-gradient(180deg, rgba(20,20,25,0.85), rgba(5,5,8,0.95));
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  padding: 16px 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
  box-shadow: inset -1px 0 0 rgba(255,255,255,.05), 8px 0 30px rgba(0,0,0,.6);
  transition: left 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  z-index: 800;
}
body.sidebar-open #sidebar { left: 0; }

#sidebar a {
  display: block;
  padding: 12px 20px;
  color: var(--text);
  text-decoration: none;
  border-radius: 0;
  transition: background 0.2s;
}
#sidebar a:hover {
  background: var(--hover);
}

/* FRAME */
#frame {
  position: fixed;
  top: 56px;
  left: 0;
  width: 100%;
  height: calc(100% - 56px);
  border: none;
  background: #fff;
  transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
}

/* Desktop sidebar push */
@media (min-width: 720px) {
  body.sidebar-open #frame {
    transform: translateX(200px);
  }
}
</style>
</head>

<body>

<div id="topbar">
  <div class="logo"><img src="/image/ks-logo.webp" alt="KS Logo"></div>
  <div class="owner-name">❰🔹❰❰ 𝑲𝑺 𝑾𝒂𝒓𝒓𝒊𝒐𝒓 ❱❱🔹❱</div>
  <button class="btn-icon" id="searchIcon">🔍</button>
  <input id="searchBox" type="text" placeholder="Search pages...">
  <button id="hamburger">≡</button>
</div>

<ul id="suggestBox"></ul>

<nav id="sidebar">
  <a onclick="loadInFrame('dashboard.html', 'Dashboard')">Dashboard</a>
  <a onclick="loadInFrame('social.html', 'Social Media')">Social Media</a>
  <a onclick="loadInFrame('about.html', 'About')">About</a>
</nav>

<iframe id="frame" src="dashboard.html"></iframe>

<script>
// Elements
const topbar = document.getElementById("topbar");
const searchIcon = document.getElementById("searchIcon");
const searchBox = document.getElementById("searchBox");
const suggestBox = document.getElementById("suggestBox");
const hamburger = document.getElementById("hamburger");
const frame = document.getElementById("frame");

// Config
const RECENT_KEY = "ks-web-recent";
const MAX_RECENT = 5;
let searchData = [];

// Load search index
fetch("/search-data.json")
  .then(r => r.ok ? r.json() : [])
  .then(data => searchData = data)
  .catch(() => searchData = []);

// === Recent Pages Management ===
function getRecent() {
  try {
    return JSON.parse(localStorage.getItem(RECENT_KEY)) || [];
  } catch { return []; }
}

function saveRecent(name, url) {
  if (!url || url === frame.src) return; // Avoid duplicates & same page

  let recent = getRecent();
  recent = recent.filter(item => item.url !== url);
  recent.unshift({ name, url, time: Date.now() });

  if (recent.length > MAX_RECENT) recent.pop();
  localStorage.setItem(RECENT_KEY, JSON.stringify(recent));
}

// === Load Page into Frame ===
function loadInFrame(url, fallbackName = null) {
  if (frame.src.endsWith(url)) return; // Prevent reload

  frame.src = url;

  // Find name from search data or use fallback
  const page = searchData.find(p => p.url === url);
  const name = page?.name || fallbackName || url.split('/').pop().replace('.html', '').replace('-', ' ');

  saveRecent(name, url);

  // Close mobile menu & search
  document.body.classList.remove("sidebar-open");
  topbar.classList.remove("search-active");
  suggestBox.style.display = "none";
  searchBox.value = "";
}

// === Search Functionality ===
let activeIndex = -1;

searchBox.oninput = () => {
  const query = searchBox.value.trim().toLowerCase();
  suggestBox.style.display = "none";
  activeIndex = -1;

  if (!query) return;

  const results = searchData
    .filter(item => item.name?.toLowerCase().includes(query))
    .slice(0, 8);

  if (!results.length) return;

  suggestBox.innerHTML = results
    .map(item => `<li data-url="${item.url}">${item.name}</li>`)
    .join("");

  suggestBox.style.display = "block";
};

// Keyboard navigation
searchBox.onkeydown = (e) => {
  const items = [...suggestBox.children];
  if (!items.length) return;

  if (e.key === "ArrowDown") {
    e.preventDefault();
    activeIndex = (activeIndex + 1) % items.length;
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    activeIndex = (activeIndex - 1 + items.length) % items.length;
  } else if (e.key === "Enter" && activeIndex >= 0) {
    e.preventDefault();
    loadInFrame(items[activeIndex].dataset.url);
    return;
  }

  items.forEach(i => i.classList.remove("active"));
  if (activeIndex >= 0) items[activeIndex].classList.add("active");
};

// Click suggestion
suggestBox.onclick = (e) => {
  const li = e.target.closest("li");
  if (li) loadInFrame(li.dataset.url);
};

// === UI Controls ===
searchIcon.onclick = () => {
  topbar.classList.add("search-active");
  searchBox.focus();
};

hamburger.onclick = () => {
  document.body.classList.toggle("sidebar-open");
};

// Close search/suggestions when clicking outside
document.addEventListener("click", (e) => {
  if (!topbar.contains(e.target) && !suggestBox.contains(e.target)) {
    topbar.classList.remove("search-active");
    suggestBox.style.display = "none";
    searchBox.value = "";
  }
});

// Optional: Save current page on load (for direct access)
window.addEventListener("load", () => {
  const current = frame.src.split('/').pop();
  const page = searchData.find(p => p.url.endsWith(current));
  if (page) saveRecent(page.name, page.url);
});
</script>

</body>
</html>
