<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KSX Loader</title>
<style>
  body{margin:0;font-family:sans-serif;background:#f5f7fb}

  /* Top Bar */
  #topbar{
    width:100%;
    background:#1e2a47;
    color:#fff;
    padding:10px;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    gap:10px;
  }

  #searchBox{
    flex:1;
    padding:8px 12px;
    border:0;
    border-radius:6px;
    font-size:15px;
  }

  #searchBtn{
    padding:8px 15px;
    background:#007bff;
    color:#fff;
    border:0;
    border-radius:6px;
    cursor:pointer;
    font-size:15px;
  }

  #frame{width:100vw;height:calc(100vh - 50px);border:0}
</style>
</head>
<body>

<!-- Top Bar -->
<div id="topbar">
  <input id="searchBox" type="text" placeholder="Search..." />
  <button id="searchBtn">Search</button>
</div>

<iframe id="frame"></iframe>

<script>
/* ---------------------------
   1. Pages for ?m=
---------------------------- */
const pages = {
  dashboard: "dashboard.html",
  about: "about.html",
  contact: "contact.html",
  free: "mc/hosting/free.html"
};

/* ---------------------------
   Helper
---------------------------- */
function getQuery(name){
  const p = new URLSearchParams(location.search);
  return p.get(name);
}

/* ---------------------------
   2. Handle ?m= and ?s=
---------------------------- */
async function init(){
  const m = getQuery("m");
  const s = getQuery("s");
  const frame = document.getElementById("frame");

  /* --- Case 1: ?m=pageKey --- */
  if(m){
    const key = m.toLowerCase();
    if(pages[key]){
      frame.src = pages[key];
      return;
    }
  }

  /* --- Case 2: ?s=searchName --- */
  if(s){
    try{
      const res = await fetch("search-data.json");
      const data = await res.json();
      const q = s.toLowerCase();

      const found = data.find(x =>
        (x.name || "").toLowerCase().includes(q)
      );

      if(found && found.url){
        frame.src = found.url;
        return;
      }
    }catch(e){
      console.warn("search-data.json error", e);
    }
  }

  /* --- Default --- */
  frame.src = "dashboard.html";
}

init();

/* ---------------------------
   3. Top bar search handler
---------------------------- */
document.getElementById("searchBtn").onclick = () => {
  const value = document.getElementById("searchBox").value.trim();
  if(value){
    // Reload page with ?s=
    location.href = "?s=" + encodeURIComponent(value);
  }
};
</script>

</body>
</html>
