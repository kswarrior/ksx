<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <meta name="description" content="KS Warrior (KSX) — official dashboard for panels, tools and hosting links. Fast, secure, and maintained resource hub for gaming & tech." />

  <link rel="canonical" href="https://ksx.pages.dev/" />
  <meta http-equiv="refresh" content="">

  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="shortcut icon" href="logo.png" />
  <meta name="theme-color" content="#0A73FF">
  <link rel="manifest" href="site.webmanifest">

  <meta property="og:site_name" content="KS Warrior" />
  <meta property="og:title" content="KS Warrior – Official KSX Dashboard & Tools" />
  <meta property="og:description" content="KS Warrior (KSX) — official dashboard for panels, hosting and developer tools." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://ksx.pages.dev/" />
  <meta property="og:image" content="https://ksx.pages.dev/og-image.png" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="KS Warrior – Official KSX Dashboard & Tools" />
  <meta name="twitter:description" content="Official KS Warrior (KSX) hub for panels, hosting, and developer tools." />
  <meta name="twitter:image" content="https://ksx.pages.dev/og-image.png" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "https://ksx.pages.dev/#website",
        "url": "https://ksx.pages.dev/",
        "name": "KS Warrior",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://ksx.pages.dev/?s={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      },
      {
        "@type": "Organization",
        "@id": "https://ksx.pages.dev/#org",
        "name": "KS Warrior",
        "url": "https://ksx.pages.dev/",
        "logo": "https://ksx.pages.dev/logo.png",
        "sameAs": []
      }
    ]
  }
  </script>

  <style>
    h1 { font-size: 0px }
    h2 { font-size: 0px }
    h3 { font-size: 0px }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #eef3ff;
      font-family: 'Poppins', sans-serif;
    }

    #verify-box {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(0,0,0,0.15);
      text-align: center;
      width: 330px;
    }

    button {
      padding: 10px 22px;
      font-size: 16px;
      background: #0A73FF;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #005fe0;
    }

    #loading {
      display: none;
      font-size: 16px;
      margin-top: 15px;
      font-weight: 600;
    }

    #continue-btn {
      display: none;
    }
  </style>
</head>

<body>

  <div id="verify-box">
    <h2 style="font-size:20px; font-weight:600;">Human Verification</h2>
    <p>Please verify to continue to KSX Dashboard.</p>

    <button id="verify-btn" onclick="startVerification()">Verify</button>

    <div id="loading">⏳ Verifying... Please wait 5 seconds</div>

    <button id="continue-btn" onclick="go()">Continue</button>
  </div>

  <script>
    function startVerification() {
      document.getElementById("verify-btn").style.display = "none";
      document.getElementById("loading").style.display = "block";

      setTimeout(() => {
        document.getElementById("loading").style.display = "none";
        document.getElementById("continue-btn").style.display = "inline-block";
      }, 5000);
    }

    function go() {
      window.location.href = "dashboard.html";
    }
  </script>

</body>
</html>
