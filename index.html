<style>
:root {
  --bg: #0a0a0f;
  --top: #0b0b10;
  --panel: #15151b;
  --border: #24242c;
  --text: #e6e6eb;
  --muted: #9aa0aa;
  --accent: #3b82f6;
  --accent-hover: #2563eb;
  --hover: #1f1f2a;
  --glass: rgba(20, 20, 30, 0.85);
  --topbar-height: 56px;
  --sidebar-width: 240px;
  --sidebar-collapsed: -240px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  overflow: hidden;
  user-select: none;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* TOPBAR - Responsive */
#topbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--topbar-height);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 12px;
  background: var(--top);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  z-index: 1000;
  transition: all 0.3s ease;
}

/* LOGO & TITLE - Responsive */
.logo {
  width: 32px; height: 32px;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  flex-shrink: 0;
  transition: transform 0.2s ease;
}
.logo:hover { transform: scale(1.05); }
.logo img { width: 100%; height: 100%; object-fit: cover; }

.owner-name {
  font-size: 14px;
  font-weight: 900;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  user-select: none;
  letter-spacing: -0.2px;
}

#control-right {
  display: flex;
  align-items: center;
  gap: 8px;
  justify-content: flex-end;
}

/* FAVORITE BUTTON */
#favButton {
  cursor: pointer;
  color: var(--accent);
  font-size: 20px;
  font-weight: 900;
  user-select: none;
  transition: transform 0.2s ease, color 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  border-radius: 10px;
  flex-shrink: 0;
}

#favButton:hover {
  color: var(--accent);
  transform: scale(1.1);
  background: var(--hover);
}

#favButton.filled {
  color: var(--accent);
}

.fav-svg {
  filter: drop-shadow(0 0 2px rgba(0,0,0,0.35));
  transition: all 0.2s ease;
}

/* SEARCH CONTAINER - Responsive Design */
.search-container {
  position: relative;
  width: 40px;
  transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  overflow: hidden;
  flex-shrink: 0;
}

#topbar.search-active .search-container {
  width: min(320px, 50vw);
}

#searchBox {
  width: 100%;
  height: 40px;
  padding: 0 14px 0 44px;
  background: rgba(18, 18, 24, 0.9);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-size: 14px;
  outline: none;
  opacity: 0;
  transition: opacity 0.3s ease 0.1s, border-color 0.2s ease;
}

#topbar.search-active #searchBox {
  opacity: 1;
}

#searchBox:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
}

/* Search Icon */
#searchTrigger {
  position: absolute;
  left: 0;
  top: 0;
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  cursor: pointer;
  color: var(--text);
  font-size: 20px;
  z-index: 2;
  transition: color 0.2s ease;
  -webkit-tap-highlight-color: transparent;
}

#searchTrigger:hover {
  color: var(--accent);
}

.search-svg {
  width: 22px;
  height: 22px;
  stroke: #F5F5F5;
  stroke-width: 2.2;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition: stroke 0.25s ease, transform 0.25s ease, filter 0.25s ease;
}

#searchTrigger:hover .search-svg {
  stroke: var(--accent);
  transform: scale(1.15);
  filter: drop-shadow(0 0 6px rgba(59,130,246,0.6));
}

#topbar.search-active .search-svg {
  stroke: var(--accent);
}

/* HAMBURGER */
#hamburger {
  width: 40px; height: 40px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  cursor: pointer;
  font-size: 22px;
  display: grid;
  place-items: center;
  transition: all 0.2s ease;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
}

#hamburger:hover, #hamburger:active {
  background: var(--hover);
  border-color: var(--accent);
}

.menu-svg {
  width: 20px;
  height: 20px;
  stroke: #F5F5F5;
  stroke-width: 2.2;
  fill: none;
  stroke-linecap: round;
  transition: stroke 0.25s ease, transform 0.25s ease, filter 0.25s ease;
}

#hamburger:hover .menu-svg {
  stroke: var(--accent);
  transform: scale(1.1);
  filter: drop-shadow(0 0 6px rgba(59,130,246,0.5));
}

/* SUGGESTIONS - Responsive */
#suggestBox {
  position: fixed;
  top: calc(var(--topbar-height) + 8px);
  left: 16px; right: 16px;
  max-width: min(560px, calc(100% - 32px));
  margin: 0 auto;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  list-style: none;
  padding: 8px 0;
  box-shadow: 0 12px 32px rgba(0,0,0,0.5);
  display: none;
  z-index: 900;
  max-height: min(360px, 60vh);
  overflow-y: auto;
  backdrop-filter: blur(12px);
  -webkit-overflow-scrolling: touch;
}

#suggestBox li {
  padding: 12px 18px;
  cursor: pointer;
  transition: background 0.2s ease;
  min-height: 44px;
  display: flex;
  align-items: center;
}

#suggestBox li:hover,
#suggestBox li.active {
  background: var(--hover);
}

/* SIDEBAR - Responsive */
#sidebar {
  position: fixed;
  top: var(--topbar-height);
  left: var(--sidebar-collapsed);
  width: var(--sidebar-width);
  height: calc(100% - var(--topbar-height));
  background: var(--glass);
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  padding: 20px 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
  transition: left 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  z-index: 800;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  border-right: 1px solid var(--border);
}

body.sidebar-open #sidebar { left: 0; }

#sidebar a {
  display: flex;
  align-items: center;
  padding: 14px 24px;
  color: var(--text);
  text-decoration: none;
  font-size: 15px;
  font-weight: 500;
  transition: all 0.25s ease;
  border-left: 3px solid transparent;
  user-select: none;
  min-height: 48px;
  position: relative;
}

#sidebar a:hover, #sidebar a:active {
  background: var(--hover);
  border-left-color: var(--accent);
  padding-left: 28px;
  color: var(--accent);
}

/* Sidebar overlay for mobile */
#sidebar-overlay {
  position: fixed;
  inset: var(--topbar-height) 0 0 0;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(4px);
  z-index: 700;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.3s ease, visibility 0.3s ease;
}

body.sidebar-open #sidebar-overlay {
  opacity: 1;
  visibility: visible;
}

/* FRAME - Responsive */
#frame {
  position: fixed;
  top: var(--topbar-height);
  left: 0;
  width: 100%;
  height: calc(100% - var(--topbar-height));
  border: none;
  background: #fff;
  transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), left 0.4s ease, width 0.4s ease;
}

/* Desktop sidebar persistent */
@media (min-width: 1024px) {
  :root {
    --sidebar-width: 260px;
    --sidebar-collapsed: 0;
  }
  
  #sidebar {
    left: 0;
    border-right: 1px solid var(--border);
  }
  
  #frame {
    left: var(--sidebar-width);
    width: calc(100% - var(--sidebar-width));
  }
  
  #hamburger {
    display: none;
  }
  
  #sidebar-overlay {
    display: none;
  }
  
  body.sidebar-open #frame {
    transform: none;
  }
}

/* Tablet adjustments */
@media (min-width: 768px) and (max-width: 1023px) {
  .owner-name {
    font-size: 16px;
  }
  
  #topbar.search-active .search-container {
    width: 280px;
  }
}

/* Mobile optimizations */
@media (max-width: 767px) {
  :root {
    --topbar-height: 52px;
  }
  
  #topbar {
    padding: 0 8px;
    gap: 6px;
  }
  
  .logo {
    width: 28px;
    height: 28px;
  }
  
  .owner-name {
    font-size: 12px;
    max-width: 120px;
  }
  
  #topbar.search-active .owner-name {
    display: none;
  }
  
  #topbar.search-active .search-container {
    width: calc(100vw - 80px);
    flex: 1;
  }
  
  #topbar.search-active .logo {
    display: none;
  }
  
  #favButton {
    width: 36px;
    height: 36px;
  }
  
  #hamburger {
    width: 36px;
    height: 36px;
  }
  
  #searchTrigger {
    width: 36px;
    height: 36px;
  }
  
  #searchBox {
    height: 36px;
    font-size: 16px; /* Prevent zoom on iOS */
  }
  
  .search-container {
    width: 36px;
  }
  
  #sidebar {
    width: 280px;
    left: -280px;
  }
  
  body.sidebar-open #sidebar {
    left: 0;
  }
  
  #sidebar a {
    padding: 16px 24px;
    font-size: 16px;
  }
  
  #suggestBox {
    top: calc(var(--topbar-height) + 4px);
    left: 8px;
    right: 8px;
    border-radius: 16px;
  }
  
  #suggestBox li {
    padding: 14px 16px;
    font-size: 15px;
  }
}

/* Small mobile */
@media (max-width: 380px) {
  .owner-name {
    font-size: 11px;
    letter-spacing: -0.3px;
  }
  
  #favButton {
    width: 32px;
    height: 32px;
  }
  
  .fav-svg {
    width: 16px;
    height: 16px;
  }
}

/* Landscape mobile */
@media (max-height: 500px) and (orientation: landscape) {
  :root {
    --topbar-height: 48px;
  }
  
  #suggestBox {
    max-height: 50vh;
  }
  
  #sidebar {
    padding: 10px 0;
  }
  
  #sidebar a {
    padding: 12px 24px;
    min-height: 44px;
  }
}

/* Large desktop */
@media (min-width: 1440px) {
  :root {
    --sidebar-width: 300px;
  }
  
  #sidebar a {
    font-size: 16px;
    padding: 16px 28px;
  }
  
  .owner-name {
    font-size: 16px;
  }
}

/* ICON */
.s-icon {
  display: inline-grid;
  place-items: center;
  width: 22px;
  height: 22px;
  margin-right: 8px;
  border-radius: 6px;
  background: rgba(59, 130, 246, 0.15);
  color: var(--accent);
  font-size: 13px;
  flex-shrink: 0;
}

/* CATEGORY */
.s-category {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 15px;
  font-weight: 800;
  color: var(--accent);
  padding: 12px 18px 8px;
  margin-top: 4px;
  cursor: default;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  opacity: 0.95;
  pointer-events: none;
}

.s-category::after {
  content: "";
  display: block;
  width: 100%;
  height: 1px;
  background: linear-gradient(to right, var(--accent), transparent);
  margin-top: 6px;
  opacity: 0.25;
}

/* TITLE */
.s-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  padding: 8px 28px 6px;
  margin-left: 35px;
  opacity: 0.85;
  cursor: default;
  position: relative;
  pointer-events: none;
}

.s-title::before {
  content: "❯❯";
  position: absolute;
  left: -5px;
  color: var(--accent);
  opacity: 0.6;
  font-size: 10px;
}

/* PAGE */
.s-page {
  font-size: 12px;
  padding: 10px 40px;
  margin-left: 55px;
  color: var(--muted);
  border-radius: 8px;
  transition: all 0.2s ease;
  position: relative;
}

.s-page:hover, .s-page.active {
  background: linear-gradient(90deg, rgba(59, 130, 246, 0.15), transparent);
  color: var(--text);
}

.s-page::before {
  content: "➣";
  position: absolute;
  left: -5px;
  top: 8px;
  bottom: 8px;
  width: 3px;
  opacity: 0;
  border-radius: 3px;
  background: var(--accent);
  transition: opacity 0.2s ease;
}

.s-page:hover::before, .s-page.active::before {
  opacity: 1;
}

/* Animations */
#suggestBox li {
  animation: fadeIn 0.15s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Touch feedback */
@media (hover: none) {
  #sidebar a:active,
  #hamburger:active,
  #searchTrigger:active,
  #favButton:active {
    transform: scale(0.95);
    opacity: 0.8;
  }
  
  .s-page:active {
    background: rgba(59, 130, 246, 0.25);
  }
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  * {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* Dark mode support (system preference) */
@media (prefers-color-scheme: light) {
  /* Keep dark theme regardless of system preference for gaming aesthetic */
}

/* Safe area insets for notched devices */
@supports (padding-top: env(safe-area-inset-top)) {
  #topbar {
    padding-top: env(safe-area-inset-top);
    height: calc(var(--topbar-height) + env(safe-area-inset-top));
  }
  
  #sidebar, #frame, #pageLoader {
    top: calc(var(--topbar-height) + env(safe-area-inset-top));
    height: calc(100% - var(--topbar-height) - env(safe-area-inset-top));
  }
  
  #suggestBox {
    top: calc(var(--topbar-height) + env(safe-area-inset-top) + 8px);
  }
  
  #topLoader {
    top: calc(var(--topbar-height) + env(safe-area-inset-top));
  }
}
</style>
</head>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const frame = document.getElementById("frame");
  const topbar = document.getElementById("topbar");
  const suggestBox = document.getElementById("suggestBox");
  const searchBox = document.getElementById("searchBox");
  const hamburger = document.getElementById("hamburger");
  const sidebar = document.getElementById("sidebar");
  const sidebarOverlay = document.getElementById("sidebar-overlay");
  const favButton = document.getElementById("favButton");

  // Detect touch device
  const isTouchDevice = window.matchMedia('(pointer: coarse)').matches;
  const isDesktop = window.innerWidth >= 1024;

  // Page Loader
  const pageLoader = document.createElement("div");
  pageLoader.id = "pageLoader";
  pageLoader.innerHTML = `
    <div class="loader-box">
      <svg class="ks-loader" width="120" height="40" viewBox="0 0 120 40">
        <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" 
          font-family="monospace" font-size="28" fill="none" stroke="var(--accent)" 
          stroke-width="1.5" stroke-dasharray="100" stroke-dashoffset="100">
          ❰🔹❰❰ 𝑲𝑺 ❱❱🔹❱
        </text>
      </svg>
    </div>
  `;
  document.body.appendChild(pageLoader);

  // Top Loader
  const topLoader = document.createElement("div");
  topLoader.id = "topLoader";
  document.body.appendChild(topLoader);

  // Loader CSS
  const loaderCSS = document.createElement("style");
  loaderCSS.innerHTML = `
    #pageLoader {
      position: fixed;
      inset: var(--topbar-height) 0 0 0;
      background: rgba(10, 10, 15, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    #pageLoader.active {
      opacity: 1;
      pointer-events: all;
    }
    .loader-box {
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      gap: 14px;
    }
    .ks-loader text {
      stroke: var(--accent);
      stroke-width: 1.5;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: ks-draw 2s cubic-bezier(0.65, 0, 0.35, 1) infinite alternate;
    }
    @keyframes ks-draw {
      0% { stroke-dashoffset: 100; fill: none; opacity: 0.25; }
      40% { stroke-dashoffset: 0; fill: var(--accent); opacity: 1; }
      100% { stroke-dashoffset: 100; fill: none; opacity: 0.25; }
    }
    #topLoader {
      position: fixed;
      top: var(--topbar-height);
      left: 0;
      width: 0%;
      height: 2px;
      background: var(--accent);
      z-index: 1300;
      transition: width 1.5s ease;
    }
    @supports (padding-top: env(safe-area-inset-top)) {
      #pageLoader { top: calc(var(--topbar-height) + env(safe-area-inset-top)); }
      #topLoader { top: calc(var(--topbar-height) + env(safe-area-inset-top)); }
    }
  `;
  document.head.appendChild(loaderCSS);

  // Top Loader Functions
  let loaderInterval;
  function startTopLoader() {
    topLoader.style.width = "0%";
    let width = 0;
    loaderInterval = setInterval(() => {
      width += Math.random() * 2;
      if (width < 90) topLoader.style.width = width + "%";
    }, 20);
  }

  function finishTopLoader() {
    clearInterval(loaderInterval);
    topLoader.style.width = "100%";
    setTimeout(() => { topLoader.style.width = "0%"; }, 300);
  }

  // Load Frame Function
  const LAST_PAGE_KEY = "ks-web-last-page";
  window.loadInFrame = function(url, nameFromSearch = null) {
    if (!url) return;
    if (frame.getAttribute("data-current") === url) return;
    
    frame.setAttribute("data-current", url);
    localStorage.setItem(LAST_PAGE_KEY, url);
    
    // Close mobile sidebar
    if (!isDesktop) {
      document.body.classList.remove("sidebar-open");
      hamburger.setAttribute("aria-expanded", "false");
    }
    
    topbar.classList.remove("search-active");
    suggestBox.style.display = "none";
    searchBox.value = "";
    searchBox.blur();

    pageLoader.classList.add("active");
    const startTime = Date.now();
    startTopLoader();

    frame.src = url;

    frame.onload = () => {
      const elapsed = Date.now() - startTime;
      const wait = Math.max(2500 - elapsed, 0);
      setTimeout(() => {
        pageLoader.classList.remove("active");
        finishTopLoader();
        updateFavIcon();
      }, wait);

      if (nameFromSearch && typeof saveToRecent === "function") {
        saveToRecent(nameFromSearch, url);
      }
    };
  };

  // Restore Last Page
  const lastPage = localStorage.getItem(LAST_PAGE_KEY);
  loadInFrame(lastPage || "dashboard.html");

  // Sidebar Toggle
  hamburger.addEventListener("click", () => {
    const isOpen = document.body.classList.toggle("sidebar-open");
    hamburger.setAttribute("aria-expanded", isOpen);
  });

  // Close sidebar when clicking overlay
  sidebarOverlay.addEventListener("click", () => {
    document.body.classList.remove("sidebar-open");
    hamburger.setAttribute("aria-expanded", "false");
  });

  // Close sidebar on escape key
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && document.body.classList.contains("sidebar-open")) {
      document.body.classList.remove("sidebar-open");
      hamburger.setAttribute("aria-expanded", "false");
    }
  });

  // Handle resize
  let resizeTimeout;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
      const newIsDesktop = window.innerWidth >= 1024;
      if (newIsDesktop !== isDesktop) {
        location.reload(); // Reload to apply desktop/mobile styles properly
      }
    }, 250);
  });

  // Search Data
  const RECENT_KEY = "ks-web-recent";
  const MAX_RECENT = 5;
  let searchData = [];

  // Load sitemap
  fetch("/sitemap.json")
    .then(r => r.ok ? r.json() : [])
    .then(data => {
      const list = [];
      data.forEach(cat => {
        const category = cat.category;
        const icon = cat.icon || "";
        (cat.sections || []).forEach(sec => {
          const title = sec.title;
          (sec.pages || []).forEach(page => {
            list.push({ icon, category, title, name: page.name, url: page.url });
          });
        });
      });
      searchData = list;
    })
    .catch(() => { searchData = []; });

  // Save to recent
  window.saveToRecent = function(name, url) {
    if (!name || !url) return;
    let recent = JSON.parse(localStorage.getItem(RECENT_KEY) || "[]");
    recent = recent.filter(item => item.url !== url);
    recent.unshift({ name, url, time: Date.now() });
    recent = recent.slice(0, MAX_RECENT);
    localStorage.setItem(RECENT_KEY, JSON.stringify(recent));
  };

  // Search functionality
  let activeIndex = -1;
  const searchTrigger = document.getElementById("searchTrigger");

  function updateSuggestions() {
    const query = searchBox.value.trim().toLowerCase();
    suggestBox.innerHTML = "";
    suggestBox.style.display = "none";
    activeIndex = -1;

    if (!query || searchData.length === 0) return;

    const matched = searchData.filter(item =>
      item.name.toLowerCase().includes(query) ||
      item.title.toLowerCase().includes(query) ||
      item.category.toLowerCase().includes(query)
    );

    if (matched.length === 0) {
      suggestBox.innerHTML = `<li style="padding:14px 18px;color:var(--muted);">No results found</li>`;
      suggestBox.style.display = "block";
      return;
    }

    const tree = {};
    matched.forEach(i => {
      tree[i.category] ??= { icon: i.icon, titles: {} };
      tree[i.category].titles[i.title] ??= [];
      tree[i.category].titles[i.title].push(i);
    });

    let html = "";
    Object.entries(tree).forEach(([category, data]) => {
      html += `<li class="s-category"><span class="s-icon">${data.icon}</span><span>${category}</span></li>`;
      Object.entries(data.titles).forEach(([title, pages]) => {
        html += `<li class="s-title">${title}</li>`;
        pages.forEach(p => {
          html += `<li class="s-page" tabindex="0" role="option" data-url="${p.url}" data-name="${p.name}">${p.name}</li>`;
        });
      });
    });

    suggestBox.innerHTML = html;
    suggestBox.style.display = "block";
  }

  searchBox.addEventListener("input", updateSuggestions);

  searchBox.addEventListener("keydown", (e) => {
    const items = [...suggestBox.querySelectorAll("li[role='option']")];
    if (items.length === 0) return;

    if (e.key === "ArrowDown") {
      e.preventDefault();
      activeIndex = (activeIndex + 1) % items.length;
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      activeIndex = (activeIndex - 1 + items.length) % items.length;
    } else if (e.key === "Enter") {
      e.preventDefault();
      if (activeIndex >= 0) {
        const item = items[activeIndex];
        loadInFrame(item.dataset.url, item.dataset.name);
      }
      return;
    } else if (e.key === "Escape") {
      topbar.classList.remove("search-active");
      suggestBox.style.display = "none";
      searchBox.value = "";
      searchBox.blur();
      return;
    }

    items.forEach(i => i.classList.remove("active"));
    if (activeIndex >= 0) items[activeIndex].classList.add("active");
  });

  suggestBox.addEventListener("click", (e) => {
    const li = e.target.closest("li[role='option']");
    if (li) loadInFrame(li.dataset.url, li.dataset.name);
  });

  // Search trigger
  searchTrigger.addEventListener("click", (e) => {
    e.stopPropagation();
    topbar.classList.add("search-active");
    setTimeout(() => searchBox.focus(), 100);
    updateSuggestions();
  });

  searchTrigger.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      searchTrigger.click();
    }
  });

  // Close search on outside click
  document.addEventListener("click", (e) => {
    if (!topbar.contains(e.target) && !suggestBox.contains(e.target)) {
      topbar.classList.remove("search-active");
      suggestBox.style.display = "none";
      searchBox.value = "";
    }
  });

  suggestBox.addEventListener("click", (e) => e.stopPropagation());

  // Favorites
  const FAV_KEY = "ks-web-fav";
  
  const getFavorites = () => JSON.parse(localStorage.getItem(FAV_KEY) || "[]");
  const isFavorite = (url) => getFavorites().some(item => new URL(item.url, location.href).href === url);

  window.updateFavIcon = function() {
    const frameUrl = frame.src;
    const filledStarSVG = `<svg class="fav-svg" width="20" height="20" fill="#F5F5F5" stroke="#F5F5F5" stroke-width="1" viewBox="0 0 24 24"><path d="M12 .587l3.668 7.431 8.2 1.192-5.934 5.778 1.4 8.164L12 18.897l-7.334 3.855 1.4-8.164L.132 9.21l8.2-1.192z"/></svg>`;
    const emptyStarSVG = `<svg class="fav-svg" width="20" height="20" fill="none" stroke="#F5F5F5" stroke-width="2" viewBox="0 0 24 24"><path d="M12 .587l3.668 7.431 8.2 1.192-5.934 5.778 1.4 8.164L12 18.897l-7.334 3.855 1.4-8.164L.132 9.21l8.2-1.192z"/></svg>`;

    if (isFavorite(frameUrl)) {
      favButton.innerHTML = filledStarSVG;
      favButton.classList.add("filled");
      favButton.setAttribute("aria-label", "Remove from favorites");
    } else {
      favButton.innerHTML = emptyStarSVG;
      favButton.classList.remove("filled");
      favButton.setAttribute("aria-label", "Add to favorites");
    }
  };

  favButton.addEventListener("click", () => {
    const frameUrl = frame.src;
    const found = searchData.find(item => new URL(item.url, location.href).href === frameUrl);
    const pageName = found ? found.name : "Current Page";

    let favs = getFavorites();

    if (isFavorite(frameUrl)) {
      favs = favs.filter(item => new URL(item.url, location.href).href !== frameUrl);
    } else {
      favs.unshift({ name: pageName, url: frameUrl, time: Date.now() });
    }

    localStorage.setItem(FAV_KEY, JSON.stringify(favs));
    updateFavIcon();

    favButton.style.transform = "scale(1.3)";
    setTimeout(() => favButton.style.transform = "", 150);
  });

  frame.addEventListener("load", updateFavIcon);
  updateFavIcon();

  // Prevent zoom on double tap for mobile
  if (isTouchDevice) {
    let lastTouchEnd = 0;
    document.addEventListener("touchend", (e) => {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) {
        e.preventDefault();
      }
      lastTouchEnd = now;
    }, { passive: false });
  }

  // Service Worker registration for PWA
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
});
</script>
</body>
</html>
