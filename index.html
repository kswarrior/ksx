<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>KS Warrior</title>

<style>
:root{
  --bg:#0e0e11;
  --top:#0b0b0f;
  --panel:#15151b;
  --border:#24242c;
  --text:#e6e6eb;
  --muted:#9aa0aa;
  --accent:#3b82f6;
}

html,body{
  height:100%;
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial;
}

/* TOPBAR */
#topbar{
  position:fixed;
  top:0;left:0;
  width:100%;
  height:56px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 14px;
  background:var(--top);
  border-bottom:1px solid var(--border);
  z-index:1000;
}

/* LOGO */
.logo{
  width:35px;
  height:35px;
  background: #000;
  border: 1px solid #eee;
  border-radius:8px;
  display:grid;
  place-items:center;
}
.logo img{
  width:22px;
  height:22px;
}

/* TITLE */
.owner-name{
  font-size:14px;
  font-weight:600;
  color:#fff;
  white-space:nowrap;
}

/* BUTTONS */
.btn-icon {
  width:38px;
  height:38px;
  background:transparent;
  border:1px solid var(--border);
  border-radius:8px;
  color:#fff;
  cursor:pointer;
}
.btn-icon:hover,#hamburger:hover{
  background:#1a1a22;
}

.hamburger-container {
  display: flex; /* Use flexbox to align items */
  justify-content: flex-start; /* Align items to the start (left) */
  align-items: center; /* Center items vertically */
  padding: 10px;
}
  
#hamburger {
  width: 38px;
  height: 38px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: #fff;
  cursor: pointer;
}

/* SEARCH */
#searchBox{
  flex:1;
  max-width:175px;
  padding:8px 10px;
  background:#121218;
  border:1px solid var(--border);
  border-radius:8px;
  color:#fff;
  outline:none;
  width:0;
  opacity:0;
  transition:.2s;
}
#topbar.search-active #searchBox{
  width:100%;
  opacity:1;
}
#topbar.search-active #searchIcon{
  display:none;
}

/* SUGGESTIONS */
#suggestBox{
  position:absolute;
  top:56px;
  left:10px;
  width:calc(100% - 20px);
  max-width:520px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:8px;
  list-style:none;
  padding:6px;
  display:none;
  z-index:90;
}
#suggestBox li{
  padding:8px 10px;
  border-radius:6px;
  cursor:pointer;
  font-size:14px;
}
#suggestBox li:hover,
#suggestBox li.active{
  background:#1f1f2a;
}

/* SIDEBAR */
#sidebar{
  position:fixed;
  top:56px;
  left:-260px;
  width:175px;
  height:calc(100% - 55px);
  background:var(--panel);
  border-right:1px solid var(--border);
  padding:12px;
  transition:.25s;
  z-index:70;
}
body.sidebar-open #sidebar{ left:0; }

#sidebar a{
  display:block;
  padding:10px;
  border-radius:6px;
  text-decoration:none;
  color:var(--text);
  font-weight:500;
}
#sidebar a:hover{
  background:#1f1f2a;
}

/* FRAME */
#frame{
  position:fixed;
  top:56px;
  left:0;
  width:100vw;
  height:calc(100vh - 56px);
  border:0;
  background:#fff;
}

@media(min-width:720px){
  body.sidebar-open #frame{
    transform:translateX(260px);
  }
}
</style>
</head>

<body>

<div id="topbar">
  <div class="logo"><img src="/image/ks-logo.webp"></div>
  <h1 class="owner-name">❰🔹❰❰ 𝑲𝑺 𝑾𝒂𝒓𝒓𝒊𝒐𝒓 ❱❱🔹❱</h1>

  <button class="btn-icon" id="searchIcon">🔍</button>
  <input id="searchBox" placeholder="Search...">
<div class="hamburger-container" >
  <button id="hamburger">☰</button>
</div>
</div>

<ul id="suggestBox"></ul>

<nav id="sidebar">
  <a href="#" onclick="loadInFrame('dashboard.html')">Dashboard</a>
  <a href="#" onclick="loadInFrame('about.html')">About</a>
</nav>

<iframe id="frame"></iframe>

<script>
const topbar=document.getElementById("topbar");
const searchIcon=document.getElementById("searchIcon");
const searchBox=document.getElementById("searchBox");
const suggestBox=document.getElementById("suggestBox");
const hamburger=document.getElementById("hamburger");
const frame=document.getElementById("frame");

let searchData=[],activeIndex=-1;
frame.src="/dashboard.html";

fetch("/search-data.json").then(r=>r.json()).then(d=>searchData=d);

searchIcon.onclick=()=>{topbar.classList.add("search-active");searchBox.focus();}
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    topbar.classList.remove("search-active");
    searchBox.value="";
    suggestBox.style.display="none";
  }
});
hamburger.onclick=()=>document.body.classList.toggle("sidebar-open");
function loadInFrame(u){frame.src=u;document.body.classList.remove("sidebar-open");}

searchBox.oninput=()=>{
  const q=searchBox.value.toLowerCase().trim();
  if(!q){suggestBox.style.display="none";return;}
  const r=searchData.filter(i=>(i.name||"").toLowerCase().includes(q));
  if(!r.length){suggestBox.style.display="none";return;}
  suggestBox.innerHTML=r.slice(0,8).map((x,i)=>`<li data-i="${i}" data-url="${x.url}">${x.name}</li>`).join("");
  activeIndex=-1;
  suggestBox.style.display="block";
};

searchBox.onkeydown=e=>{
  const items=[...suggestBox.children];
  if(!items.length)return;
  if(e.key==="ArrowDown")activeIndex=(activeIndex+1)%items.length;
  if(e.key==="ArrowUp")activeIndex=(activeIndex-1+items.length)%items.length;
  if(e.key==="Enter"){
    const li=items[activeIndex];
    if(li)location.href=li.dataset.url;
  }
  items.forEach(i=>i.classList.remove("active"));
  if(items[activeIndex])items[activeIndex].classList.add("active");
};

suggestBox.onclick=e=>{
  const li=e.target.closest("li");
  if(li)location.href=li.dataset.url;
};
</script>

</body>
</html>
