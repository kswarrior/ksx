<style>
:root {
  --bg: #0a0a0f;
  --surface: #12121a;
  --panel: #1a1a24;
  --border: #2a2a35;
  --text: #f0f0f5;
  --muted: #8b8b9a;
  --accent: #3b82f6;
  --accent-glow: rgba(59, 130, 246, 0.4);
  --hover: #252530;
  --topbar-height: 60px;
  --sidebar-width: 280px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ============================================
   CINEMATIC LOADER - Fixed
   ============================================ */
#loader-container {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 10000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity 0.5s ease, visibility 0.5s ease;
}

#loader-container.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

/* Animated background grid */
.loader-bg {
  position: absolute;
  inset: 0;
  overflow: hidden;
  opacity: 0.4;
}

.loader-grid {
  position: absolute;
  width: 200%;
  height: 200%;
  top: -50%;
  left: -50%;
  background-image: 
    linear-gradient(rgba(59, 130, 246, 0.1) 1px, transparent 1px),
    linear-gradient(90deg, rgba(59, 130, 246, 0.1) 1px, transparent 1px);
  background-size: 40px 40px;
  transform: perspective(500px) rotateX(60deg);
  animation: gridScroll 8s linear infinite;
}

@keyframes gridScroll {
  0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
  100% { transform: perspective(500px) rotateX(60deg) translateY(40px); }
}

/* Floating particles */
.particles {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.particle {
  position: absolute;
  width: 3px;
  height: 3px;
  background: var(--accent);
  border-radius: 50%;
  box-shadow: 0 0 6px var(--accent);
  animation: particleFloat 4s ease-in-out infinite;
}

.particle:nth-child(1) { left: 20%; top: 30%; animation-delay: 0s; }
.particle:nth-child(2) { left: 80%; top: 20%; animation-delay: 0.8s; }
.particle:nth-child(3) { left: 60%; top: 70%; animation-delay: 1.6s; }
.particle:nth-child(4) { left: 30%; top: 60%; animation-delay: 2.4s; }
.particle:nth-child(5) { left: 70%; top: 40%; animation-delay: 3.2s; }

@keyframes particleFloat {
  0%, 100% { transform: translateY(0) scale(1); opacity: 0.4; }
  50% { transform: translateY(-30px) scale(1.5); opacity: 1; }
}

/* Central loader content */
.loader-content {
  position: relative;
  z-index: -index: 10;
  text-align: center;
}

/* Triple ring spinner */
.loader-rings {
  position: relative;
  width: 100px;
  height: 100px;
  margin: 0 auto 30px;
}

.ring {
  position: absolute;
  inset: 0;
  border: 3px solid transparent;
  border-radius: 50%;
  border-top-color: var(--accent);
  animation: spin 1.2s linear infinite;
}

.ring:nth-child(1) {
  inset: 0;
  border-top-color: var(--accent);
  box-shadow: 0 0 10px var(--accent-glow);
}

.ring:nth-child(2) {
  inset: -12px;
  border-top-color: rgba(59, 130, 246, 0.4);
  animation-duration: 1.8s;
  animation-direction: reverse;
}

.ring:nth-child(3) {
  inset: 8px;
  border-top-color: rgba(59, 130, 246, 0.7);
  animation-duration: 0.9s;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* Logo text with pulse */
.loader-logo {
  font-size: 26px;
  font-weight: 900;
  letter-spacing: 3px;
  background: linear-gradient(135deg, #fff 0%, var(--accent) 50%, #fff 100%);
  background-size: 200% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shine 3s linear infinite;
  margin-bottom: 20px;
}

@keyframes shine {
  to { background-position: 200% center; }
}

/* Progress bar */
.loader-progress {
  width: 180px;
  height: 2px;
  background: var(--border);
  border-radius: 2px;
  margin: 0 auto;
  overflow: hidden;
  position: relative;
}

.loader-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--accent), #60a5fa);
  border-radius: 2px;
  transition: width 0.2s ease;
  box-shadow: 0 0 10px var(--accent);
}

/* Loading text */
.loader-text {
  margin-top: 16px;
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 2px;
  text-transform: uppercase;
  animation: pulse 1.5s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 1; }
}

/* ============================================
   TOPBAR - Fixed Layout
   ============================================ */
#topbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: var(--topbar-height);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  z-index: 1000;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

/* Left: Logo + Title */
.topbar-left {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
  min-width: 0;
}

.logo {
  width: 36px;
  height: 36px;
  border: 2px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  flex-shrink: 0;
  transition: all 0.3s ease;
}

.logo:hover {
  border-color: var(--accent);
  box-shadow: 0 0 15px var(--accent-glow);
}

.logo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.owner-name {
  font-size: 15px;
  font-weight: 800;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 0.5px;
}

/* Right: Controls */
.topbar-right {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

/* Search - Fixed sizing */
.search-box {
  position: relative;
}

#searchInput {
  width: 42px;
  height: 42px;
  padding: 0 16px 0 42px;
  background: var(--panel);
  border: 2px solid var(--border);
  border-radius: 21px;
  color: var(--text);
  font-size: 14px;
  outline: none;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  cursor: pointer;
}

#searchInput.expanded {
  width: 260px;
  cursor: text;
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
}

#searchIcon {
  position: absolute;
  left: 13px;
  top: 50%;
  transform: translateY(-50%);
  width: 18px;
  height: 18px;
  color: var(--muted);
  pointer-events: none;
  transition: color 0.3s ease;
}

#searchInput.expanded + #searchIcon {
  color: var(--accent);
}

.search-icon-svg {
  width: 100%;
  height: 100%;
}

/* Favorite Button */
#favBtn {
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--panel);
  border: 2px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.3s ease;
  color: var(--muted);
}

#favBtn:hover {
  border-color: var(--accent);
  color: var(--accent);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
}

#favBtn.active {
  color: var(--accent);
  background: rgba(59, 130, 246, 0.1);
}

/* Menu Button - Clean 3 lines */
#menuBtn {
  width: 42px;
  height: 42px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: var(--panel);
  border: 2px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.3s ease;
  padding: 0;
}

#menuBtn:hover {
  border-color: var(--accent);
  box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
}

#menuBtn span {
  display: block;
  width: 18px;
  height: 2px;
  background: var(--text);
  border-radius: 2px;
  transition: all 0.3s ease;
  transform-origin: center;
}

#menuBtn.active span:nth-child(1) {
  transform: translateY(7px) rotate(45deg);
}

#menuBtn.active span:nth-child(2) {
  opacity: 0;
  transform: scaleX(0);
}

#menuBtn.active span:nth-child(3) {
  transform: translateY(-7px) rotate(-45deg);
}

/* ============================================
   SEARCH SUGGESTIONS - Compact & Stylish
   ============================================ */
#suggestBox {
  position: fixed;
  top: calc(var(--topbar-height) + 8px);
  right: 16px;
  width: min(320px, calc(100vw - 32px));
  max-height: 320px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.6);
  overflow-y: auto;
  z-index: 999;
  opacity: 0;
  visibility: hidden;
  transform: translateY(-10px);
  transition: all 0.3s ease;
  padding: 8px 0;
}

#suggestBox.visible {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

.suggest-header {
  padding: 8px 16px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--accent);
  border-bottom: 1px solid var(--border);
  margin-bottom: 4px;
}

.suggest-item {
  padding: 10px 16px;
  cursor: pointer;
  transition: all 0.2s ease;
  border-left: 2px solid transparent;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.suggest-item:hover,
.suggest-item.active {
  background: var(--hover);
  border-left-color: var(--accent);
  padding-left: 18px;
}

.suggest-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
}

.suggest-meta {
  font-size: 11px;
  color: var(--muted);
}

/* ============================================
   SIDEBAR - Fixed & Animated
   ============================================ */
#sidebar {
  position: fixed;
  top: var(--topbar-height);
  left: 0;
  width: var(--sidebar-width);
  height: calc(100% - var(--topbar-height));
  background: var(--surface);
  border-right: 1px solid var(--border);
  transform: translateX(-100%);
  transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 900;
  overflow-y: auto;
  padding: 16px 12px;
}

#sidebar.open {
  transform: translateX(0);
}

/* Overlay */
#sidebarOverlay {
  position: fixed;
  inset: var(--topbar-height) 0 0 0;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(8px);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 850;
}

#sidebarOverlay.visible {
  opacity: 1;
  visibility: visible;
}

/* Nav Items */
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  margin: 4px 0;
  color: var(--text);
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  border-radius: 10px;
  transition: all 0.25s ease;
  position: relative;
  overflow: hidden;
}

.nav-item::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  background: var(--accent);
  transform: scaleY(0);
  transition: transform 0.25s ease;
}

.nav-item:hover,
.nav-item.active {
  background: var(--hover);
  color: var(--accent);
  transform: translateX(4px);
}

.nav-item:hover::before,
.nav-item.active::before {
  transform: scaleY(1);
}

.nav-icon {
  width: 22px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}

/* ============================================
   MAIN FRAME - Fixed
   ============================================ */
#mainFrame {
  position: fixed;
  top: var(--topbar-height);
  left: 0;
  width: 100%;
  height: calc(100% - var(--topbar-height));
  border: none;
  background: #fff;
  transition: all 0.35s ease;
  z-index: 100;
}

/* ============================================
   RESPONSIVE - Phone & Desktop
   ============================================ */
/* Desktop: Persistent sidebar */
@media (min-width: 1024px) {
  #menuBtn {
    display: none;
  }
  
  #sidebar {
    transform: translateX(0);
  }
  
  #sidebarOverlay {
    display: none;
  }
  
  #mainFrame {
    left: var(--sidebar-width);
    width: calc(100% - var(--sidebar-width));
  }
  
  #searchInput.expanded {
    width: 300px;
  }
  
  #suggestBox {
    right: auto;
    left: calc(100% - 340px);
  }
}

/* Tablet */
@media (min-width: 768px) and (max-width: 1023px) {
  #searchInput.expanded {
    width: 240px;
  }
}

/* Mobile */
@media (max-width: 767px) {
  :root {
    --topbar-height: 56px;
  }
  
  .owner-name {
    font-size: 13px;
    max-width: 120px;
  }
  
  .logo {
    width: 32px;
    height: 32px;
  }
  
  #searchInput {
    width: 38px;
    height: 38px;
    padding-left: 38px;
  }
  
  #searchInput.expanded {
    width: calc(100vw - 140px);
    position: fixed;
    right: 12px;
    z-index: 1001;
  }
  
  #favBtn, #menuBtn {
    width: 38px;
    height: 38px;
  }
  
  #suggestBox {
    top: calc(var(--topbar-height) + 4px);
    right: 12px;
    left: 12px;
    width: auto;
    max-height: 280px;
  }
  
  .nav-item {
    padding: 14px 16px;
    font-size: 15px;
  }
}

/* Small mobile */
@media (max-width: 380px) {
  .owner-name {
    font-size: 12px;
    max-width: 100px;
  }
  
  #searchInput.expanded {
    width: calc(100vw - 120px);
  }
}

/* Landscape */
@media (max-height: 500px) and (orientation: landscape) {
  #sidebar {
    padding: 8px;
  }
  
  .nav-item {
    padding: 8px 12px;
  }
}

/* Safe area support */
@supports (padding-top: env(safe-area-inset-top)) {
  #topbar {
    padding-top: env(safe-area-inset-top);
    height: calc(var(--topbar-height) + env(safe-area-inset-top));
  }
  
  #sidebar,
  #mainFrame,
  #sidebarOverlay {
    top: calc(var(--topbar-height) + env(safe-area-inset-top));
    height: calc(100% - var(--topbar-height) - env(safe-area-inset-top));
  }
  
  #suggestBox {
    top: calc(var(--topbar-height) + env(safe-area-inset-top) + 8px);
  }
}

/* Touch optimizations */
@media (pointer: coarse) {
  .nav-item,
  #favBtn,
  #menuBtn,
  .suggest-item {
    min-height: 44px;
  }
  
  .nav-item:active,
  #favBtn:active,
  #menuBtn:active {
    transform: scale(0.95);
    opacity: 0.8;
  }
}
</style>
</head>

<!-- Topbar -->

      <img src="/image/ks-logo.webp" alt="KS Warrior Logo">

<script>
// ==========================================
// CINEMATIC LOADER - Fixed
// ==========================================
(function() {
  const loader = document.getElementById('loader-container');
  const bar = document.getElementById('loaderBar');
  let progress = 0;
  
  function updateProgress() {
    progress += Math.random() * 12 + 3;
    if (progress > 100) progress = 100;
    bar.style.width = progress + '%';
    
    if (progress < 100) {
      setTimeout(updateProgress, 100);
    } else {
      setTimeout(() => {
        loader.classList.add('hidden');
        // Initialize app after loader fades
        setTimeout(initApp, 100);
      }, 400);
    }
  }
  
  // Start loading after brief delay for visual impact
  setTimeout(updateProgress, 300);
})();

// ==========================================
// APP INITIALIZATION
// ==========================================
function initApp() {
  const frame = document.getElementById('mainFrame');
  const sidebar = document.getElementById('sidebar');
  const menuBtn = document.getElementById('menuBtn');
  const overlay = document.getElementById('sidebarOverlay');
  const searchInput = document.getElementById('searchInput');
  const suggestBox = document.getElementById('suggestBox');
  const favBtn = document.getElementById('favBtn');
  
  let searchData = [];
  let isSearchOpen = false;
  
  // ==========================================
  // LOAD INITIAL PAGE - Fixed
  // ==========================================
  const lastPage = localStorage.getItem('ks-last-page') || 'dashboard.html';
  loadPage(lastPage, null, false);
  
  // ==========================================
  // SIDEBAR TOGGLE - Fixed
  // ==========================================
  function toggleSidebar() {
    const isOpen = sidebar.classList.toggle('open');
    menuBtn.classList.toggle('active', isOpen);
    overlay.classList.toggle('visible', isOpen);
  }
  
  menuBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    toggleSidebar();
  });
  
  overlay.addEventListener('click', toggleSidebar);
  
  // Close on escape
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      if (sidebar.classList.contains('open')) toggleSidebar();
      if (isSearchOpen) closeSearch();
    }
  });
  
  // ==========================================
  // SEARCH - Fixed sizing
  // ==========================================
  function openSearch() {
    isSearchOpen = true;
    searchInput.classList.add('expanded');
    searchInput.focus();
    updateSuggestions();
  }
  
  function closeSearch() {
    isSearchOpen = false;
    searchInput.classList.remove('expanded');
    searchInput.blur();
    searchInput.value = '';
    suggestBox.classList.remove('visible');
  }
  
  searchInput.addEventListener('click', function(e) {
    e.stopPropagation();
    if (!isSearchOpen) openSearch();
  });
  
  searchInput.addEventListener('focus', openSearch);
  
  // Close search when clicking outside
  document.addEventListener('click', function(e) {
    if (!e.target.closest('.search-box') && !e.target.closest('#suggestBox')) {
      closeSearch();
    }
  });
  
  // Load search data
  fetch('/sitemap.json')
    .then(r => r.ok ? r.json() : [])
    .then(data => {
      data.forEach(cat => {
        (cat.sections || []).forEach(sec => {
          (sec.pages || []).forEach(page => {
            searchData.push({
              category: cat.category,
              title: sec.title,
              name: page.name,
              url: page.url
            });
          });
        });
      });
    })
    .catch(() => {
      // Fallback data if sitemap fails
      searchData = [
        { category: 'Main', title: 'Overview', name: 'Dashboard', url: 'dashboard.html' },
        { category: 'Main', title: 'Overview', name: 'Sites Map', url: 'map.html' },
        { category: 'Main', title: 'Overview', name: 'Social Media', url: 'social.html' },
        { category: 'Main', title: 'Overview', name: 'About', url: 'about.html' }
      ];
    });
  
  let activeIndex = -1;
  
  function updateSuggestions() {
    const query = searchInput.value.trim().toLowerCase();
    suggestBox.innerHTML = '';
    activeIndex = -1;
    
    if (!query) {
      suggestBox.classList.remove('visible');
      return;
    }
    
    const matches = searchData.filter(item => 
      item.name.toLowerCase().includes(query) ||
      item.category.toLowerCase().includes(query)
    );
    
    if (!matches.length) {
      suggestBox.innerHTML = '<div class="suggest-item"><span class="suggest-name">No results</span></div>';
      suggestBox.classList.add('visible');
      return;
    }
    
    // Group by category
    const grouped = {};
    matches.forEach(item => {
      if (!grouped[item.category]) grouped[item.category] = [];
      grouped[item.category].push(item);
    });
    
    let html = '';
    Object.entries(grouped).forEach(([cat, items]) => {
      html += `<div class="suggest-header">${cat}</div>`;
      items.forEach(item => {
        html += `
          <div class="suggest-item" data-url="${item.url}" data-name="${item.name}">
            <span class="suggest-name">${item.name}</span>
            <span class="suggest-meta">${item.title}</span>
          </div>
        `;
      });
    });
    
    suggestBox.innerHTML = html;
    suggestBox.classList.add('visible');
  }
  
  searchInput.addEventListener('input', updateSuggestions);
  
  searchInput.addEventListener('keydown', function(e) {
    const items = suggestBox.querySelectorAll('.suggest-item[data-url]');
    
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      activeIndex = (activeIndex + 1) % items.length;
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      activeIndex = (activeIndex - 1 + items.length) % items.length;
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (activeIndex >= 0 && items[activeIndex]) {
        const item = items[activeIndex];
        selectPage(item.dataset.url, item.dataset.name);
      }
      return;
    } else if (e.key === 'Escape') {
      closeSearch();
      return;
    }
    
    items.forEach((item, i) => {
      item.classList.toggle('active', i === activeIndex);
    });
  });
  
  suggestBox.addEventListener('click', function(e) {
    const item = e.target.closest('.suggest-item[data-url]');
    if (item) {
      selectPage(item.dataset.url, item.dataset.name);
    }
  });
  
  function selectPage(url, name) {
    loadPage(url);
    saveRecent(name, url);
    closeSearch();
  }
  
  // ==========================================
  // FAVORITES
  // ==========================================
  const FAV_KEY = 'ks-favorites';
  
  function getFavs() {
    return JSON.parse(localStorage.getItem(FAV_KEY) || '[]');
  }
  
  function isFav(url) {
    return getFavs().some(f => f.url === url);
  }
  
  function updateFavBtn() {
    const current = frame.getAttribute('data-current');
    const isActive = isFav(current);
    
    favBtn.classList.toggle('active', isActive);
    favBtn.innerHTML = isActive 
      ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>'
      : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>';
  }
  
  favBtn.addEventListener('click', function() {
    const current = frame.getAttribute('data-current');
    const name = searchData.find(s => s.url === current)?.name || 'Page';
    let favs = getFavs();
    
    if (isFav(current)) {
      favs = favs.filter(f => f.url !== current);
    } else {
      favs.unshift({ name, url: current, time: Date.now() });
    }
    
    localStorage.setItem(FAV_KEY, JSON.stringify(favs));
    updateFavBtn();
    
    // Pop animation
    favBtn.style.transform = 'scale(1.15)';
    setTimeout(() => favBtn.style.transform = '', 150);
  });
  
  // ==========================================
  // PAGE LOADER - Fixed
  // ==========================================
  window.loadPage = function(url, navElement, save = true) {
    if (!url) return;
    
    const current = frame.getAttribute('data-current');
    if (current === url) return;
    
    // Update nav active state
    if (navElement) {
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      navElement.classList.add('active');
    } else {
      // Find and activate matching nav item
      document.querySelectorAll('.nav-item').forEach(el => {
        el.classList.remove('active');
        if (el.getAttribute('onclick')?.includes(url)) {
          el.classList.add('active');
        }
      });
    }
    
    // Close mobile sidebar
    if (window.innerWidth < 1024 && sidebar.classList.contains('open')) {
      toggleSidebar();
    }
    
    // Update frame
    frame.setAttribute('data-current', url);
    frame.src = url;
    
    if (save) {
      localStorage.setItem('ks-last-page', url);
    }
    
    // Update fav button after load
    frame.onload = updateFavBtn;
  };
  
  function saveRecent(name, url) {
    const key = 'ks-recent';
    let recent = JSON.parse(localStorage.getItem(key) || '[]');
    recent = recent.filter(r => r.url !== url);
    recent.unshift({ name, url, time: Date.now() });
    localStorage.setItem(key, JSON.stringify(recent.slice(0, 5)));
  }
  
  // Initial fav button state
  frame.onload = updateFavBtn;
  
  // ==========================================
  // RESPONSIVE
  // ==========================================
  let lastWidth = window.innerWidth;
  window.addEventListener('resize', function() {
    const newWidth = window.innerWidth;
    if ((lastWidth < 1024 && newWidth >= 1024) || (lastWidth >= 1024 && newWidth < 1024)) {
      // Reload to apply desktop/mobile styles
      location.reload();
    }
    lastWidth = newWidth;
  });
}

// Touch detection
if (window.matchMedia('(pointer: coarse)').matches) {
  document.body.classList.add('touch');
}
</script>
</body>
</html>
