<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KS Warrior – Official KSX Dashboard & Tools</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #eef3ff;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      flex-grow: 1;
    }
  </style>
</head>
<body>

<iframe id="page-frame"></iframe>

<script>
  const allowedPages = ["dashboard", "about", "contact"];
  const defaultPage = "dashboard.html";

  // Get "page" query string
  const pageParam = new URLSearchParams(window.location.search).get("page");

  let pageToLoad = defaultPage;
  if (pageParam && allowedPages.includes(pageParam)) {
    pageToLoad = pageParam + ".html";
  }

  // Load the page in iframe
  document.getElementById("page-frame").src = pageToLoad;
</script>

</body>
</html>
