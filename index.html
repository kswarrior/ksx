<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Official KS Warrior Website</title>

<style>
:root {
  --bg: #0a0a0f;
  --top: #0b0b10;
  --panel: #15151b;
  --border: #24242c;
  --text: #e6e6eb;
  --muted: #9aa0aa;
  --accent: #3b82f6;
  --accent-hover: #2563eb;
  --hover: #1f1f2a;
  --glass: rgba(20, 20, 30, 0.85);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  overflow: hidden;
}

/* TOPBAR */
#topbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 56px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 16px;
  background: var(--top);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  z-index: 1000;
}

/* LOGO & TITLE */
.logo {
  width: 30px; height: 30px;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  flex-shrink: 0;
}
.logo img { width: 100%; height: 100%; object-fit: cover; }

.owner-name {
  font-size: 15px;
  font-weight: 900;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}

/* SEARCH CONTAINER - NEW DESIGN */
.search-container {
  position: relative;
  width: 45px; /* Initial collapsed width (just icon) */
  transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  overflow: hidden;
}

#topbar.search-active .search-container {
  width: 320px; /* Expanded width */
  max-width: 60vw;
}

#searchBox {
  width: 100%;
  height: 40px;
  padding: 0 14px 0 44px; /* Left padding for icon */
  background: rgba(18, 18, 24, 0.9);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-size: 14px;
  outline: none;
  opacity: 0;
  transition: opacity 0.3s ease 0.1s;
}

#topbar.search-active #searchBox {
  opacity: 1;
}

/* Search Icon - Now inside the bar on the left */
#searchTrigger {
  position: absolute;
  left: 0;
  top: 0;
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  cursor: pointer;
  color: var(--text);
  font-size: 20px;
  z-index: 2;
  transition: color 0.2s ease;
  -webkit-tap-highlight-color: transparent;
}

#searchTrigger:hover {
  color: var(--accent);
}

/* HAMBURGER */
#hamburger {
  width: 40px; height: 40px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  cursor: pointer;
  font-size: 22px;
  display: grid;
  place-items: center;
  transition: all 0.2s ease;
  flex-shrink: 0;
}
#hamburger:hover {
  background: var(--hover);
  border-color: var(--accent);
}

/* SUGGESTIONS */
#suggestBox {
  position: fixed;
  top: 64px;
  left: 16px; right: 16px;
  max-width: 560px;
  margin: 0 auto;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  list-style: none;
  padding: 8px 0;
  box-shadow: 0 12px 32px rgba(0,0,0,0.5);
  display: none;
  z-index: 900;
  max-height: 360px;
  overflow-y: auto;
  backdrop-filter: blur(12px);
}
#suggestBox li {
  padding: 12px 18px;
  cursor: pointer;
  transition: background 0.2s ease;
}
#suggestBox li:hover,
#suggestBox li.active {
  background: var(--hover);
}

/* SIDEBAR & FRAME (unchanged but polished) */
#sidebar {
  position: fixed;
  top: 56px;
  left: -175px;
  width: 175px;
  height: calc(100% - 56px);
  background: var(--glass);
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  padding: 20px 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
  transition: left 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  z-index: 800;
}
body.sidebar-open #sidebar { left: 0; }

#sidebar a {
  display: block;
  padding: 14px 24px;
  color: var(--text);
  text-decoration: none;
  font-size: 16px;
  transition: all 0.25s ease;
  border-left: 3px solid transparent;
}
#sidebar a:hover {
  background: var(--hover);
  border-left-color: var(--accent);
  padding-left: 28px;
}

#frame {
  position: fixed;
  top: 56px;
  left: 0;
  width: 100%;
  height: calc(100% - 56px);
  border: none;
  background: #fff;
  transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
}
</style>
</head>

<body>

<div id="topbar">
  <div class="logo"><img src="/image/ks-logo.webp" alt="Logo"></div>
  <div class="owner-name">❰🔹❰❰ 𝑲𝑺 𝑾𝒂𝒓𝒓𝒊𝒐𝒓 ❱❱🔹❱</div>

  <!-- NEW SEARCH DESIGN -->
  <div class="search-container">
    <div id="searchTrigger" aria-label="Search">🔍</div>
    <input id="searchBox" type="text" placeholder="Search pages..." aria-label="Search pages">
  </div>

  <button id="hamburger" aria-label="Menu">☰</button>
</div>

<ul id="suggestBox" role="listbox" aria-label="Search suggestions"></ul>

<nav id="sidebar" aria-label="Main navigation">
  <a onclick="loadInFrame('dashboard.html')">Dashboard</a>
  <a onclick="loadInFrame('social.html')">Social Media</a>
  <a onclick="loadInFrame('about.html')">About</a>
</nav>

<iframe id="frame" src="dashboard.html" title="Main content"></iframe>

<script>
const frame = document.getElementById("frame");
const searchBox = document.getElementById("searchBox");
const suggestBox = document.getElementById("suggestBox");
const searchTrigger = document.getElementById("searchTrigger");
const hamburger = document.getElementById("hamburger");
const topbar = document.getElementById("topbar");

const RECENT_KEY = "ks-web-recent";
const MAX_RECENT = 5;
let searchData = [];

// Load search index
fetch("/search-data.json")
  .then(r => r.ok ? r.json() : [])
  .then(data => { searchData = data; })
  .catch(err => {
    console.warn("Failed to load search-data.json:", err);
    searchData = [];
  });

// Save to recent
function saveToRecent(name, url) {
  if (!name || !url) return;

  let recent = JSON.parse(localStorage.getItem(RECENT_KEY) || "[]");
  recent = recent.filter(item => item.url !== url);
  recent.unshift({ name, url, time: Date.now() });
  recent = recent.slice(0, MAX_RECENT);
  localStorage.setItem(RECENT_KEY, JSON.stringify(recent));
}

// Load page
function loadInFrame(url, nameFromSearch = null) {
  const fullUrl = url.startsWith("http") ? url : url;
  if (frame.src === new URL(fullUrl, location.href).href) return;

  frame.src = fullUrl;

  document.body.classList.remove("sidebar-open");
  topbar.classList.remove("search-active");
  suggestBox.style.display = "none";
  searchBox.value = "";

  if (nameFromSearch) {
    saveToRecent(nameFromSearch, fullUrl);
  }
}

// Search suggestions
let activeIndex = -1;

function updateSuggestions() {
  const query = searchBox.value.trim().toLowerCase();
  suggestBox.style.display = "none";
  activeIndex = -1;

  if (!query || searchData.length === 0) {
    suggestBox.innerHTML = "";
    return;
  }

  const results = searchData
    .filter(item => item.name && item.name.toLowerCase().includes(query))
    .slice(0, 10);

  if (results.length === 0) {
    suggestBox.innerHTML = '<li style="color:var(--muted);padding:12px 18px;">No results found</li>';
    suggestBox.style.display = "block";
    return;
  }

  suggestBox.innerHTML = results
    .map(item => `<li tabindex="0" role="option" data-url="${item.url}" data-name="${item.name}">${item.name}</li>`)
    .join("");

  suggestBox.style.display = "block";
}

searchBox.addEventListener("input", updateSuggestions);

searchBox.addEventListener("keydown", (e) => {
  const items = [...suggestBox.querySelectorAll("li[role='option']")];
  if (items.length === 0) return;

  if (e.key === "ArrowDown") {
    e.preventDefault();
    activeIndex = (activeIndex + 1) % items.length;
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    activeIndex = (activeIndex - 1 + items.length) % items.length;
  } else if (e.key === "Enter") {
    e.preventDefault();
    if (activeIndex >= 0) {
      const item = items[activeIndex];
      loadInFrame(item.dataset.url, item.dataset.name);
    }
    return;
  } else if (e.key === "Escape") {
    topbar.classList.remove("search-active");
    suggestBox.style.display = "none";
    searchBox.value = "";
    searchBox.blur();
    return;
  }

  items.forEach(i => i.classList.remove("active"));
  if (activeIndex >= 0) items[activeIndex].classList.add("active");
});

suggestBox.addEventListener("click", (e) => {
  const li = e.target.closest("li[role='option']");
  if (li) {
    loadInFrame(li.dataset.url, li.dataset.name);
  }
});

// Activate search on icon click
searchTrigger.addEventListener("click", (e) => {
  e.stopPropagation();
  topbar.classList.add("search-active");
  searchBox.focus();
  updateSuggestions();
});

// Close when clicking outside
document.addEventListener("click", (e) => {
  if (!topbar.contains(e.target) && !suggestBox.contains(e.target)) {
    topbar.classList.remove("search-active");
    suggestBox.style.display = "none";
    searchBox.value = "";
  }
});

suggestBox.addEventListener("click", (e) => e.stopPropagation());

hamburger.addEventListener("click", () => {
  document.body.classList.toggle("sidebar-open");
});

frame.addEventListener("load", () => {
  if (window.innerWidth >= 768) {
    document.body.classList.remove("sidebar-open");
  }
});
</script>

</body>
</html>
