<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>KS Warrior</title>

<style>
:root{
  --bg:#f4f7fb;
  --top:#091233;
  --muted:#718096;
  --accent-1:#2563eb;
  --accent-2:#60a5fa;
}

html,body{
  height:100%;
  margin:0;
  background:linear-gradient(180deg,var(--bg),#eef4ff);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial;
}

/* TOP BAR */
#topbar{
  position:fixed;
  top:0;left:0;
  width:100%;
  height:56px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 14px;
  background:linear-gradient(90deg,#0d254d,#061934);
  color:#fff;
  z-index:80;
}

/* LOGO */
.logo{width:42px;height:42px;border-radius:8px;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain}

/* SEARCH */
#searchBox{
  width:0;
  opacity:0;
  transition:.25s;
  padding:10px 14px;
  border-radius:10px;
  border:0;
  outline:none;
  background:rgba(255,255,255,.08);
  color:#fff;
}
#topbar.search-active #searchBox{
  width:clamp(220px,45vw,700px);
  opacity:1;
}

/* ICON BUTTON */
.btn-icon{
  width:40px;height:40px;
  display:grid;place-items:center;
  border-radius:10px;
  background:transparent;
  border:1px solid rgba(255,255,255,.1);
  cursor:pointer;
  color:#fff;
}

/* SUGGESTIONS */
#suggestBox{
  display:none;
  position:absolute;
  top:56px;
  left:14px;
  width:calc(100% - 28px);
  max-width:760px;
  background:#fff;
  border-radius:10px;
  box-shadow:0 8px 30px rgba(0,0,0,.15);
  list-style:none;
  padding:6px;
  z-index:90;
}
#suggestBox li{
  padding:10px;
  cursor:pointer;
  border-radius:8px;
  font-weight:600;
}
#suggestBox li.active,
#suggestBox li:hover{
  background:rgba(37,99,235,.08);
}

/* SIDEBAR */
#sidebar{
  position:fixed;
  top:56px;
  left:-280px;
  width:280px;
  height:calc(100% - 56px);
  background:#fff;
  padding:16px;
  transition:.25s;
  z-index:70;
}
body.sidebar-open #sidebar{left:0}

/* IFRAME */
#frame{
  position:fixed;
  top:56px;left:0;
  width:100%;
  height:calc(100% - 56px);
  border:0;
}
</style>
</head>

<body>

<!-- TOPBAR -->
<div id="topbar">
  <div class="logo"><img src="/image/ks-logo.webp"></div>

  <button class="btn-icon" id="searchIcon">🔍</button>
  <input id="searchBox" placeholder="Search...">

  <button class="btn-icon" id="hamburger">☰</button>
</div>

<!-- SUGGESTIONS -->
<ul id="suggestBox"></ul>

<!-- SIDEBAR -->
<nav id="sidebar">
  <h3>KS Warrior</h3>
  <a href="#" onclick="loadInFrame('dashboard.html')">Dashboard</a>
  <a href="#" onclick="loadInFrame('about.html')">About</a>
</nav>

<!-- FRAME -->
<iframe id="frame"></iframe>

<script>
const topbar = document.getElementById("topbar");
const searchIcon = document.getElementById("searchIcon");
const searchBox = document.getElementById("searchBox");
const suggestBox = document.getElementById("suggestBox");
const hamburger = document.getElementById("hamburger");
const frame = document.getElementById("frame");

let searchData = [];
let activeIndex = -1;

/* DEFAULT LOAD */
frame.src = "dashboard.html";

/* LOAD SEARCH DATA */
fetch("search-data.json")
.then(r=>r.json())
.then(d=>searchData=d);

/* SEARCH TOGGLE */
searchIcon.onclick=()=>{
  topbar.classList.toggle("search-active");
  searchBox.focus();
};

/* SIDEBAR */
hamburger.onclick=()=>{
  document.body.classList.toggle("sidebar-open");
};

/* LOAD IN FRAME */
function loadInFrame(url){
  frame.src=url;
  document.body.classList.remove("sidebar-open");
}

/* INPUT SEARCH */
searchBox.oninput=()=>{
  const q=searchBox.value.toLowerCase().trim();
  if(!q){suggestBox.style.display="none";return;}

  const res=searchData.filter(i=>
    (i.name||"").toLowerCase().includes(q)
  );

  if(!res.length){suggestBox.style.display="none";return;}

  suggestBox.innerHTML=res.slice(0,10).map((r,i)=>
    `<li data-i="${i}" data-url="${r.url}">${r.name}</li>`
  ).join("");

  activeIndex=-1;
  suggestBox.style.display="block";
};

/* KEYBOARD */
searchBox.onkeydown=e=>{
  const items=[...suggestBox.children];
  if(!items.length)return;

  if(e.key==="ArrowDown"){
    activeIndex=(activeIndex+1)%items.length;
  }
  if(e.key==="ArrowUp"){
    activeIndex=(activeIndex-1+items.length)%items.length;
  }
  if(e.key==="Enter"){
    const li=items[activeIndex];
    if(li) window.location.href=li.dataset.url;
    return;
  }
  items.forEach(x=>x.classList.remove("active"));
  if(items[activeIndex])items[activeIndex].classList.add("active");
};

/* CLICK SUGGESTION */
suggestBox.onclick=e=>{
  const li=e.target.closest("li");
  if(li) window.location.href=li.dataset.url;
};
</script>

</body>
</html>
