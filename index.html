<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Official KS Warrior Website</title>

<style>
:root{
  --bg:#0a0a0f;
  --top:#0b0b0f;
  --panel:#15151b;
  --border:#24242c;
  --text:#e6e6eb;
  --muted:#9aa0aa;
  --accent:#3b82f6;
}

*{box-sizing:border-box}

html,body{
  height:100%;
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial;
}

/* TOPBAR */
#topbar{
  position:fixed;
  top:0;left:0;
  width:100%;
  height:56px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 12px;
  background:var(--top);
  border-bottom:1px solid var(--border);
  z-index:1000;
}

/* LOGO */
.logo{
  width:38px;
  height:38px;
  background:#000;
  border:1px solid var(--border);
  border-radius:8px;
  display:grid;
  place-items:center;
}
.logo img{border:0.5px solid var(--border);width:20px;height:20px}

/* TITLE */
.owner-name{
  font-size:15px;
  font-weight:900;
  white-space:nowrap;
}

/* ICON BUTTONS */
.btn-icon,
#hamburger{
  width:38px;
  height:38px;
  background:transparent;
  border:1px solid var(--border);
  border-radius:8px;
  color:#fff;
  cursor:pointer;
}
#hamburger {
  font-size: 25px;
}
.btn-icon:hover,
#hamburger:hover{
  background:#1a1a22;
}

/* SEARCH */
#searchBox{
  flex:1;
  max-width:200px;
  padding:8px 10px;
  background:#121218;
  border:1px solid var(--border);
  border-radius:8px;
  color:#fff;
  outline:none;
  width:0;
  opacity:0;
  transition:.2s;
}

#topbar.search-active #searchBox{
  width:100%;
  opacity:1;
}

#topbar.search-active #searchIcon{
  display:none;
}

/* SUGGESTIONS */
#suggestBox{
  position:fixed;
  top:56px;
  left:10px;
  right:10px;
  max-width:520px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:8px;
  list-style:none;
  padding:6px;
  display:none;
  z-index:900;
}

#suggestBox li{
  padding:8px 10px;
  border-radius:6px;
  cursor:pointer;
}

#suggestBox li:hover,
#suggestBox li.active{
  background:#1f1f2a;
}

/* SIDEBAR */
#sidebar{
  background:
  linear-gradient(
    180deg,
    rgba(20, 20, 25, 0.55),
    rgba(5, 5, 8, 0.65)
  );
backdrop-filter: blur(20px) saturate(160%);
-webkit-backdrop-filter: blur(20px) saturate(160%);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  box-shadow:
    inset -1px 0 0 rgba(255,255,255,.05),
    8px 0 30px rgba(0,0,0,.6);
  transition: transform .45s cubic-bezier(.22,1,.36,1);
  position:fixed;
  top:56px;
  left:-180px;
  width:180px;
  height:calc(100% - 56px);
  transition:.25s;
  z-index:800;
}

body.sidebar-open #sidebar{left:0}

#sidebar a{
  display:block;
  padding:10px;
  border-radius:6px;
  text-decoration:none;
  color:var(--text);
}

#sidebar a:hover{
  background:#1f1f2a;
}

/* FRAME */
#frame{
  position:fixed;
  top:56px;
  left:0;
  width:100%;
  height:calc(100% - 56px);
  border:none;
  background:transparent;
}

@media(min-width:720px){
  body.sidebar-open #frame{
    transform:translateX(180px);
  }
}
</style>
</head>

<body>

<div id="topbar">
  <div class="logo"><img src="/image/ks-logo.webp"></div>
  <div class="owner-name">❰🔹❰❰ 𝑲𝑺 𝑾𝒂𝒓𝒓𝒊𝒐𝒓 ❱❱🔹❱</div>

  <button class="btn-icon" id="searchIcon">🔍</button>
  <input id="searchBox" placeholder="Search...">
  <button id="hamburger">≡</button>
</div>

<ul id="suggestBox"></ul>

<nav id="sidebar">
  <a onclick="loadInFrame('dashboard.html')">Dashboard</a>
  <a onclick="loadInFrame('about.html')">About</a>
</nav>

<iframe id="frame"></iframe>

<script>
const topbar = document.getElementById("topbar");
const searchIcon = document.getElementById("searchIcon");
const searchBox = document.getElementById("searchBox");
const suggestBox = document.getElementById("suggestBox");
const hamburger = document.getElementById("hamburger");
const frame = document.getElementById("frame");

let searchData = [], activeIndex = -1;
frame.src = "dashboard.html";

fetch("/search-data.json").then(r=>r.json()).then(d=>searchData=d);

searchIcon.onclick = () => {
  topbar.classList.add("search-active");
  searchBox.focus();
};

hamburger.onclick = () => {
  document.body.classList.toggle("sidebar-open");
};

document.addEventListener("click", e=>{
  if(!topbar.contains(e.target)){
    topbar.classList.remove("search-active");
    suggestBox.style.display="none";
  }
});

function loadInFrame(url){
  frame.src = url;
  document.body.classList.remove("sidebar-open");
  suggestBox.style.display="none";
}

searchBox.oninput = () => {
  const q = searchBox.value.toLowerCase().trim();
  if(!q){suggestBox.style.display="none";return;}

  const results = searchData.filter(i =>
    i.name?.toLowerCase().includes(q)
  );

  if(!results.length){suggestBox.style.display="none";return;}

  suggestBox.innerHTML = results.slice(0,8)
    .map((x,i)=>`<li data-url="${x.url}">${x.name}</li>`)
    .join("");

  activeIndex = -1;
  suggestBox.style.display = "block";
};

searchBox.onkeydown = e => {
  const items = [...suggestBox.children];
  if(!items.length) return;

  if(e.key==="ArrowDown") activeIndex=(activeIndex+1)%items.length;
  if(e.key==="ArrowUp") activeIndex=(activeIndex-1+items.length)%items.length;

  if(e.key==="Enter" && items[activeIndex]){
    loadInFrame(items[activeIndex].dataset.url);
  }

  items.forEach(i=>i.classList.remove("active"));
  items[activeIndex]?.classList.add("active");
};

suggestBox.onclick = e => {
  const li = e.target.closest("li");
  if(li) loadInFrame(li.dataset.url);
};
</script>

</body>
</html>
