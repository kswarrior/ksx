name = "ksx-backend"
main = "backend/src/worker.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Single Worker serving API + frontend assets (frontend/dist)
# Build must run before deploy: `npm run build`
[assets]
directory = "frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
# FRONTEND_URL = "https://ksx.pages.dev"
# Fix SPA fallback and remove _redirects
