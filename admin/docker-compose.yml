services:
  admin:
    build:
      context: .
      dockerfile: Dockerfile
    image: ksx-admin:latest
    restart: unless-stopped
    ports:
      - "8081:8080"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8080"
      GOMAXPROCS: "1"
      GOMEMLIMIT: "96MiB"
    mem_limit: 192m
    cpus: 0.50
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
