<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<style>
  body {
    margin: 0;
    padding: 20px;
    font-family: 'Poppins', sans-serif;
    background: white;
    color: #0A73FF;
  }

  .top-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
  }

  h2 {
    font-size: 20px;
    font-weight: 600;
  }

  .search-input {
    flex: 1;
    padding: 10px;
    border: 1.5px solid #0A73FF;
    border-radius: 10px;
  }

  .add-btn {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: #0A73FF;
    color: white;
    border: none;
    font-size: 22px;
    cursor: pointer;
  }

  .section-box {
    border: 1px solid #0A73FF;
    padding: 15px;
    border-radius: 12px;
  }

  .grid {
    display: grid;
    gap: 10px;
  }

  .grid-4 {
    grid-template-columns: repeat(auto-fit, minmax(100%, 1fr));
  }

  .card {
    height: 70px;
    border: 1.5px solid #0A73FF;
    border-radius: 10px;
    background: #EAF2FF;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px;
    cursor: pointer;
  }

  .card img {
    width: 35px;
    height: 35px;
    border-radius: 8px;
    object-fit: cover;
  }

  /* FULLPAGE IFRAME */
  #iframeContainer {
    margin-top: 20px;
    width: 100%;
    height: 90vh;
    display: none;
  }

  #viewFrame {
    width: 100%;
    height: 100%;
    border: none;
  }

</style>
</head>

<body>

<!-- Top Bar -->
<div class="top-bar">
  <h2>Favourites</h2>
  <input type="text" class="search-input" id="searchBar" placeholder="Search…" oninput="filterSearch()">
  <button class="add-btn" onclick="openAdd()">+</button>
</div>

<!-- Favourites Section -->
<div class="section-box">
  <div class="grid grid-4" id="favContainer"></div>
</div>

<!-- FULLPAGE IFRAME -->
<div id="iframeContainer">
  <iframe id="viewFrame"></iframe>
</div>

<script>
let searchData = [];

/* Load JSON */
async function loadSearchData() {
  const res = await fetch("search-data.json");
  searchData = await res.json();
}

/* Load Favourites */
function loadFav() {
  const favs = JSON.parse(localStorage.getItem("favourites")) || [];
  const box = document.getElementById("favContainer");
  box.innerHTML = "";

  favs.forEach(item => {
    box.innerHTML += `
      <div class="card" onclick="openInFrame('${item.url}')">
        <img src="${item.logo}">
        <div class="title">${item.name}</div>
      </div>
    `;
  });
}

/* Open in full page iframe + save favourite automatically */
function openInFrame(url) {
  document.getElementById("iframeContainer").style.display = "block";
  document.getElementById("viewFrame").src = url;
}

/* When searching item is clicked → add favourite + open iframe */
function clickSearchItem(item) {
  let favs = JSON.parse(localStorage.getItem("favourites")) || [];
  let exists = favs.find(x => x.name === item.name);

  if (!exists) {
    favs.push(item);
    localStorage.setItem("favourites", JSON.stringify(favs));
    loadFav();
  }

  openInFrame(item.url);
}

/* Search system */
function filterSearch() {
  let text = document.getElementById("searchBar").value.toLowerCase();
  const box = document.getElementById("favContainer");

  if (text === "") {
    loadFav();
    return;
  }

  let results = searchData.filter(item =>
    item.name.toLowerCase().includes(text)
  );

  box.innerHTML = "";

  results.forEach(r => {
    box.innerHTML += `
      <div class="card" onclick='clickSearchItem(${JSON.stringify(r)})'>
        <img src="${r.logo}">
        <div class="title">${r.name}</div>
      </div>
    `;
  });
}

/* Start */
loadSearchData();
loadFav();
</script>

</body>
</html>
