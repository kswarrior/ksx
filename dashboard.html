<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KS Dashboard - Modern Enhanced</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#0a0a0f;
  --card:rgba(20,20,35,0.6);
  --soft:rgba(30,30,50,0.7);
  --muted:#a0a8b8;
  --accent:#6366f1;
  --accent-glow:#818cf8;
  --radius:20px;
  --hover-card:rgba(40,40,60,0.8);
  --border:rgba(100,100,255,0.2);
}

*{ box-sizing:border-box; }

body{
  margin:0;
  padding:18px;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  background:radial-gradient(circle at top left, #1e1b4b, #0f172a), radial-gradient(circle at bottom right, #381e4b, #0a0a0f);
  color:#fff;
  min-height:100vh;
  backdrop-filter: blur(10px);
}

.dashboard{ display:grid; gap:24px; max-width:1100px; margin:auto; }

/* NEWS */
.news{ 
  background:var(--card); 
  border-radius:var(--radius); 
  padding:20px; 
  overflow:hidden; 
  backdrop-filter: blur(12px);
  border:1px solid var(--border);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
.news-header{ display:flex; align-items:center; gap:10px; margin-bottom:16px; font-weight:600; font-size:18px; }
.news-header span{ background:var(--accent); padding:5px 12px; border-radius:999px; font-size:12px; font-weight:500; }
.news-slider{ height:100px; overflow:hidden; position:relative; border-radius:14px; }
.news-track{ display:flex; transition:transform 1s cubic-bezier(0.4, 0, 0.2, 1); }
.news-slide{ 
  min-width:100%; flex-shrink:0; 
  background:linear-gradient(135deg, rgba(60,60,120,0.4), rgba(40,40,80,0.4)); 
  border-radius:14px; padding:18px; 
  backdrop-filter: blur(8px);
}
.news-title{ font-size:19px; font-weight:700; margin-bottom:8px; }
.news-desc{ font-size:14px; color:var(--muted); line-height:1.5; }
.news-dots{ display:flex; gap:8px; justify-content:flex-end; margin-top:12px; }
.news-dots i{ width:8px; height:8px; border-radius:50%; background:#444; transition:all 0.4s ease; }
.news-dots i.active{ background:var(--accent); transform:scale(1.3); box-shadow:0 0 10px var(--accent-glow); }

/* GRID & PANEL */
.grid{ display:grid; grid-template-columns:1fr 1fr; gap:24px; }
@media(max-width:800px){ .grid{ grid-template-columns:1fr; } }
.panel{ 
  background:var(--card); 
  border-radius:var(--radius); 
  padding:20px; 
  backdrop-filter: blur(12px);
  border:1px solid var(--border);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.panel:hover{ transform:translateY(-6px); box-shadow:0 16px 40px rgba(0,0,0,0.5); }
.panel h2{ margin:0 0 16px 0; font-size:19px; }

/* LIST ITEM */
.list-item{
  background:var(--soft); padding:14px 16px; border-radius:14px; margin-bottom:10px;
  display:flex; justify-content:space-between; align-items:center; cursor:pointer;
  transition:all 0.3s ease;
  border:1px solid var(--border);
}
.list-item:hover{ 
  background:var(--hover-card); 
  transform:translateX(8px);
  box-shadow:0 0 15px rgba(99,102,241,0.3);
}
.list-item:last-child{ margin-bottom:0; }
.time{ font-size:13px; color:var(--muted); }

/* HIGHLIGHT */
.highlight-slider{ overflow:hidden; position:relative; height:120px; border-radius:14px; }
.highlight-track{ transition:transform 1s cubic-bezier(0.4, 0, 0.2, 1); }
.h-card{
  height:120px;
  background:linear-gradient(135deg, rgba(80,80,160,0.5), rgba(60,60,120,0.5)); 
  border-radius:14px; padding:20px; margin-bottom:12px;
  cursor:pointer; transition:all 0.4s ease;
  backdrop-filter: blur(8px);
  border:1px solid var(--border);
  display:flex; flex-direction:column; justify-content:center;
}
.h-card:hover{ 
  background:linear-gradient(135deg, rgba(100,100,200,0.6), rgba(80,80,160,0.6)); 
  transform:scale(1.05);
  box-shadow:0 0 20px rgba(99,102,241,0.5);
}
.h-card span{ display:block; font-size:14px; color:var(--muted); margin-top:8px; }

.empty{ color:#8b949e; font-size:14px; text-align:center; padding:40px 0; }
</style>
</head>

<body>
<div class="dashboard">

  <!-- NEWS -->
  <section class="news">
    <div class="news-header">📰 Updates & News <span>NEW</span></div>
    <div class="news-slider">
      <div class="news-track" id="newsTrack">
        <div class="news-slide">
          <div class="news-title">KS Panel v2.4</div>
          <div class="news-desc">UI polish & performance boost</div>
        </div>
        <div class="news-slide">
          <div class="news-title">Security Improvements</div>
          <div class="news-desc">Safer auth & bug fixes</div>
        </div>
      </div>
    </div>
    <div class="news-dots" id="newsDots"></div>
  </section>

  <!-- RECENT + FAV -->
  <div class="grid">
    <section class="panel">
      <h2>🕒 Recent</h2>
      <div id="recentList"></div>
    </section>
    <section class="panel">
      <h2>❤️ Favourite</h2>
      <div id="favList"></div>
    </section>
  </div>

  <!-- HIGHLIGHT -->
  <section class="panel">
    <h2>⭐ Highlighted</h2>
    <div class="highlight-slider">
      <div class="highlight-track" id="highlightTrack">
        <div class="h-card" onclick="parent.loadInFrame('dashboard.html')">
          Dashboard <span>Overview</span>
        </div>
        <div class="h-card" onclick="parent.loadInFrame('server.html')">
          Server <span>Control & status</span>
        </div>
        <div class="h-card" onclick="parent.loadInFrame('files.html')">
          Files <span>Manage server files</span>
        </div>
      </div>
    </div>
  </section>

</div>

<script>
const RECENT_KEY = "ks-web-recent";
const FAV_KEY = "ks-web-fav";

// News Slider
const newsTrack = document.getElementById("newsTrack");
const newsDots = document.getElementById("newsDots");
const slides = newsTrack.children;

if (slides.length > 1) {
  for (let i = 0; i < slides.length; i++) {
    const dot = document.createElement("i");
    if (i === 0) dot.classList.add("active");
    newsDots.appendChild(dot);
  }

  let index = 0;
  setInterval(() => {
    index = (index + 1) % slides.length;
    newsTrack.style.transform = `translateX(-${index * 100}%)`;
    [...newsDots.children].forEach((d, i) => d.classList.toggle("active", i === index));
  }, 3500);
}

// Highlight Vertical Slider
const hTrack = document.getElementById("highlightTrack");
const cards = hTrack.children;
if (cards.length > 1) {
  let hIndex = 0;
  const cardHeight = cards[0].offsetHeight + 12; // height + margin
  setInterval(() => {
    hIndex = (hIndex + 1) % cards.length;
    hTrack.style.transform = `translateY(-${hIndex * cardHeight}px)`;
  }, 3000);
}

// Time Ago
function timeAgo(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return "Now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  if (s < 2592000) return Math.floor(s / 86400) + "d ago";
  return Math.floor(s / 2592000) + "mo ago";
}

// Render List
function renderList(key, containerId, showTime = false) {
  const data = JSON.parse(localStorage.getItem(key) || "[]");
  const el = document.getElementById(containerId);
  el.innerHTML = "";

  if (data.length === 0) {
    el.innerHTML = `<div class="empty">No data</div>`;
    return;
  }

  data.forEach(item => {
    const div = document.createElement("div");
    div.className = "list-item";
    div.innerHTML = `<span>${item.name}</span>${showTime ? `<span class="time">${timeAgo(item.time)}</span>` : ""}`;
    div.onclick = () => parent.loadInFrame(item.url);
    el.appendChild(div);
  });
}

// Load lists on start
renderList(RECENT_KEY, "recentList", true);
renderList(FAV_KEY, "favList", false);
</script>
</body>
</html>
