<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#0e0e11;
  --card:#15151d;
  --soft:#1f1f2a;
  --muted:#9ca3af;
  --accent:#4f46e5;
}

body{
  margin:0;
  padding:18px;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background:var(--bg);
  color:#fff;
}

/* ===== Layout ===== */
.dashboard{
  display:grid;
  gap:18px;
}

/* ===== News ===== */
.news{
  background:linear-gradient(135deg,#1b1b2f,#161622);
  border-radius:14px;
  padding:18px;
}

.news h2{
  margin:0 0 12px;
  font-size:17px;
}

.news-item{
  padding:10px 0;
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid #242433;
}

.news-item:last-child{border:none}

/* ===== Two Columns ===== */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.panel{
  background:var(--card);
  border-radius:14px;
  padding:14px;
}

.panel h2{
  margin:0 0 12px;
  font-size:16px;
}

/* ===== Lists ===== */
.list-item{
  padding:12px;
  border-radius:10px;
  background:var(--soft);
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
  cursor:pointer;
}

.list-item:hover{
  outline:1px solid #2f2f44;
}

.time{
  font-size:12px;
  color:var(--muted);
}

/* ===== Highlighted ===== */
.highlight{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:14px;
}

.h-card{
  background:#181824;
  border-radius:14px;
  padding:16px;
  cursor:pointer;
}

.h-card span{
  display:block;
  font-size:13px;
  color:var(--muted);
}

/* ===== Empty ===== */
.empty{
  color:#6b7280;
  font-size:13px;
}
</style>
</head>

<body>

<div class="dashboard">

  <!-- Updates -->
  <section class="news">
    <h2>📰 Updates & News</h2>
    <div class="news-item">
      <span>KS Panel v2.1 Released</span>
      <span class="time">Today</span>
    </div>
    <div class="news-item">
      <span>Security & stability improvements</span>
      <span class="time">2 days ago</span>
    </div>
  </section>

  <!-- Recent + Favourite -->
  <div class="grid">

    <section class="panel">
      <h2>🕒 Recent</h2>
      <div id="recentList"></div>
    </section>

    <section class="panel">
      <h2>❤️ Favourite</h2>
      <div id="favList"></div>
    </section>

  </div>

  <!-- Highlighted -->
  <section class="panel">
    <h2>⭐ Highlighted</h2>
    <div class="highlight">
      <div class="h-card" onclick="openPage('dashboard.html')">
        Dashboard
        <span>Overview</span>
      </div>
      <div class="h-card" onclick="openPage('server-manage.html')">
        Server
        <span>Control & status</span>
      </div>
      <div class="h-card" onclick="openPage('file-manager.html')">
        Files
        <span>Manage server files</span>
      </div>
    </div>
  </section>

</div>

<script>
const RECENT_KEY="ls-web-recent";
const FAV_KEY="ls-web-fav";

function openPage(url){
  parent.document.getElementById("frame").src=url;
}

function timeAgo(t){
  const d=(Date.now()-t)/1000;
  if(d<60)return"Now";
  if(d<3600)return Math.floor(d/60)+"m";
  if(d<86400)return Math.floor(d/3600)+"h";
  return Math.floor(d/86400)+"d";
}

function loadRecent(){
  const r=JSON.parse(localStorage.getItem(RECENT_KEY))||[];
  document.getElementById("recentList").innerHTML =
    r.length ? r.slice(0,5).map(i=>`
      <div class="list-item" onclick="openPage('${i.url}')">
        <span>${i.name}</span>
        <span class="time">${timeAgo(i.time)}</span>
      </div>
    `).join("") : `<div class="empty">No recent activity</div>`;
}

function loadFav(){
  const f=JSON.parse(localStorage.getItem(FAV_KEY))||[];
  document.getElementById("favList").innerHTML =
    f.length ? f.map(i=>`
      <div class="list-item" onclick="openPage('${i.url}')">
        <span>${i.name}</span>
      </div>
    `).join("") : `<div class="empty">No favourites added</div>`;
}

loadRecent();
loadFav();
</script>

</body>
</html>
