<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KS Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#0e0e11;
  --card:#15151d;
  --soft:#1f1f2a;
  --muted:#9ca3af;
  --accent:#4f46e5;
  --radius:16px;
}

*{box-sizing:border-box}

body{
  margin:0;
  padding:18px;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  background:radial-gradient(circle at top,#141421,#0e0e11);
  color:#fff;
}

.dashboard{
  display:grid;
  gap:20px;
  max-width:1100px;
  margin:auto;
}

/* ================= NEWS ================= */
.news{
  position:relative;
  background:linear-gradient(135deg,#1b1b2f,#161622);
  border-radius:var(--radius);
  padding:18px;
  overflow:hidden;
}

.news-header{
  display:flex;
  gap:8px;
  margin-bottom:14px;
}

.news-header span{
  background:var(--accent);
  padding:4px 10px;
  border-radius:999px;
  font-size:11px;
}

.news-slider{height:92px;overflow:hidden}

.news-track{
  display:flex;
  transition:transform 1.2s cubic-bezier(.4,0,.2,1);
}

.news-slide{
  min-width:100%;
  background:#12121a;
  border-radius:14px;
  padding:16px;
}

.news-title{font-size:18px;font-weight:600}
.news-desc{font-size:13px;color:var(--muted)}

.news-dots{
  display:flex;
  gap:6px;
  position:absolute;
  right:16px;
  bottom:12px;
}

.news-dots i{
  width:7px;height:7px;border-radius:50%;
  background:#3a3a4d;
}
.news-dots i.active{background:var(--accent)}

/* ================= GRID ================= */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}
@media(max-width:800px){
  .grid{grid-template-columns:1fr}
}

.panel{
  background:#15151d;
  border-radius:var(--radius);
  padding:16px;
}

.panel h2{margin:0 0 14px}

/* ================= LIST ================= */
.list-item{
  padding:12px 14px;
  border-radius:12px;
  background:var(--soft);
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
}

/* ================= HIGHLIGHT ================= */

/* 🔥 ONLY ADDITION STARTS HERE */
.highlight-wrapper{
  height:140px;
  overflow:hidden;
  position:relative;
}

.highlight{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:16px;
  transition:transform 0.9s cubic-bezier(.4,0,.2,1);
}
/* 🔥 ONLY ADDITION ENDS HERE */

.h-card{
  background:linear-gradient(135deg,#181824,#12121a);
  border-radius:var(--radius);
  padding:18px;
  cursor:pointer;
}

.h-card span{
  display:block;
  margin-top:6px;
  font-size:13px;
  color:var(--muted);
}

.empty{color:#6b7280}
</style>
</head>

<body>
<div class="dashboard">

<section class="news">
  <div class="news-header">📰 Updates & News <span>NEW</span></div>
  <div class="news-slider">
    <div class="news-track" id="newsTrack">
      <div class="news-slide">
        <div class="news-title">KS Panel v2.4</div>
        <div class="news-desc">UI polish, faster server actions</div>
      </div>
      <div class="news-slide">
        <div class="news-title">Security Improvements</div>
        <div class="news-desc">Safer auth & bug fixes</div>
      </div>
    </div>
    <div class="news-dots" id="newsDots"></div>
  </div>
</section>

<div class="grid">
  <section class="panel"><h2>🕒 Recent</h2><div id="recentList"></div></section>
  <section class="panel"><h2>❤️ Favourite</h2><div id="favList"></div></section>
</div>

<section class="panel">
  <h2>⭐ Highlighted</h2>

  <!-- 🔥 WRAPPER ADDED -->
  <div class="highlight-wrapper">
    <div class="highlight" id="highlightTrack">
      <div class="h-card">Dashboard<span>Overview</span></div>
      <div class="h-card">Server<span>Control & status</span></div>
      <div class="h-card">Files<span>Manage server files</span></div>
    </div>
  </div>
</section>

</div>

<script>
/* NEWS (unchanged) */
const track=document.getElementById("newsTrack");
const dotsWrap=document.getElementById("newsDots");
const slides=[...track.children];
let index=0;

slides.forEach((_,i)=>{
  const d=document.createElement("i");
  if(i===0)d.classList.add("active");
  dotsWrap.appendChild(d);
});
const dots=[...dotsWrap.children];
setInterval(()=>{
  index=(index+1)%slides.length;
  track.style.transform=`translateX(-${index*100}%)`;
  dots.forEach(d=>d.classList.remove("active"));
  dots[index].classList.add("active");
},1800);

/* 🔥 HIGHLIGHT UP/DOWN TRACK (ONLY NEW JS) */
const hTrack=document.getElementById("highlightTrack");
let hDir=1;
setInterval(()=>{
  hTrack.style.transform=`translateY(${hDir*-40}px)`;
  hDir*=-1;
},2500);
</script>

</body>
</html>
