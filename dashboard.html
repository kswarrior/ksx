<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  body{
    margin:0;
    padding:20px;
    font-family: Arial, sans-serif;
    background:#0e0e11;
    color:#fff;
  }

  h2{
    margin:25px 0 15px;
    font-size:18px;
    display:flex;
    align-items:center;
    gap:8px;
  }

  ul{
    list-style:none;
    padding:0;
    margin:0;
  }

  li{
    padding:12px 14px;
    margin-bottom:10px;
    background:#1a1a22;
    border-radius:8px;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
    transition:0.2s;
  }

  li:hover{
    background:#232333;
  }

  .name{
    font-size:14px;
  }

  .time{
    font-size:12px;
    color:#aaa;
  }

  .empty{
    color:#888;
    font-size:14px;
    cursor:default;
  }

  .badge{
    font-size:11px;
    padding:3px 6px;
    background:#2563eb;
    border-radius:6px;
  }
</style>
</head>

<body>

<!-- ================= Updates & News (KS) ================= -->
<h2>📰 Updates & News (KS)</h2>
<ul>
  <li onclick="openPage('updates.html')">
    <span class="name">KS Panel v2.1 Released</span>
    <span class="badge">NEW</span>
  </li>
  <li onclick="openPage('changelog.html')">
    <span class="name">Bug fixes & performance update</span>
    <span class="time">2 days ago</span>
  </li>
</ul>

<!-- ================= Recent (Users) ================= -->
<h2>🕒 Recent (Users)</h2>
<ul id="recentList"></ul>

<!-- ================= Highlighted (KS) ================= -->
<h2>⭐ Highlighted (KS)</h2>
<ul>
  <li onclick="openPage('dashboard.html')">
    <span class="name">Main Dashboard</span>
  </li>
  <li onclick="openPage('server-manage.html')">
    <span class="name">Server Manager</span>
  </li>
  <li onclick="openPage('file-manager.html')">
    <span class="name">File Manager</span>
  </li>
</ul>

<!-- ================= Favourite (Users) ================= -->
<h2>❤️ Favourite (Users)</h2>
<ul id="favList"></ul>

<script>
/* ================= Recent ================= */
const RECENT_KEY = "ls-web-recent";
const FAV_KEY = "ls-web-fav";

const recentList = document.getElementById("recentList");
const favList = document.getElementById("favList");

function loadRecent() {
  const recent = JSON.parse(localStorage.getItem(RECENT_KEY)) || [];

  if (!recent.length) {
    recentList.innerHTML = `<li class="empty">No recent pages</li>`;
    return;
  }

  recentList.innerHTML = recent.slice(0,5).map(item => `
    <li onclick="openPage('${item.url}')">
      <span class="name">${item.name}</span>
      <span class="time">${timeAgo(item.time)}</span>
    </li>
  `).join("");
}

/* ================= Favourite ================= */
function loadFav(){
  const fav = JSON.parse(localStorage.getItem(FAV_KEY)) || [];

  if (!fav.length){
    favList.innerHTML = `<li class="empty">No favourite pages</li>`;
    return;
  }

  favList.innerHTML = fav.map(item => `
    <li onclick="openPage('${item.url}')">
      <span class="name">${item.name}</span>
    </li>
  `).join("");
}

/* ================= Helpers ================= */
function openPage(url){
  parent.document.getElementById("frame").src = url;
}

function timeAgo(time){
  const diff = Math.floor((Date.now() - time) / 1000);
  if (diff < 60) return "Just now";
  if (diff < 3600) return Math.floor(diff/60) + " min ago";
  if (diff < 86400) return Math.floor(diff/3600) + " hr ago";
  return Math.floor(diff/86400) + " day ago";
}

loadRecent();
loadFav();
</script>

</body>
</html>
