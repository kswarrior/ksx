<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KS Dashboard</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f5f5f5}

.main{padding:20px}

.social-stats{
  display:flex;
  flex-wrap:wrap;
  gap:15px;
}

.social-card{
  flex:1 1 200px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  color:#fff;
  text-decoration:none;
  border-radius:8px;
  height:70px;
}

.social-card img{
  width:40px;
  height:40px;
}

.social-card h3{font-size:14px}
.social-card p{font-size:12px;opacity:.9}

/* Colors */
.yt{background:#ff0000}
.discord{background:#5865F2}
.insta{background:#E1306C}

@media(max-width:600px){
  .social-card{flex:1 1 100%}
}
</style>
</head>

<body>
<main class="main">

<div class="social-stats">
  <a class="social-card yt" href="https://youtube.com/@ks_warrior_pro" target="_blank">
    <img src="/image/youtube.png">
    <div>
      <h3>YouTube</h3>
      <p>Subscribers: 125+</p>
    </div>
  </a>

  <a class="social-card discord" href="https://discord.gg/2kAYnH655h" target="_blank">
    <img src="/image/discord.png">
    <div>
      <h3>Discord</h3>
      <p>Members: 1150+</p>
    </div>
  </a>

  <a class="social-card insta" href="https://instagram.com/ks_warrior_pro" target="_blank">
    <img src="/image/instagram.png">
    <div>
      <h3>Instagram</h3>
      <p>Followers: 9+</p>
    </div>
  </a>
</div>

</main>
</body>
</html>
