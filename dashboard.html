<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KS Dashboard - Pure Black Elegance</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* ------------------------------
   VARIABLES
--------------------------------*/
:root{
  --bg:#000000;
  --card:rgba(18,18,28,0.85);
  --soft:rgba(28,28,40,0.9);
  --hover-card:rgba(40,40,55,0.95);
  --text:#ffffff;
  --muted:#aaaaaa;
  --accent:#ffffff;
  --accent-glow:rgba(255,255,255,0.4);
  --border:rgba(255,255,255,0.12);
  --glow:0 0 20px rgba(255,255,255,0.15);
  --radius:22px;
  --gap:28px;
  --transition:0.5s cubic-bezier(0.22, 1, 0.36, 1);
}

*{ box-sizing:border-box; margin:0; padding:0; }
body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden; /* Prevent horizontal scroll */
  line-height:1.5;
  animation:bgPulse 18s ease-in-out infinite alternate;
}

@keyframes bgPulse {
  0% { background:#000000; }
  100% { background:#0a0a0a; }
}

/* ------------------------------
   DASHBOARD GRID
--------------------------------*/
.dashboard{
  display:grid;
  gap:var(--gap);
  max-width:1180px;
  margin:auto;
  padding:var(--gap) 16px;
}

/* ------------------------------
   NEWS SECTION
--------------------------------*/
.news{
  background:var(--card);
  border-radius:var(--radius);
  padding:var(--gap);
  backdrop-filter: blur(20px);
  border:1px solid var(--border);
  animation:floatIn 1.2s ease-out;
  overflow:hidden;
}
.news-header{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:20px;
  font-weight:700;
  font-size:21px;
  flex-wrap:wrap;
}
.news-header span{
  background:var(--accent);
  color:#000;
  padding:6px 16px;
  border-radius:999px;
  font-size:13px;
  font-weight:600;
  box-shadow:0 0 10px var(--accent-glow);
}
.news-slider{
  height:150px;
  overflow:hidden;
  position:relative;
  border-radius:5px;
  background:rgba(255,255,255,0.03);
}
.news-track{
  display:flex;
  transition:transform 0.9s cubic-bezier(0.77,0,0.18,1);
  width:100%;
}
.news-slide{
  min-width:100%;
  flex-shrink:0;
  background:linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.04));
  border-radius:8px;
  padding:24px;
  backdrop-filter: blur(12px);
  border:1px solid var(--border);
}
.news-title{
  font-size:16px;
  font-weight:900;
  margin-bottom:10px;
  letter-spacing:-0.5px;
}
.news-desc{
  font-size:12px;
  color:var(--muted);
}
.news-dots{
  display:flex;
  gap:10px;
  justify-content:flex-end;
  margin-top:16px;
  flex-wrap:wrap;
}
.news-dots i{
  width:8px;
  height:8px;
  border-radius:50%;
  background:rgba(255,255,255,0.2);
  transition:all 0.8s ease;
}
.news-dots i.active{
  background:var(--accent);
  transform:scale(1.5);
  box-shadow:0 0 20px var(--accent-glow);
}

/* ------------------------------
   PANELS GRID
--------------------------------*/
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:var(--gap);
}
@media(max-width:820px){ .grid{ grid-template-columns:1fr; } }

.panel{
  background:var(--card);
  border-radius:var(--radius);
  padding:var(--gap);
  backdrop-filter: blur(20px);
  border:1px solid var(--border);
  transition:all var(--transition);
  animation:floatIn 1.4s ease-out;
  overflow:hidden; /* Prevent overflow */
}
.panel:hover{
  transform:translateY(-10px);
}
.panel h2{
  margin-bottom:20px;
  font-size:18px;
  font-weight:900;
}

/* ------------------------------
   LIST ITEMS
--------------------------------*/
.list-item{
  background:var(--soft);
  padding:16px 20px;
  border-radius:16px;
  margin-bottom:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
  transition:all 0.4s ease;
  border:1px solid var(--border);
  position:relative;
  overflow:hidden;
  word-break:break-word;
}
.list-item::before{
  content:'';
  position:absolute;
  top:0; left:-100%;
  width:50%;
  height:100%;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
  transition:left 0.7s ease;
}
.list-item:hover::before{ left:100%; }
.list-item:hover{
  background:var(--hover-card);
  transform:translateX(10px) scale(1.03);
  box-shadow:0 0 25px rgba(255,255,255,0.2);
}
.list-item:last-child{ margin-bottom:0; }
.time{
  font-size:12px;
  color:var(--muted);
}
name {
   font-size:14px;
}
/* ------------------------------
   HIGHLIGHTED CARDS
--------------------------------*/
.highlight-slider{
  overflow:hidden;
  position:relative;
  height:125px;
  border-radius:8px;
  background:rgba(255,255,255,0.03);
}
.highlight-track{
  transition:transform 1s cubic-bezier(0.77,0,0.18,1);
  width:100%;
}
.h-card{
  height:160px;
  background:linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.06));
  border-radius:8px;
  padding:24px;
  margin-bottom:16px;
  cursor:pointer;
  transition:all 0.5s ease;
  backdrop-filter: blur(14px);
  border:1px solid var(--border);
  display:flex;
  flex-direction:column;
  justify-content:center;
  box-shadow: var(--glow);
  position:relative;
  overflow:hidden;
}
.h-card::after{
  content:'';
  position:absolute;
  inset:0;
  background:radial-gradient(circle at 20% 80%, rgba(255,255,255,0.25), transparent 60%);
  opacity:0;
  transition:opacity 0.5s ease;
}
.h-card:hover::after{ opacity:1; }
.h-card:hover{
  transform:scale(1.08) translateY(-4px);
  background:linear-gradient(135deg, rgba(255,255,255,0.18), rgba(255,255,255,0.1));
  box-shadow:0 0 40px rgba(255,255,255,0.35);
}
.h-card span{
  display:block;
  font-size:15px;
  color:var(--muted);
  margin-top:5px;
}

/* ------------------------------
   EMPTY STATE
--------------------------------*/
.empty{
  color:#777;
  font-size:16px;
  text-align:center;
  padding:60px 0;
}

/* ------------------------------
   ANIMATIONS
--------------------------------*/
@keyframes floatIn {
  from{ opacity:0; transform:translateY(30px);}
  to{ opacity:1; transform:translateY(0);}
}
@keyframes slideIn {
  from{ opacity:0; transform:translateX(40px);}
  to{ opacity:1; transform:translateX(0);}
}

/* Always show sidebar on desktop */
@media (min-width: 768px) {
  body {
    /* Make sidebar open by default on desktop */
    left: 0;
  }
  #sidebar {
    left: 0 !important; /* Force sidebar open */
  }
  #frame {
    transform: translateX(220px);
  }
}
</style>
</head>

<body>
<div class="dashboard">

  <!-- NEWS SECTION -->
  <section class="news">
    <div class="news-header">📰 Updates & News <span>NEW</span></div>
    <div class="news-slider">
      <div class="news-track" id="newsTrack">
        <div class="news-slide">
          <div class="news-title">KS Panel v2.4</div>
          <div class="news-desc">UI polish & performance boost</div>
        </div>
        <div class="news-slide">
          <div class="news-title">Security Improvements</div>
          <div class="news-desc">Safer auth & bug fixes</div>
        </div>
        <div class="news-slide">
          <div class="news-title">Fast Loading</div>
          <div class="news-desc">Optimized dashboard responsiveness</div>
        </div>
      </div>
    </div>
    <div class="news-dots" id="newsDots"></div>
  </section>

  <!-- RECENT + FAVOURITE -->
  <div class="grid">
    <section class="panel">
      <h2>🕒 Recent</h2>
      <div id="recentList"></div>
    </section>
    <section class="panel">
      <h2>❤️ Favourite</h2>
      <div id="favList"></div>
    </section>
  </div>

  <!-- HIGHLIGHTED -->
  <section class="panel">
    <h2>⭐ Highlighted</h2>
    <div class="highlight-slider">
      <div class="highlight-track" id="highlightTrack">
        <div class="h-card" onclick="parent.loadInFrame('dashboard.html')">Dashboard <span>Overview</span></div>
        <div class="h-card" onclick="parent.loadInFrame('server.html')">Server <span>Control & status</span></div>
        <div class="h-card" onclick="parent.loadInFrame('files.html')">Files <span>Manage server files</span></div>
      </div>
    </div>
  </section>

</div>

<script>
// ------------------------------
// NEWS SLIDER
// ------------------------------
const newsTrack = document.getElementById("newsTrack");
const newsDots = document.getElementById("newsDots");
const slides = newsTrack.children;

if(slides.length > 1){
  for(let i=0;i<slides.length;i++){
    const dot = document.createElement("i");
    if(i===0) dot.classList.add("active");
    newsDots.appendChild(dot);
  }
  let index = 0;
  setInterval(()=>{
    index = (index+1)%slides.length;
    newsTrack.style.transform = `translateX(-${index*100}%)`;
    [...newsDots.children].forEach((d,i)=>d.classList.toggle("active", i===index));
  },4000);
}

// ------------------------------
// HIGHLIGHT VERTICAL SLIDER
// ------------------------------
const hTrack = document.getElementById("highlightTrack");
const cards = hTrack.children;
if(cards.length>1){
  let hIndex=0;
  const cardHeight = cards[0].offsetHeight + 16;
  setInterval(()=>{
    hIndex = (hIndex+1)%cards.length;
    hTrack.style.transform = `translateY(-${hIndex*cardHeight}px)`;
  },3500);
}

// ------------------------------
// TIME AGO
// ------------------------------
function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return "Now";
  if(s<3600) return Math.floor(s/60)+"m ago";
  if(s<86400) return Math.floor(s/3600)+"h ago";
  if(s<2592000) return Math.floor(s/86400)+"d ago";
  return Math.floor(s/2592000)+"mo ago";
}

// ------------------------------
// RENDER LISTS
// ------------------------------
const RECENT_KEY = "ks-web-recent";
const FAV_KEY = "ks-web-fav";

function renderList(key, containerId, showTime=false){
  const data = JSON.parse(localStorage.getItem(key)||"[]");
  const el = document.getElementById(containerId);
  el.innerHTML="";
  if(data.length===0){
    el.innerHTML=`<div class="empty">No data</div>`;
    return;
  }
  data.forEach(item=>{
    const div = document.createElement("div");
    div.className="list-item";
    div.innerHTML=`<span class="name">${item.name}</span>${showTime?`<span class="time">${timeAgo(item.time)}</span>`:""}`;
    div.onclick=()=>parent.loadInFrame(item.url);
    el.appendChild(div);
  });
}

// INITIALIZE
renderList(RECENT_KEY,"recentList",true);
renderList(FAV_KEY,"favList",false);
</script>
</body>
</html>
