<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KS Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#0e0e11;
  --card:#15151d;
  --soft:#1f1f2a;
  --muted:#9ca3af;
  --accent:#4f46e5;
  --radius:16px;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  padding:18px;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  background:radial-gradient(circle at top,#141421,#0e0e11);
  color:#fff;
}

.dashboard{
  display:grid;
  gap:20px;
  max-width:1100px;
  margin:auto;
}

/* ================= NEWS ================= */
.news{
  background:linear-gradient(135deg,#1b1b2f,#161622);
  border-radius:var(--radius);
  padding:18px;
  overflow:hidden;
}

.news-header{
  display:flex;
  gap:8px;
  margin-bottom:14px;
}

.news-header span{
  background:var(--accent);
  padding:4px 10px;
  border-radius:999px;
  font-size:11px;
}

.news-slider{ height:92px; overflow:hidden; }

.news-track{
  display:flex;
  transition:transform 1s ease;
}

.news-slide{
  min-width:100%;
  background:#141420;
  border-radius:14px;
  padding:16px;
}

.news-title{ font-size:18px; font-weight:600; }
.news-desc{ font-size:13px; color:var(--muted); }

.news-dots{
  display:flex;
  gap:6px;
  justify-content:flex-end;
}

.news-dots i{
  width:7px;height:7px;border-radius:50%;
  background:#333;
}
.news-dots i.active{ background:var(--accent); }

/* ================= GRID ================= */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}
@media(max-width:800px){ .grid{grid-template-columns:1fr;} }

.panel{
  background:#141420;
  border-radius:var(--radius);
  padding:16px;
}

.panel h2{ margin-bottom:14px; }

/* ================= LIST ================= */
.list-item{
  background:var(--soft);
  padding:12px;
  border-radius:12px;
  margin-bottom:8px;
  display:flex;
  justify-content:space-between;
  cursor:pointer;
}
.list-item:hover{ background:#2a2a3a; }
.time{ font-size:12px;color:var(--muted); }

/* ================= HIGHLIGHT (VERTICAL) ================= */
.highlight-slider{
  height:90px;
  overflow:hidden;
  position:relative;
}

.highlight-track{
  transition:transform 1s ease;
}

.h-card{
  background:#181828;
  border-radius:14px;
  padding:18px;
  margin-bottom:10px;
  cursor:pointer;
}
.h-card span{ font-size:13px;color:var(--muted); }

.empty{ color:#6b7280;font-size:13px; }
</style>
</head>

<body>
<div class="dashboard">

<!-- NEWS -->
<section class="news">
  <div class="news-header">📰 Updates & News <span>NEW</span></div>
  <div class="news-slider">
    <div class="news-track" id="newsTrack">
      <div class="news-slide">
        <div class="news-title">KS Panel v2.4</div>
        <div class="news-desc">UI polish & performance boost</div>
      </div>
      <div class="news-slide">
        <div class="news-title">Security Improvements</div>
        <div class="news-desc">Safer auth & bug fixes</div>
      </div>
    </div>
  </div>
  <div class="news-dots" id="newsDots"></div>
</section>

<!-- RECENT + FAV -->
<div class="grid">
  <section class="panel">
    <h2>🕒 Recent</h2>
    <div id="recentList"></div>
  </section>
  <section class="panel">
    <h2>❤️ Favourite</h2>
    <div id="favList"></div>
  </section>
</div>

<!-- HIGHLIGHT -->
<section class="panel">
  <h2>⭐ Highlighted</h2>
  <div class="highlight-slider">
    <div class="highlight-track" id="highlightTrack">
      <div class="h-card" onclick="openPage('dashboard.html','Dashboard')">
        Dashboard <span>Overview</span>
      </div>
      <div class="h-card" onclick="openPage('server.html','Server')">
        Server <span>Control & status</span>
      </div>
      <div class="h-card" onclick="openPage('files.html','Files')">
        Files <span>Manage server files</span>
      </div>
    </div>
  </div>
</section>

</div>

<script>
/* ===== NEWS ===== */
let n=0;
const nTrack=document.getElementById("newsTrack");
const nDots=document.getElementById("newsDots");
[...nTrack.children].forEach((_,i)=>{
  const d=document.createElement("i");
  if(i===0)d.classList.add("active");
  nDots.appendChild(d);
});
setInterval(()=>{
  n=(n+1)%nTrack.children.length;
  nTrack.style.transform=`translateX(-${n*100}%)`;
  [...nDots.children].forEach(d=>d.classList.remove("active"));
  nDots.children[n].classList.add("active");
},1800);

/* ===== HIGHLIGHT (VERTICAL) ===== */
let h=0;
const hTrack=document.getElementById("highlightTrack");
setInterval(()=>{
  h=(h+1)%hTrack.children.length;
  hTrack.style.transform=`translateY(-${h*100}px)`;
},2000);

/* ===== RECENT & FAV ===== */
const RECENT="ls-recent",FAV="ls-fav";

function openPage(url,name){
  let r=JSON.parse(localStorage.getItem(RECENT)||"[]");
  r.unshift({name,url,time:Date.now()});
  localStorage.setItem(RECENT,JSON.stringify(r.slice(0,5)));
}

function timeAgo(t){
  const d=(Date.now()-t)/1000;
  if(d<60)return"Now";
  if(d<3600)return Math.floor(d/60)+"m";
  if(d<86400)return Math.floor(d/3600)+"h";
  return Math.floor(d/86400)+"d";
}

function load(key,el,time){
  const d=JSON.parse(localStorage.getItem(key)||"[]");
  el.innerHTML=d.length?d.map(i=>`
    <div class="list-item">
      <span>${i.name}</span>
      ${time?`<span class="time">${timeAgo(i.time)}</span>`:""}
    </div>`).join(""):`<div class="empty">No data</div>`;
}

load(RECENT,document.getElementById("recentList"),true);
load(FAV,document.getElementById("favList"),false);
</script>
</body>
</html>
