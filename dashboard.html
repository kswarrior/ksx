<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KS Warrior</title>
  <style>
    body { margin:0; font-family:Poppins,sans-serif; }
    .header { padding-top:60px; font-size:22px; font-weight:600; }
    .search-row { display:flex; justify-content:center; gap:10px; padding:10px; }
    .search-row input {
      width:60%; padding:10px; font-size:16px;
      border:1px solid #aaa; border-radius:10px;
    }
    .item {
      padding:15px; margin:10px; border:1px solid #ddd;
      border-radius:10px; cursor:pointer; font-size:18px;
    }
  </style>
</head>
<body>

<div class="header">Favourite  
    <input id="searchBox" type="text" placeholder="Search..." style="margin-left:20px;width:50%">
    Add
</div>

<div id="results"></div>

<script>
async function loadData() {
  const res = await fetch("search-data.json");
  const data = await res.json();
  window.allData = data;
  display(data);
}

function display(list) {
  const div = document.getElementById("results");
  div.innerHTML = "";
  list.forEach(item => {
    const box = document.createElement("div");
    box.className = "item";
    box.textContent = item.name;
    box.onclick = () => {
      window.location.href = `view.html?url=${encodeURIComponent(item.url)}`;
    };
    div.appendChild(box);
  });
}

document.getElementById("searchBox").addEventListener("input", e => {
  const q = e.target.value.toLowerCase();
  const filtered = window.allData.filter(d => d.name.toLowerCase().includes(q));
  display(filtered);
});

loadData();
</script>

</body>
</html>
