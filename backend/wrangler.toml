name = "ksx-backend"
main = "src/worker.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Workers Sites – serve frontend static build together with API
# After `npm run build` in frontend, `../frontend/dist` will be deployed as assets.
# Comment out [assets] if you deploy frontend separately via Pages.
[assets]
directory = "../frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = false

[vars]
# FRONTEND_URL = "https://ksx.pages.dev" # optional

# For local dev: `npx wrangler dev`
# For deploy: `npx wrangler deploy` (needs CLOUDFLARE_API_TOKEN)
