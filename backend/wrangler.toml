name = "ksx-backend"
main = "src/worker.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Workers Sites – serve frontend static build together with API
# After `npm run build` in frontend, `../frontend/dist` will be deployed as assets.
# Comment out [assets] if you deploy frontend separately via Pages.
[assets]
directory = "../frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# D1 database for app downloads.
# 1) npx wrangler d1 create ksx-db
# 2) paste the printed database_id below
# 3) npx wrangler d1 migrations apply ksx-db --local
# 4) npx wrangler d1 migrations apply ksx-db --remote
[[d1_databases]]
binding = "DB"
database_name = "ksx-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
# FRONTEND_URL = "https://ksx.pages.dev" # optional

# For local dev: `npx wrangler dev`
# For deploy: `npx wrangler deploy` (needs CLOUDFLARE_API_TOKEN)
