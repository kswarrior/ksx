<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="author" content="KS Warrior" />
    <meta
      name="description"
      content="KS Warrior — Ultimate Minecraft Hub & KS Ultra Hub Server. Minecraft hosting, VPS, launchers and more."
    />
    <title>KS Warrior — Ultimate Minecraft Hub</title>
    <style>
      html, body { margin: 0; background: #050505; }
      #ks-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(520px 280px at 50% 42%, rgba(255, 255, 255, 0.055), transparent 70%), #050505;
        user-select: none;
      }
      #ks-boot .ks-boot-lines {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 9px;
      }
      #ks-boot .ks-boot-lines i {
        display: block;
        width: 8px;
        height: 44px;
        border-radius: 2px;
        background: #f5f5f5;
        opacity: 0.22;
        will-change: transform, opacity;
        animation: ks-boot-line-up 1.6s cubic-bezier(0.45, 0, 0.55, 1) -0.8s infinite;
      }
      #ks-boot .ks-boot-lines i:nth-child(1) {
        transform: translateY(-8px);
      }
      #ks-boot .ks-boot-lines i:nth-child(2) {
        animation-name: ks-boot-line-update;
        transform: scaleY(1);
      }
      #ks-boot .ks-boot-lines i:nth-child(3) {
        animation-name: ks-boot-line-down;
        transform: translateY(8px);
      }
      @keyframes ks-boot-line-up {
        0%, 100% { transform: translateY(0); opacity: 0.22; }
        50% { transform: translateY(-8px); opacity: 1; }
      }
      @keyframes ks-boot-line-down {
        0%, 100% { transform: translateY(0); opacity: 0.22; }
        50% { transform: translateY(8px); opacity: 1; }
      }
      @keyframes ks-boot-line-update {
        0%, 100% { transform: scaleY(0.5); opacity: 0.22; }
        50% { transform: scaleY(1); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #ks-boot .ks-boot-lines i { animation: none; opacity: 0.55; }
        #ks-boot .ks-boot-lines i:nth-child(2) { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="ks-boot" role="status" aria-live="polite" aria-label="Loading KS">
        <div class="ks-boot-lines" aria-hidden="true"><i></i><i></i><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
