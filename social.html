<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KS Social Media</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background: #000000;font-family:Arial,sans-serif;-webkit-tap-highlight-color: transparent;user-select: none;}
.main{padding:2rem}

/* ===== SOCIAL STATS (UNCHANGED) ===== */
.social-stats{
  display:flex;
  flex-wrap:wrap;
  gap:15px;
  margin-top:25px;
}

.social-card{
  display:flex;
  align-items:center;
  gap:10px;
  color:#fff;
  padding:1rem;
  border-radius:10px;
  min-width:175px;
  max-width:300px;
  height:75px;
  font-size:10px;
  box-shadow:0 4px 12px rgba(0,0,0,.2);
  text-decoration:none;
  transition:transform .2s ease;
  flex:1 1 calc(33% - 15px);
}

.social-card:hover{transform:scale(1.03)}

@media(max-width:600px){
  .social-card{flex:1 1 100%;max-width:100%}
}

.social-logo{width:45px;height:45px;flex-shrink:0}
  .svg-logo {
  width: 45px;
  height: 45px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.svg-logo svg {
  width: 26px;
  height: 26px;
  fill: #fff;
  opacity: 0.9;
  transition: transform .25s ease, opacity .25s ease;
}

/* Hover polish */
.social-card:hover .svg-logo svg {
  transform: scale(1.15);
  opacity: 1;
}
.social-content{display:flex;flex-direction:column}
.social-stats h3{font-size:15px}
.social-stats p{font-size:12px}

/* ===== ORIGINAL BACKGROUNDS & ANIMS (UNCHANGED) ===== */
.yt{
  background:radial-gradient(circle at 40% 120%,#FF0000 0%,#FF4C4C 25%,#CC0000 50%,#990000 75%,#1A1A1A 100%);
  background-size:200% 200%;
  animation:youtubeGlow 3s ease infinite;
}
@keyframes youtubeGlow{
  0%{background-position:0 0}
  50%{background-position:100% 100%}
  100%{background-position:0 0}
}

.discord{
  background:radial-gradient(circle,#5865F2,#7289DA,#4E5AB7,#2C2F33);
  background-size:400% 400%;
  animation:rotateGradient 6s linear infinite;
}
@keyframes rotateGradient{
  0%{background-position:0 50%}
  25%{background-position:50% 100%}
  50%{background-position:100% 50%}
  75%{background-position:50% 0}
  100%{background-position:0 50%}
}

.insta{
  background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285AEB 90%);
  background-size:200% 200%;
  animation:instaGlow 4s ease infinite;
}
@keyframes instaGlow{
  0%{background-position:0 0}
  25%{background-position:100% 0}
  50%{background-position:100% 100%}
  75%{background-position:0 100%}
  100%{background-position:0 0}
}
</style>
</head>

<body>
<main class="main">
<div class="social-stats">

<a href="https://youtube.com/@ks_warrior_pro" target="_blank" class="social-card yt">
  <div class="social-logo svg-logo">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M23.5 6.2s-.2-1.6-.8-2.3c-.7-.8-1.5-.8-1.9-.9C18.1 2.8 12 2.8 12 2.8h0s-6.1 0-8.8.2c-.4.1-1.2.1-1.9.9C.7 4.6.5 6.2.5 6.2S.3 8.1.3 10v1.9c0 1.9.2 3.8.2 3.8s.2 1.6.8 2.3c.7.8 1.7.8 2.1.9 1.5.2 8.6.2 8.6.2s6.1 0 8.8-.2c.4-.1 1.2-.1 1.9-.9.6-.7.8-2.3.8-2.3s.2-1.9.2-3.8V10c0-1.9-.2-3.8-.2-3.8zM9.8 13.9V7.9l5.4 3z"/>
    </svg>
  </div>
  <div class="social-content">
    <h3>YouTube</h3>
    <p>Subscribers: 135+</p>
  </div>
</a>

<a href="https://discord.gg/2kAYnH655h" target="_blank" class="social-card discord">
  <div class="social-logo svg-logo">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20 4.5a19.8 19.8 0 0 0-4.9-1.5l-.2.4a18.4 18.4 0 0 1 4.3 1.7 13.4 13.4 0 0 0-11.4 0A18.4 18.4 0 0 1 12.1 3l-.2-.4A19.8 19.8 0 0 0 7 4.5C3.8 9 2.9 13.3 3.3 17.5a19.9 19.9 0 0 0 6.1 3.1l.8-1.3a12.8 12.8 0 0 1-1.9-.9l.4-.3a13.5 13.5 0 0 0 12.6 0l.4.3a12.8 12.8 0 0 1-1.9.9l.8 1.3a19.9 19.9 0 0 0 6.1-3.1C21.4 13.3 20.5 9 20 4.5z"/>
    </svg>
  </div>
  <div class="social-content">
    <h3>Discord</h3>
    <p>Members: 1250+</p>
  </div>
</a>

<a href="https://instagram.com/ks_warrior_pro" target="_blank" class="social-card insta">
  <div class="social-logo svg-logo">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="2" y="2" width="20" height="20" rx="6"/>
      <circle cx="12" cy="12" r="4"/>
      <circle cx="17.5" cy="6.5" r="1.2"/>
    </svg>
  </div>
  <div class="social-content">
    <h3>Instagram</h3>
    <p>Followers: 10+</p>
  </div>
</a>

</div>
</main>
</body>
</html>
