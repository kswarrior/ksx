<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KS Visual Sitemap</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#0a0a1f;
  --category:#3a3aff;
  --section:#1f1f3d;
  --page:#121224;
  --text:#ffffff;
  --line:rgba(255,255,255,.12);
}

/* Reset & body */
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:var(--bg);
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  overflow:hidden;
}

/* SVG container */
#map{
  width:100%;
  height:100%;
  touch-action:none;
  cursor:grab;
}

/* General node */
.node{
  rx:14;
  stroke:rgba(255,255,255,.15);
  stroke-width:1.2;
  transition: transform .2s ease, fill .25s ease;
}

/* Hover effect */
.node:hover{
  transform:scale(1.05);
  filter:drop-shadow(0 0 10px rgba(255,255,255,.2));
}

/* Category node style */
.node.category{
  fill:var(--category);
  stroke-width:1.8;
  stroke:rgba(255,255,255,.3);
}

/* Section / Title style */
.node.section{
  fill:var(--section);
  stroke:rgba(255,255,255,.2);
  stroke-width:1.4;
}

/* Page node style */
.node.page{
  fill:var(--page);
  stroke:rgba(255,255,255,.15);
}

/* Labels */
.label{
  font-weight:700;
  font-size:13px;
  fill:var(--text);
  pointer-events:none;
  text-shadow:0 0 2px rgba(0,0,0,.6);
}

/* Links */
.link{
  stroke:var(--line);
  stroke-width:1.2;
  stroke-dasharray:4 4;
}

/* Animations */
.fade-in{
  opacity:0;
  animation:fadeIn .6s ease forwards;
}

@keyframes fadeIn{
  from{ opacity:0; transform:translateY(8px) scale(.97);}
  to{ opacity:1; transform:translateY(0) scale(1);}
}

/* Optimistic hover effects for mobile */
@media (hover: none){
  .node:hover{ transform:none; filter:none; }
}
</style>
</head>

<body>

<svg id="map">
  <g id="viewport"></g>
</svg>

<div class="hint">Drag • Zoom • Tap pages</div>

<script>
const svg = document.getElementById("map");
const viewport = document.getElementById("viewport");

let scale = 1;
let panX = 40;
let panY = 40;
let isPanning = false;
let startX, startY;

/* zoom */
svg.addEventListener("wheel", e=>{
  e.preventDefault();

  const rect = svg.getBoundingClientRect();
  const mx = e.clientX - rect.left; // mouse x inside SVG
  const my = e.clientY - rect.top;  // mouse y inside SVG

  const zoomIntensity = 0.1;
  const delta = (e.deltaY > 0 ? -1 : 1) * zoomIntensity;

  const newScale = Math.min(Math.max(0.2, scale + delta), 3);

  // adjust pan so zoom is centered on mouse
  panX -= (mx - panX) * (newScale/scale - 1);
  panY -= (my - panY) * (newScale/scale - 1);

  scale = newScale;
  update();
},{ passive:false });

/* pan */
svg.addEventListener("pointerdown", e=>{
  isPanning = true;
  startX = e.clientX - panX;
  startY = e.clientY - panY;
  svg.setPointerCapture(e.pointerId);
  svg.style.cursor="grabbing";
});

svg.addEventListener("pointerup", ()=>{
  isPanning=false;
  svg.style.cursor="grab";
});

svg.addEventListener("pointermove", e=>{
  if(!isPanning) return;
  panX = e.clientX - startX;
  panY = e.clientY - startY;
  update();
});

function update(){
  viewport.setAttribute(
    "transform",
    `translate(${panX},${panY}) scale(${scale})`
  );
}

/* load sitemap */
fetch("sitemap.json")
.then(r=>r.json())
.then(data=>{
  let x = 80;
  const gapX = 420;

  data.forEach((cat,ci)=>{
    let y = 80;

    const catNode = node(x,y,260,64,cat.icon+" "+cat.category,"category",ci);

    let sy = y + 130;

    cat.sections.forEach((sec,si)=>{
      line(x+130,y+64,x+130,sy);

      const secNode = node(x,sy,260,54,sec.title,"section",ci+si);

      let py = sy + 90;

      sec.pages.forEach((p,pi)=>{
        line(x+130,sy+54,x+420,py+23);

        const page = node(x+420,py,300,46,p.name,"page",ci+si+pi);
        page.style.cursor="pointer";
        page.addEventListener("click",()=>location.href=p.url);

        py += 68;
      });

      sy = py + 20;
    });

    x += gapX;
  });

  update();
});

/* helpers */
function node(x,y,w,h,text,type,delay){
  const g = svgEl("g");
  g.classList.add("fade-in");
  g.style.animationDelay = delay*40+"ms";

  const r = svgEl("rect");
  r.setAttribute("x",x);
  r.setAttribute("y",y);
  r.setAttribute("width",w);
  r.setAttribute("height",h);
  r.setAttribute("class","node "+type);

  const t = svgEl("text");
  t.setAttribute("x",x+16);
  t.setAttribute("y",y+h/2+5);
  t.setAttribute("class","label");
  t.textContent=text;

  g.append(r,t);
  viewport.appendChild(g);
  return g;
}

function line(x1,y1,x2,y2){
  const l = svgEl("line");
  l.setAttribute("x1",x1);
  l.setAttribute("y1",y1);
  l.setAttribute("x2",x2);
  l.setAttribute("y2",y2);
  l.setAttribute("class","link");
  viewport.appendChild(l);
}

function svgEl(n){
  return document.createElementNS("http://www.w3.org/2000/svg",n);
}
</script>

</body>
</html>
