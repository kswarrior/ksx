<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KS Solar Sitemap</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#02040b;
  --sun:#ffb703;
  --planet:#6d7cff;
  --moon:#ffffff;
  --orbit:rgba(255,255,255,.18);
}

*{box-sizing:border-box}

body{
  margin:0;
  overflow:hidden;
  background:radial-gradient(circle at center,#0b1030,#02040b);
  font-family:system-ui;
  color:white;
}

/* MAP */
#map{
  width:100vw;
  height:100vh;
  position:relative;
  touch-action:none;
}
#world{
  position:absolute;
  left:50%;
  top:50%;
  transform-origin:0 0;
}

/* SYSTEM */
.system{ position:absolute }

/* SUN */
.sun{
  width:260px;
  height:260px;
  border-radius:50%;
  background:radial-gradient(circle,#ffd166,#ff9f1c);
  box-shadow:0 0 120px rgba(255,183,3,.95);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-weight:900;
  font-size:22px;
}

/* ORBITS */
.orbit{
  position:absolute;
  border-radius:50%;
  border:1px dashed var(--orbit);
  animation:spin linear infinite;
}
.spin-slow{animation-duration:90s}
.spin-fast{animation-duration:35s}

/* PLANET */
.planet{
  position:absolute;
  width:150px;
  height:150px;
  border-radius:50%;
  background:radial-gradient(circle,#9aa8ff,#4a5cff);
  box-shadow:0 0 55px rgba(109,124,255,.95);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:15px;
  font-weight:900;
  padding:14px;
}

/* MOON */
.moon{
  position:absolute;
  width:64px;
  height:64px;
  border-radius:50%;
  background:radial-gradient(circle,#fff,#dcdcdc);
  box-shadow:0 0 20px white;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:10px;
  font-weight:800;
  padding:6px;
}
.moon:hover{
  transform:scale(1.35);
  box-shadow:0 0 35px var(--planet);
}

/* ANIMATION */
@keyframes spin{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}
</style>
</head>

<body>

<div id="map">
  <div id="world"></div>
</div>

<script>
const map=document.getElementById("map");
const world=document.getElementById("world");

/* CAMERA */
let scale=.38, dx=0, dy=0, drag=false, sx=0, sy=0, lastDist=null;
function update(){
  world.style.transform=`translate(${dx}px,${dy}px) scale(${scale})`;
}

/* PAN */
map.onmousedown=e=>{drag=true;sx=e.clientX-dx;sy=e.clientY-dy;}
window.onmouseup=()=>drag=false;
window.onmousemove=e=>{
  if(!drag)return;
  dx=e.clientX-sx; dy=e.clientY-sy; update();
};

/* ZOOM */
map.onwheel=e=>{
  e.preventDefault();
  scale+=e.deltaY*-0.001;
  scale=Math.min(Math.max(.25,scale),2);
  update();
},{passive:false});

/* TOUCH */
map.addEventListener("touchmove",e=>{
  if(e.touches.length===1){
    dx=e.touches[0].clientX-sx;
    dy=e.touches[0].clientY-sy;
    update();
  }
  if(e.touches.length===2){
    e.preventDefault();
    const d=Math.hypot(
      e.touches[0].clientX-e.touches[1].clientX,
      e.touches[0].clientY-e.touches[1].clientY
    );
    if(lastDist){
      scale+=(d-lastDist)*0.002;
      scale=Math.min(Math.max(.25,scale),2);
      update();
    }
    lastDist=d;
  }
},{passive:false});
map.addEventListener("touchend",()=>lastDist=null);

/* LOAD JSON */
fetch("sitemap.json")
.then(r=>r.json())
.then(build);

function build(data){
  const spacing=2100;
  let x=-(data.length-1)*spacing/2;

  data.forEach(cat=>{
    const sys=document.createElement("div");
    sys.className="system";
    sys.style.left=x+"px";

    const sun=document.createElement("div");
    sun.className="sun";
    sun.innerHTML=`${cat.icon}<br>${cat.category}`;
    sys.appendChild(sun);

    cat.sections.forEach((sec,i)=>{
      const pSize=520+i*300;

      const pOrbit=document.createElement("div");
      pOrbit.className="orbit spin-slow";
      pOrbit.style.width=pSize+"px";
      pOrbit.style.height=pSize+"px";
      pOrbit.style.left=130-pSize/2+"px";
      pOrbit.style.top=130-pSize/2+"px";

      const planet=document.createElement("div");
      planet.className="planet";
      planet.textContent=sec.title;
      planet.style.left=pSize/2-75+"px";
      planet.style.top="-75px";

      /* ONE MOON ORBIT PER SECTION */
      if(sec.pages?.length){
        const mSize=260;

        const mOrbit=document.createElement("div");
        mOrbit.className="orbit spin-fast";
        mOrbit.style.width=mSize+"px";
        mOrbit.style.height=mSize+"px";
        mOrbit.style.left=75-mSize/2+"px";
        mOrbit.style.top=75-mSize/2+"px";

        const step=360/sec.pages.length;

        sec.pages.forEach((p,idx)=>{
          const moon=document.createElement("div");
          moon.className="moon";
          moon.textContent=p.name;

          /* OPEN URL FROM JSON */
          moon.onclick=()=>window.location.href=p.url;

          moon.style.left="50%";
          moon.style.top="0";
          moon.style.transform=
            `rotate(${idx*step}deg) translateX(${mSize/2}px)`;

          mOrbit.appendChild(moon);
        });

        planet.appendChild(mOrbit);
      }

      pOrbit.appendChild(planet);
      sys.appendChild(pOrbit);
    });

    world.appendChild(sys);
    x+=spacing;
  });

  update();
}
</script>

</body>
</html>
