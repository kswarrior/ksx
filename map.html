<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KS Visual Sitemap</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#05050a;
  --card:#14142a;
  --card2:#1c1c3a;
  --accent:#7c7cff;
  --line:rgba(255,255,255,.18);
  --text:#ffffff;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:radial-gradient(circle at top,#0b0b20,#000);
  overflow:hidden;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
}

#map{
  width:100%;
  height:100%;
  touch-action:none;
  cursor:grab;
}

.node{
  fill:var(--card);
  stroke:rgba(255,255,255,.15);
  stroke-width:1.2;
  rx:14;
  transition:
    transform .25s ease,
    fill .25s ease,
    filter .25s ease;
}

.node.category{
  fill:linear-gradient(135deg,#2b2b6a,#1b1b3d);
}

.node.section{
  fill:var(--card2);
}

.node.page{
  fill:#121224;
}

.node:hover{
  fill:#2e2e60;
  filter:drop-shadow(0 0 12px rgba(124,124,255,.45));
  transform:scale(1.03);
}

.label{
  fill:var(--text);
  font-size:13px;
  font-weight:700;
  pointer-events:none;
}

.link{
  stroke:var(--line);
  stroke-width:1.1;
  stroke-dasharray:6 6;
  animation:dash 18s linear infinite;
}

@keyframes dash{
  to{ stroke-dashoffset:-200; }
}

/* smooth appear */
.fade-in{
  animation:fadeIn .6s ease forwards;
  opacity:0;
}

@keyframes fadeIn{
  from{ opacity:0; transform:translateY(12px) scale(.96); }
  to{ opacity:1; transform:none; }
}

/* mobile hint */
.hint{
  position:fixed;
  bottom:14px;
  left:50%;
  transform:translateX(-50%);
  font-size:12px;
  color:#aaa;
  background:rgba(0,0,0,.45);
  padding:6px 12px;
  border-radius:20px;
  backdrop-filter:blur(6px);
}
</style>
</head>

<body>

<svg id="map">
  <g id="viewport"></g>
</svg>

<div class="hint">Drag • Zoom • Tap pages</div>

<script>
const svg = document.getElementById("map");
const viewport = document.getElementById("viewport");

let scale = 1;
let panX = 40;
let panY = 40;
let isPanning = false;
let startX, startY;

/* zoom */
svg.addEventListener("wheel", e=>{
  e.preventDefault();
  const delta = e.deltaY * -0.0012;
  scale = Math.min(Math.max(.45, scale + delta), 2.8);
  update();
},{ passive:false });

/* pan */
svg.addEventListener("pointerdown", e=>{
  isPanning = true;
  startX = e.clientX - panX;
  startY = e.clientY - panY;
  svg.setPointerCapture(e.pointerId);
  svg.style.cursor="grabbing";
});

svg.addEventListener("pointerup", ()=>{
  isPanning=false;
  svg.style.cursor="grab";
});

svg.addEventListener("pointermove", e=>{
  if(!isPanning) return;
  panX = e.clientX - startX;
  panY = e.clientY - startY;
  update();
});

function update(){
  viewport.setAttribute(
    "transform",
    `translate(${panX},${panY}) scale(${scale})`
  );
}

/* load sitemap */
fetch("sitemap.json")
.then(r=>r.json())
.then(data=>{
  let x = 80;
  const gapX = 420;

  data.forEach((cat,ci)=>{
    let y = 80;

    const catNode = node(x,y,260,64,cat.icon+" "+cat.category,"category",ci);

    let sy = y + 130;

    cat.sections.forEach((sec,si)=>{
      line(x+130,y+64,x+130,sy);

      const secNode = node(x,sy,260,54,sec.title,"section",ci+si);

      let py = sy + 90;

      sec.pages.forEach((p,pi)=>{
        line(x+130,sy+54,x+420,py+23);

        const page = node(x+420,py,300,46,p.name,"page",ci+si+pi);
        page.style.cursor="pointer";
        page.addEventListener("click",()=>location.href=p.url);

        py += 68;
      });

      sy = py + 20;
    });

    x += gapX;
  });

  update();
});

/* helpers */
function node(x,y,w,h,text,type,delay){
  const g = svgEl("g");
  g.classList.add("fade-in");
  g.style.animationDelay = delay*40+"ms";

  const r = svgEl("rect");
  r.setAttribute("x",x);
  r.setAttribute("y",y);
  r.setAttribute("width",w);
  r.setAttribute("height",h);
  r.setAttribute("class","node "+type);

  const t = svgEl("text");
  t.setAttribute("x",x+16);
  t.setAttribute("y",y+h/2+5);
  t.setAttribute("class","label");
  t.textContent=text;

  g.append(r,t);
  viewport.appendChild(g);
  return g;
}

function line(x1,y1,x2,y2){
  const l = svgEl("line");
  l.setAttribute("x1",x1);
  l.setAttribute("y1",y1);
  l.setAttribute("x2",x2);
  l.setAttribute("y2",y2);
  l.setAttribute("class","link");
  viewport.appendChild(l);
}

function svgEl(n){
  return document.createElementNS("http://www.w3.org/2000/svg",n);
}
</script>

</body>
</html>
