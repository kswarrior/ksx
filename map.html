<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KS Visual Sitemap • Modern</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --bg: #0d001a;
  --accent: #7b2fff;
  --accent-dark: #5e22cc;
  --card: #1a1033;
  --card-hover: #25144a;
  --text: #f0e6ff;
  --text-light: #c9b8ff;
  --line: rgba(123,47,255,0.25);
  --glow: rgba(123,47,255,0.18);
  --shadow: 0 12px 32px rgba(0,0,0,0.55);
}

html, body {
  margin:0;
  padding:0;
  height:100%;
  background: var(--bg);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  color: var(--text);
  overflow: hidden;
  background-image: 
    radial-gradient(circle at 20% 30%, rgba(123,47,255,0.08) 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(200,100,255,0.06) 0%, transparent 45%);
}

#map {
  width: 100%;
  height: 100%;
  touch-action: none;
}

#viewport {
  transition: transform 0.14s cubic-bezier(0.16, 1, 0.3, 1);
  will-change: transform;
}

.node {
  rx: 18;
  ry: 18;
  stroke: none;
  filter: drop-shadow(var(--shadow));
  transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.node:hover {
  transform: translateY(-12px) scale(1.04);
  filter: drop-shadow(0 24px 48px rgba(0,0,0,0.65)) brightness(1.12);
}

.node.category {
  fill: url(#cat-grad);
}

.node.section {
  fill: url(#sec-grad);
}

.node.page {
  fill: url(#page-grad);
  cursor: pointer;
}

.node.page:hover {
  filter: drop-shadow(0 16px 40px rgba(123,47,255,0.45));
}

.label {
  font-weight: 600;
  font-size: 15px;
  fill: var(--text);
  text-shadow: 0 2px 8px rgba(0,0,0,0.7);
  pointer-events: none;
  letter-spacing: 0.3px;
}

.label.category   { font-size: 18px; font-weight: 700; }
.label.section    { font-size: 15.5px; fill: var(--text-light); }
.label.page       { font-size: 13.8px; fill: #d9ccff; }

.link {
  stroke: var(--line);
  stroke-width: 2.2;
  stroke-linecap: round;
  opacity: 0.7;
  transition: stroke 0.4s ease, opacity 0.4s ease;
}

.node:hover ~ .link,
.link:hover {
  stroke: var(--accent);
  opacity: 0.95;
}

.fade-in {
  opacity: 0;
  transform: translateY(30px) scale(0.92);
  animation: appear 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

@keyframes appear {
  to { opacity:1; transform:none; }
}

.hint {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(20,10,50,0.65);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: #d0c0ff;
  padding: 10px 24px;
  border-radius: 50px;
  font-size: 14px;
  border: 1px solid rgba(123,47,255,0.25);
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  pointer-events: none;
}
</style>
</head>
<body>

<svg id="map">
  <defs>
    <linearGradient id="cat-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7b2fff"/>
      <stop offset="100%" stop-color="#5e22cc"/>
    </linearGradient>
    
    <linearGradient id="sec-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25144a"/>
      <stop offset="100%" stop-color="#1a0f33"/>
    </linearGradient>
    
    <linearGradient id="page-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c1a5c"/>
      <stop offset="100%" stop-color="#1e1242"/>
    </linearGradient>
  </defs>

  <g id="viewport"></g>
</svg>

<div class="hint">Drag • Pinch/Scroll to Zoom • Click pages to visit</div>

<script>
// ────────────────────────────────────────────────
const svg = document.getElementById("map");
const viewport = document.getElementById("viewport");

let scale = 1;
let panX = 60;
let panY = 60;
let isPanning = false;
let startX, startY;
let velocityX = 0, velocityY = 0;
let lastPanX, lastPanY;

// ─── Core update ────────────────────────────────
function update() {
  viewport.setAttribute("transform", `translate(${panX},${panY}) scale(${scale})`);
}

// ─── Inertia ────────────────────────────────────
const friction = 0.93;
function inertia() {
  if (Math.abs(velocityX) < 0.15 && Math.abs(velocityY) < 0.15) return;
  
  panX += velocityX;
  panY += velocityY;
  velocityX *= friction;
  velocityY *= friction;
  
  update();
  requestAnimationFrame(inertia);
}

// ─── Wheel Zoom ─────────────────────────────────
svg.addEventListener("wheel", e => {
  e.preventDefault();
  const rect = svg.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / scale - panX / scale;
  const my = (e.clientY - rect.top)  / scale - panY / scale;

  const delta = Math.exp(-e.deltaY * 0.0008);
  scale = Math.min(Math.max(0.3, scale * delta), 4.2);

  panX = e.clientX - rect.left - mx * scale;
  panY = e.clientY - rect.top  - my * scale;

  update();
}, { passive: false });

// ─── Pan ────────────────────────────────────────
svg.addEventListener("pointerdown", e => {
  isPanning = true;
  startX = e.clientX - panX;
  startY = e.clientY - panY;
  velocityX = velocityY = 0;
  lastPanX = panX; lastPanY = panY;
  svg.setPointerCapture(e.pointerId);
  svg.style.cursor = "grabbing";
});

svg.addEventListener("pointerup", () => {
  isPanning = false;
  svg.style.cursor = "grab";
  if (Math.abs(velocityX) > 0.8 || Math.abs(velocityY) > 0.8) {
    inertia();
  }
});

svg.addEventListener("pointermove", e => {
  if (!isPanning) return;
  velocityX = (e.clientX - panX) - lastPanX;
  velocityY = (e.clientY - panY) - lastPanY;
  lastPanX = panX = e.clientX - startX;
  lastPanY = panY = e.clientY - startY;
  update();
});

// ─── Pinch Zoom (mobile) ────────────────────────
let initialDist = 0, initialScale = 1, initialPanX, initialPanY;

svg.addEventListener("touchstart", e => {
  if (e.touches.length === 2) {
    initialDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    initialScale = scale;
    initialPanX = panX;
    initialPanY = panY;
  }
});

svg.addEventListener("touchmove", e => {
  if (e.touches.length !== 2) return;
  e.preventDefault();

  const currDist = Math.hypot(
    e.touches[0].clientX - e.touches[1].clientX,
    e.touches[0].clientY - e.touches[1].clientY
  );

  const factor = currDist / initialDist;
  scale = Math.min(Math.max(0.3, initialScale * factor), 4.2);

  const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
  const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
  const rect = svg.getBoundingClientRect();

  panX = initialPanX + (midX - rect.left) * (1 - factor);
  panY = initialPanY + (midY - rect.top)  * (1 - factor);

  update();
});

// ─── Sitemap Rendering ──────────────────────────
fetch("sitemap.json")
  .then(r => r.json())
  .then(data => {
    let colX = 120;
    const colGap = 580;

    data.forEach((category, catIdx) => {
      const catY = 140;
      node(colX, catY, 340, 90, category.icon + "  " + category.category, "category", catIdx * 0.08);

      let sectionY = catY + 180;

      category.sections.forEach((section, secIdx) => {
        // Vertical line from category → section
        line(colX + 170, catY + 90, colX + 170, sectionY - 30);

        const secNode = node(colX, sectionY, 340, 76, section.title, "section", (catIdx + secIdx) * 0.1);

        let leftY = sectionY + 110;
        let rightY = sectionY + 110;

        section.pages.forEach((page, pageIdx) => {
          const isLeft = pageIdx % 2 === 0;

          const pageX = isLeft ? colX - 400 : colX + 740;
          const pageY = isLeft ? leftY : rightY;

          // Connect line
          line(
            colX + (isLeft ? 0 : 340),
            (isLeft ? leftY : rightY) + 25,
            pageX + (isLeft ? 320 : 0),
            pageY + 25
          );

          const pageGroup = node(pageX, pageY, 320, 64, page.name, "page", (catIdx + secIdx + pageIdx) * 0.08);
          pageGroup.style.cursor = "pointer";
          pageGroup.addEventListener("click", () => window.open(page.url, "_blank"));

          if (isLeft) leftY += 92;
          else        rightY += 92;
        });

        sectionY = Math.max(leftY, rightY) + 60;
      });

      colX += colGap;
    });

    update();
  })
  .catch(err => console.error("Failed to load sitemap.json", err));

// ─── Helpers ────────────────────────────────────
function node(x, y, w, h, text, type, animDelay = 0) {
  const g = svgEl("g");
  g.classList.add("fade-in");
  g.style.animationDelay = (animDelay * 1000) + "ms";

  const r = svgEl("rect");
  r.setAttribute("x", x);
  r.setAttribute("y", y);
  r.setAttribute("width", w);
  r.setAttribute("height", h);
  r.classList.add("node", type);

  const t = svgEl("text");
  t.setAttribute("x", x + 24);
  t.setAttribute("y", y + h/2 + 2);
  t.classList.add("label", type);
  t.textContent = text;

  g.append(r, t);
  viewport.appendChild(g);
  return g;
}

function line(x1,y1,x2,y2) {
  const l = svgEl("line");
  l.setAttribute("x1", x1);
  l.setAttribute("y1", y1);
  l.setAttribute("x2", x2);
  l.setAttribute("y2", y2);
  l.classList.add("link");
  viewport.appendChild(l);
}

function svgEl(tag) {
  return document.createElementNS("http://www.w3.org/2000/svg", tag);
}
</script>
</body>
</html>
