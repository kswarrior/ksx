<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KS Visual Sitemap</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
html,body{
  margin:0;
  height:100%;
  background:#000;
  overflow:hidden;
  font-family:system-ui,-apple-system,sans-serif;
}

#map{
  width:100%;
  height:100%;
  cursor:grab;
}

.node{
  fill:#12121c;
  stroke:rgba(255,255,255,.15);
  stroke-width:1.2;
  rx:12;
}

.node.category{ fill:#1f1f35 }
.node.section{ fill:#191928 }
.node.page{ fill:#12121c }

.label{
  fill:#fff;
  font-size:13px;
  font-weight:700;
  pointer-events:none;
}

.link{
  stroke:rgba(255,255,255,.15);
  stroke-width:1;
}

.node:hover{
  fill:#2b2b45;
}
</style>
</head>

<body>

<svg id="map">
  <g id="viewport"></g>
</svg>

<script>
const svg = document.getElementById("map");
const viewport = document.getElementById("viewport");

let scale = 1;
let panX = 0;
let panY = 0;
let isPanning = false;
let startX, startY;

svg.addEventListener("wheel", e => {
  e.preventDefault();
  scale += e.deltaY * -0.001;
  scale = Math.min(Math.max(.4, scale), 2.5);
  updateTransform();
});

svg.addEventListener("mousedown", e=>{
  isPanning = true;
  startX = e.clientX - panX;
  startY = e.clientY - panY;
  svg.style.cursor = "grabbing";
});

svg.addEventListener("mouseup", ()=>{
  isPanning = false;
  svg.style.cursor = "grab";
});

svg.addEventListener("mousemove", e=>{
  if(!isPanning) return;
  panX = e.clientX - startX;
  panY = e.clientY - startY;
  updateTransform();
});

function updateTransform(){
  viewport.setAttribute("transform", `translate(${panX},${panY}) scale(${scale})`);
}

fetch("sitemap.json")
.then(r=>r.json())
.then(data=>{
  let x = 100;
  let y = 100;
  const gapX = 340;
  const gapY = 140;

  data.forEach(cat=>{
    const catNode = createNode(x,y,220,60,cat.icon+" "+cat.category,"category");

    let sy = y + 120;

    cat.sections.forEach(sec=>{
      drawLine(x+110,y+60,x+110,sy);
      const secNode = createNode(x,sy,220,52,sec.title,"section");

      let py = sy + 100;

      sec.pages.forEach(p=>{
        drawLine(x+110,sy+52,x+360,py+26);
        const pageNode = createNode(x+360,py,260,46,p.name,"page");
        pageNode.addEventListener("click",()=>location.href=p.url);
        py += 70;
      });

      sy += gapY + sec.pages.length*60;
    });

    x += gapX;
  });

  updateTransform();
});

function createNode(x,y,w,h,text,type){
  const g = document.createElementNS("http://www.w3.org/2000/svg","g");

  const r = document.createElementNS("http://www.w3.org/2000/svg","rect");
  r.setAttribute("x",x);
  r.setAttribute("y",y);
  r.setAttribute("width",w);
  r.setAttribute("height",h);
  r.setAttribute("class","node "+type);

  const t = document.createElementNS("http://www.w3.org/2000/svg","text");
  t.setAttribute("x",x+14);
  t.setAttribute("y",y+h/2+5);
  t.setAttribute("class","label");
  t.textContent = text;

  g.appendChild(r);
  g.appendChild(t);
  viewport.appendChild(g);
  return g;
}

function drawLine(x1,y1,x2,y2){
  const l = document.createElementNS("http://www.w3.org/2000/svg","line");
  l.setAttribute("x1",x1);
  l.setAttribute("y1",y1);
  l.setAttribute("x2",x2);
  l.setAttribute("y2",y2);
  l.setAttribute("class","link");
  viewport.appendChild(l);
}
</script>

</body>
</html>
