<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Site Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background:
    radial-gradient(circle at top, #0e0e1a, #050508);
  color: #e8e8f0;
  font-family: system-ui, sans-serif;
  overflow-x: hidden;
}

h1 {
  text-align: center;
  padding: 40px 20px;
  font-size: 2.6rem;
  letter-spacing: 2px;
  color: #7f7fff;
}

.map {
  max-width: 1200px;
  margin: auto;
  padding-bottom: 60px;
}

.category {
  position: relative;
  margin: 60px 0;
  padding-left: 40px;
}

.category::before {
  content: "";
  position: absolute;
  left: 12px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: linear-gradient(#7f7fff, transparent);
}

.category-title {
  font-size: 1.8rem;
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 30px;
}

.category-title span {
  font-size: 2.2rem;
}

.section {
  margin-left: 40px;
  margin-bottom: 30px;
  position: relative;
}

.section::before {
  content: "";
  position: absolute;
  left: -28px;
  top: 10px;
  width: 20px;
  height: 2px;
  background: #4a4aff;
}

.section-title {
  font-size: 1.1rem;
  color: #9a9aff;
  margin-bottom: 10px;
}

.pages {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

.page {
  position: relative;
  padding: 10px 16px;
  background: rgba(20,20,40,0.6);
  border: 1px solid rgba(120,120,255,0.25);
  border-radius: 999px;
  text-decoration: none;
  color: #fff;
  font-size: 0.9rem;
  display: flex;
  align-items: center;
  gap: 8px;
  backdrop-filter: blur(6px);
  transition: all .25s ease;
}

.page img {
  width: 20px;
  height: 20px;
  border-radius: 4px;
}

.page::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  box-shadow: 0 0 0 rgba(127,127,255,0);
  transition: box-shadow .25s ease;
}

.page:hover {
  transform: translateY(-2px);
}

.page:hover::after {
  box-shadow: 0 0 20px rgba(127,127,255,0.7);
}

footer {
  text-align: center;
  color: #888;
  padding-bottom: 30px;
}
</style>
</head>

<body>

<h1>🌌 Network Map</h1>
<div class="map" id="map"></div>

<footer>KS Warrior • Neural Sitemap</footer>

<script>
fetch("sitemap.json")
  .then(r => r.json())
  .then(data => {
    const map = document.getElementById("map");

    data.forEach(cat => {
      const catDiv = document.createElement("div");
      catDiv.className = "category";

      catDiv.innerHTML = `
        <div class="category-title">
          <span>${cat.icon}</span>
          ${cat.category}
        </div>
      `;

      cat.sections.forEach(sec => {
        const secDiv = document.createElement("div");
        secDiv.className = "section";

        secDiv.innerHTML = `<div class="section-title">${sec.title}</div>`;

        const pages = document.createElement("div");
        pages.className = "pages";

        sec.pages.forEach(p => {
          const a = document.createElement("a");
          a.className = "page";
          a.href = p.url;
          a.innerHTML = `
            <img src="${p.logo}">
            ${p.name}
          `;
          pages.appendChild(a);
        });

        secDiv.appendChild(pages);
        catDiv.appendChild(secDiv);
      });

      map.appendChild(catDiv);
    });
  });
</script>

</body>
</html>
