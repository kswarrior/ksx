<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KS Visual Sitemap</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg: #0a0a1f;
  --category: #3a3aff;
  --category-gradient: linear-gradient(135deg, #3a3aff, #2a2acc);
  --section: #1f1f3d;
  --section-gradient: linear-gradient(135deg, #1f1f3d, #15152b);
  --page: #121224;
  --page-gradient: linear-gradient(135deg, #121224, #0a0a18);
  --text: #ffffff;
  --line: rgba(255,255,255,.15);
  --shadow: rgba(0,0,0,.3);
  --highlight: rgba(255,255,255,.1);
}

/* Reset & body */
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:var(--bg);
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  overflow:hidden;
}

/* SVG container */
#map{
  width:100%;
  height:100%;
  touch-action:none;
  cursor:grab;
}

/* General node */
.node{
  rx:16;
  ry:16;
  stroke:none;
  transition: transform .3s ease-out, filter .3s ease;
  filter: drop-shadow(0 4px 8px var(--shadow));
}

/* Hover effect */
.node:hover{
  transform: translateY(-2px) scale(1.02);
  filter: drop-shadow(0 6px 12px var(--shadow)) brightness(1.05);
}

/* Category node style */
.node.category{
  fill: url(#category-gradient);
}

/* Section node style */
.node.section{
  fill: url(#section-gradient);
}

/* Page node style */
.node.page{
  fill: url(#page-gradient);
}

/* Labels */
.label{
  font-weight:600;
  font-size:14px;
  fill:var(--text);
  pointer-events:none;
  text-shadow:0 1px 2px var(--shadow);
  dominant-baseline: middle;
}

/* Links */
.link{
  stroke:var(--line);
  stroke-width:1.5;
  stroke-linecap: round;
  stroke-dasharray: 3 3;
  transition: stroke .2s ease;
}

/* Animations */
.fade-in{
  opacity:0;
  animation:fadeIn .8s ease-out forwards;
}

@keyframes fadeIn{
  from{ opacity:0; transform:translateY(12px) scale(.95);}
  to{ opacity:1; transform:translateY(0) scale(1);}
}

/* Hint */
.hint{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.4);
  color:#ddd;
  padding:6px 16px;
  border-radius:20px;
  font-size:13px;
  pointer-events:none;
  opacity:0.8;
}

/* Optimistic hover effects for mobile */
@media (hover: none){
  .node:hover{ transform:none; filter: drop-shadow(0 4px 8px var(--shadow)); }
}

/* Smooth transitions */
#viewport{
  transition: transform 0.1s ease-out;
}
</style>
</head>

<body>

<svg id="map">
  <defs>
    <linearGradient id="category-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3a3aff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a2acc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="section-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f1f3d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#15152b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="page-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#121224;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a18;stop-opacity:1" />
    </linearGradient>
  </defs>
  <g id="viewport"></g>
</svg>

<div class="hint">Drag • Pinch to Zoom • Tap pages</div>

<script>
const svg = document.getElementById("map");
const viewport = document.getElementById("viewport");

let scale = 1;
let panX = 40;
let panY = 40;
let isPanning = false;
let startX, startY;
let velocityX = 0;
let velocityY = 0;
let lastPanX, lastPanY;
let animationFrame;

// Inertia settings
const friction = 0.92;
const minVelocity = 0.1;

// Update function with requestAnimationFrame
function update() {
  if (animationFrame) cancelAnimationFrame(animationFrame);
  animationFrame = requestAnimationFrame(() => {
    viewport.setAttribute(
      "transform",
      `translate(${panX},${panY}) scale(${scale})`
    );
  });
}

// Inertia animation
function applyInertia() {
  if (Math.abs(velocityX) < minVelocity && Math.abs(velocityY) < minVelocity) return;

  panX += velocityX;
  panY += velocityY;
  velocityX *= friction;
  velocityY *= friction;

  update();
  requestAnimationFrame(applyInertia);
}

/* zoom */
svg.addEventListener("wheel", e => {
  e.preventDefault();

  const rect = svg.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / scale - panX / scale;
  const my = (e.clientY - rect.top) / scale - panY / scale;

  const zoomIntensity = 0.12;
  const delta = Math.exp((e.deltaY > 0 ? -1 : 1) * zoomIntensity);

  const newScale = Math.min(Math.max(0.25, scale * delta), 4);

  panX = (e.clientX - rect.left) - mx * newScale;
  panY = (e.clientY - rect.top) - my * newScale;

  scale = newScale;
  update();
}, { passive: false });

/* pan */
svg.addEventListener("pointerdown", e => {
  isPanning = true;
  startX = e.clientX - panX;
  startY = e.clientY - panY;
  velocityX = 0;
  velocityY = 0;
  lastPanX = panX;
  lastPanY = panY;
  svg.setPointerCapture(e.pointerId);
  svg.style.cursor = "grabbing";
});

svg.addEventListener("pointerup", e => {
  isPanning = false;
  svg.style.cursor = "grab";

  // Calculate velocity
  velocityX = panX - lastPanX;
  velocityY = panY - lastPanY;

  if (Math.abs(velocityX) > minVelocity || Math.abs(velocityY) > minVelocity) {
    applyInertia();
  }
});

svg.addEventListener("pointermove", e => {
  if (!isPanning) return;
  lastPanX = panX;
  lastPanY = panY;
  panX = e.clientX - startX;
  panY = e.clientY - startY;
  update();
});

// Touch pinch zoom
let initialDistance = 0;
let initialScale = 1;
let initialPanX = 0;
let initialPanY = 0;

svg.addEventListener("touchstart", e => {
  if (e.touches.length === 2) {
    isPanning = false;
    initialDistance = getTouchDistance(e.touches);
    initialScale = scale;
    initialPanX = panX;
    initialPanY = panY;
  }
});

svg.addEventListener("touchmove", e => {
  if (e.touches.length === 2) {
    e.preventDefault();
    const currentDistance = getTouchDistance(e.touches);
    const zoomFactor = currentDistance / initialDistance;
    scale = initialScale * zoomFactor;

    // Center zoom between fingers
    const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    const rect = svg.getBoundingClientRect();
    panX = initialPanX + (midX - rect.left) * (1 - zoomFactor);
    panY = initialPanY + (midY - rect.top) * (1 - zoomFactor);

    update();
  }
});

function getTouchDistance(touches) {
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.sqrt(dx * dx + dy * dy);
}

/* load sitemap */
fetch("sitemap.json")
  .then(r => r.json())
  .then(data => {
    let x = 100;
    const gapX = 480;

    data.forEach((cat, ci) => {
      let y = 100;

      const catNode = node(x, y, 280, 70, cat.icon + " " + cat.category, "category", ci);

      let sy = y + 150;

      cat.sections.forEach((sec, si) => {
        line(x + 140, y + 70, x + 140, sy);

        const secNode = node(x, sy, 280, 60, sec.title, "section", ci + si);

        let py = sy + 100;

        sec.pages.forEach((p, pi) => {
          line(x + 140, sy + 60, x + 440, py + 25);

          const page = node(x + 440, py, 320, 50, p.name, "page", ci + si + pi);
          page.style.cursor = "pointer";
          page.addEventListener("click", () => location.href = p.url);

          py += 76;
        });

        sy = py + 30;
      });

      x += gapX;
    });

    update();
  });

/* helpers */
function node(x, y, w, h, text, type, delay) {
  const g = svgEl("g");
  g.classList.add("fade-in");
  g.style.animationDelay = delay * 50 + "ms";

  const r = svgEl("rect");
  r.setAttribute("x", x);
  r.setAttribute("y", y);
  r.setAttribute("width", w);
  r.setAttribute("height", h);
  r.setAttribute("class", "node " + type);

  const t = svgEl("text");
  t.setAttribute("x", x + 20);
  t.setAttribute("y", y + h / 2);
  t.setAttribute("class", "label");
  t.textContent = text;

  g.append(r, t);
  viewport.appendChild(g);
  return g;
}

function line(x1, y1, x2, y2) {
  const l = svgEl("line");
  l.setAttribute("x1", x1);
  l.setAttribute("y1", y1);
  l.setAttribute("x2", x2);
  l.setAttribute("y2", y2);
  l.setAttribute("class", "link");
  viewport.appendChild(l);
}

function svgEl(n) {
  return document.createElementNS("http://www.w3.org/2000/svg", n);
}
</script>

</body>
</html>
