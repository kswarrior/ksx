<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Website Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --bg: #0b0b0f;
      --card: #12121a;
      --border: #1f1f2e;
      --text: #eaeaf0;
      --muted: #a1a1b3;
      --accent: #7c7cff;
      --hover: #9b9bff;
    }

    * {
      box-sizing: border-box;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at top, #12121a, #07070a);
      color: var(--text);
      padding: 30px;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
      font-size: 2.4rem;
      letter-spacing: 1px;
      color: var(--accent);
    }

    .category {
      margin-bottom: 40px;
    }

    .category-header {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.8rem;
      margin-bottom: 20px;
    }

    .icon {
      font-size: 2rem;
    }

    .sections {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .section {
      background: linear-gradient(180deg, var(--card), #0c0c14);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .section:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 40px rgba(0,0,0,0.8);
    }

    .section-title {
      font-size: 1.1rem;
      margin-bottom: 12px;
      color: var(--hover);
      border-bottom: 1px dashed var(--border);
      padding-bottom: 6px;
    }

    .page {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      border-radius: 10px;
      text-decoration: none;
      color: var(--text);
      transition: background .2s ease;
    }

    .page:hover {
      background: rgba(124,124,255,0.1);
    }

    .page img {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: #000;
      object-fit: cover;
    }

    .page-name {
      font-size: 0.95rem;
    }

    footer {
      text-align: center;
      margin-top: 60px;
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <h1>🌐 Website Map</h1>

  <div id="map"></div>

  <footer>
    © 2026 • KS Warrior • Site Map
  </footer>

  <script>
    fetch("sitemap.json")
      .then(res => res.json())
      .then(data => renderMap(data))
      .catch(err => {
        document.getElementById("map").innerHTML =
          "<p style='color:red;text-align:center'>Failed to load sitemap.json</p>";
        console.error(err);
      });

    function renderMap(data) {
      const container = document.getElementById("map");

      data.forEach(category => {
        const catDiv = document.createElement("div");
        catDiv.className = "category";

        catDiv.innerHTML = `
          <div class="category-header">
            <span class="icon">${category.icon}</span>
            <span>${category.category}</span>
          </div>
        `;

        const sectionsDiv = document.createElement("div");
        sectionsDiv.className = "sections";

        category.sections.forEach(section => {
          const secDiv = document.createElement("div");
          secDiv.className = "section";

          secDiv.innerHTML = `
            <div class="section-title">${section.title}</div>
          `;

          section.pages.forEach(page => {
            const a = document.createElement("a");
            a.className = "page";
            a.href = page.url;

            a.innerHTML = `
              <img src="${page.logo}" alt="">
              <span class="page-name">${page.name}</span>
            `;

            secDiv.appendChild(a);
          });

          sectionsDiv.appendChild(secDiv);
        });

        catDiv.appendChild(sectionsDiv);
        container.appendChild(catDiv);
      });
    }
  </script>

</body>
</html>
