<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KS Solar Sitemap</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#02040b;
  --sun:#ffb703;
  --planet:#6d7cff;
  --moon:#ffffff;
  --orbit:rgba(255,255,255,.08);
}

*{box-sizing:border-box}

body{
  margin:0;
  overflow:hidden;
  background:radial-gradient(circle at center,#080c22,#02040b);
  font-family:system-ui;
  color:white;
}

/* MAP */
#map{
  width:100vw;
  height:100vh;
  position:relative;
  touch-action:none;
}
#world{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(1);
  transform-origin:0 0;
}

/* SYSTEM */
.system{
  position:absolute;
}

/* SUN (CATEGORY) */
.sun{
  width:160px;
  height:160px;
  border-radius:50%;
  background:radial-gradient(circle,#ffd166,#ff9f1c);
  box-shadow:0 0 60px rgba(255,183,3,.9);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-weight:900;
  font-size:18px;
}

/* PLANET ORBIT */
.planet-orbit{
  position:absolute;
  border:1px dashed var(--orbit);
  border-radius:50%;
}

/* PLANET */
.planet{
  position:absolute;
  width:70px;
  height:70px;
  border-radius:50%;
  background:radial-gradient(circle,#8b9cff,#4a5cff);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:12px;
  font-weight:700;
  box-shadow:0 0 25px rgba(109,124,255,.8);
}

/* MOON ORBIT */
.moon-orbit{
  position:absolute;
  border:1px dotted rgba(255,255,255,.15);
  border-radius:50%;
}

/* MOON */
.moon{
  position:absolute;
  width:12px;
  height:12px;
  border-radius:50%;
  background:var(--moon);
  box-shadow:0 0 10px white;
  cursor:pointer;
}
.moon:hover{
  transform:scale(1.8);
  box-shadow:0 0 20px var(--planet);
}

/* LABELS */
.label{
  position:absolute;
  top:16px;
  left:16px;
  font-size:11px;
  white-space:nowrap;
  opacity:.85;
}

/* MOTION */
.spin-slow{animation:spin 60s linear infinite}
.spin-mid{animation:spin 40s linear infinite}
.spin-fast{animation:spin 25s linear infinite}

@keyframes spin{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}
</style>
</head>

<body>

<div id="map">
  <div id="world"></div>
</div>

<script>
const world=document.getElementById("world");
let scale=1,dx=0,dy=0,startX,startY,drag=false;

/* PAN */
map.onmousedown=e=>{drag=true;startX=e.clientX-dx;startY=e.clientY-dy;}
window.onmouseup=()=>drag=false;
window.onmousemove=e=>{
  if(!drag)return;
  dx=e.clientX-startX;
  dy=e.clientY-startY;
  update();
};

/* TOUCH */
map.ontouchstart=e=>{
  drag=true;
  startX=e.touches[0].clientX-dx;
  startY=e.touches[0].clientY-dy;
};
map.ontouchend=()=>drag=false;
map.ontouchmove=e=>{
  if(!drag)return;
  dx=e.touches[0].clientX-startX;
  dy=e.touches[0].clientY-startY;
  update();
};

/* ZOOM */
map.onwheel=e=>{
  e.preventDefault();
  scale+=e.deltaY*-0.001;
  scale=Math.min(Math.max(.4,scale),2);
  update();
};

function update(){
  world.style.transform=`translate(${dx}px,${dy}px) scale(${scale})`;
}

/* LOAD DATA */
fetch("sitemap.json")
.then(r=>r.json())
.then(build);

function build(data){
  let offsetX=0;

  data.forEach(cat=>{
    const sys=document.createElement("div");
    sys.className="system";
    sys.style.left=offsetX+"px";
    sys.style.top="0px";

    /* SUN */
    const sun=document.createElement("div");
    sun.className="sun";
    sun.innerHTML=cat.icon+"<br>"+cat.category;
    sys.appendChild(sun);

    cat.sections.forEach((sec,i)=>{
      const orbitSize=300+i*180;

      /* PLANET ORBIT */
      const pOrbit=document.createElement("div");
      pOrbit.className="planet-orbit spin-slow";
      pOrbit.style.width=orbitSize+"px";
      pOrbit.style.height=orbitSize+"px";
      pOrbit.style.left=80-orbitSize/2+"px";
      pOrbit.style.top=80-orbitSize/2+"px";

      /* PLANET */
      const planet=document.createElement("div");
      planet.className="planet";
      planet.style.left=orbitSize/2-35+"px";
      planet.style.top="-35px";
      planet.textContent=sec.title;

      /* MOON ORBITS */
      sec.pages.forEach((p,j)=>{
        const mOrbitSize=90+(j*40);
        const mOrbit=document.createElement("div");
        mOrbit.className="moon-orbit spin-fast";
        mOrbit.style.width=mOrbitSize+"px";
        mOrbit.style.height=mOrbitSize+"px";
        mOrbit.style.left=35-mOrbitSize/2+"px";
        mOrbit.style.top=35-mOrbitSize/2+"px";

        const moon=document.createElement("div");
        moon.className="moon";
        moon.style.left=mOrbitSize/2-6+"px";
        moon.style.top="-6px";
        moon.onclick=()=>location.href=p.url;

        const label=document.createElement("div");
        label.className="label";
        label.textContent=p.name;
        moon.appendChild(label);

        mOrbit.appendChild(moon);
        planet.appendChild(mOrbit);
      });

      pOrbit.appendChild(planet);
      sys.appendChild(pOrbit);
    });

    world.appendChild(sys);
    offsetX+=1000;
  });
}
</script>

</body>
</html>
