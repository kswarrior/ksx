<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KS Sitemap</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#000;
  --card:rgba(18,18,28,.9);
  --soft:rgba(28,28,40,.9);
  --hover:rgba(40,40,55,.95);
  --text:#fff;
  --muted:#aaa;
  --border:rgba(255,255,255,.12);
  --radius:14px;
  --gap:28px;
  --transition:.45s cubic-bezier(.22,1,.36,1);
}

*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,sans-serif;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:32px 16px;
}

h1{
  font-size:28px;
  font-weight:900;
}

.category{
  margin-top:50px;
}

.category-title{
  font-size:22px;
  font-weight:900;
  display:flex;
  align-items:center;
  gap:10px;
}

.section{
  margin-top:22px;
}

.section-title{
  font-size:15px;
  color:var(--muted);
  margin-bottom:12px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.08em;
}

.page-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:var(--gap);
}

.page-card{
  background:var(--card);
  padding:18px;
  border-radius:var(--radius);
  border:1px solid var(--border);
  cursor:pointer;
  transition:all var(--transition);
}
.page-card:hover{
  background:var(--hover);
  transform:translateY(-6px) scale(1.04);
}

.page-name{
  font-size:15px;
  font-weight:800;
}
.page-url{
  margin-top:6px;
  font-size:11px;
  color:#777;
  word-break:break-all;
}
</style>
</head>

<body>
<div class="container">
  <h1>🗺 KS Website Sitemap</h1>

  <div id="sitemap"></div>
</div>

<script>
fetch("sitemap.json")
.then(r=>r.json())
.then(data=>{
  const root = document.getElementById("sitemap");

  data.forEach(cat=>{
    const c = document.createElement("div");
    c.className = "category";
    c.innerHTML = `
      <div class="category-title">${cat.icon} ${cat.category}</div>
    `;

    cat.sections.forEach(sec=>{
      const s = document.createElement("div");
      s.className = "section";
      s.innerHTML = `<div class="section-title">${sec.title}</div>`;

      const grid = document.createElement("div");
      grid.className = "page-grid";

      sec.pages.forEach(p=>{
        const card = document.createElement("div");
        card.className = "page-card";
        card.onclick = ()=>location.href=p.url;
        card.innerHTML = `
          <div class="page-name">${p.name}</div>
          <div class="page-url">${p.url}</div>
        `;
        grid.appendChild(card);
      });

      s.appendChild(grid);
      c.appendChild(s);
    });

    root.appendChild(c);
  });
});
</script>
</body>
</html>
