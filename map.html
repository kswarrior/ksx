<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KS Solar Sitemap</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#02040b;
  --sun:#ffb703;
  --planet:#6d7cff;
  --moon:#ffffff;
  --orbit:rgba(255,255,255,.14);
}

*{box-sizing:border-box}

body{
  margin:0;
  overflow:hidden;
  background:radial-gradient(circle at center,#0b1030,#02040b);
  font-family:system-ui;
  color:#fff;
}

/* MAP */
#map{
  width:100vw;
  height:100vh;
  position:relative;
  touch-action:none;
}

#world{
  position:absolute;
  left:50%;
  top:50%;
  transform-origin:0 0;
}

/* SYSTEM */
.system{
  position:absolute;
}

/* SUN */
.sun{
  width:220px;
  height:220px;
  border-radius:50%;
  background:radial-gradient(circle,#ffd166,#ff9f1c);
  box-shadow:0 0 90px rgba(255,183,3,.9);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-weight:900;
  font-size:20px;
}

/* ORBITS */
.orbit{
  position:absolute;
  border-radius:50%;
  border:1px dashed var(--orbit);
  animation:spin linear infinite;
}

.spin-slow{ animation-duration:80s }
.spin-mid{ animation-duration:50s }
.spin-fast{ animation-duration:30s }

/* PLANET */
.planet{
  position:absolute;
  width:120px;
  height:120px;
  border-radius:50%;
  background:radial-gradient(circle,#9aa8ff,#4a5cff);
  box-shadow:0 0 40px rgba(109,124,255,.9);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:13px;
  font-weight:800;
  padding:10px;
}

/* MOON */
.moon{
  position:absolute;
  width:46px;
  height:46px;
  border-radius:50%;
  background:radial-gradient(circle,#fff,#ccc);
  box-shadow:0 0 14px white;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:9px;
  font-weight:700;
  padding:4px;
}
.moon:hover{
  transform:scale(1.3);
  box-shadow:0 0 26px var(--planet);
}

/* ANIMATION */
@keyframes spin{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}
</style>
</head>

<body>

<div id="map">
  <div id="world"></div>
</div>

<script>
const map = document.getElementById("map");
const world = document.getElementById("world");

/* CAMERA */
let scale = 0.4;
let dx = 0, dy = 0;
let dragging = false;
let sx = 0, sy = 0;
let lastDist = null;

function update(){
  world.style.transform =
    `translate(${dx}px,${dy}px) scale(${scale})`;
}

/* DRAG */
map.addEventListener("mousedown",e=>{
  dragging=true;
  sx=e.clientX-dx;
  sy=e.clientY-dy;
});
window.addEventListener("mouseup",()=>dragging=false);
window.addEventListener("mousemove",e=>{
  if(!dragging)return;
  dx=e.clientX-sx;
  dy=e.clientY-sy;
  update();
});

/* TOUCH DRAG */
map.addEventListener("touchstart",e=>{
  if(e.touches.length===1){
    sx=e.touches[0].clientX-dx;
    sy=e.touches[0].clientY-dy;
  }
});
map.addEventListener("touchmove",e=>{
  if(e.touches.length===1){
    dx=e.touches[0].clientX-sx;
    dy=e.touches[0].clientY-sy;
    update();
  }
  if(e.touches.length===2){
    e.preventDefault();
    const dxT=e.touches[0].clientX-e.touches[1].clientX;
    const dyT=e.touches[0].clientY-e.touches[1].clientY;
    const dist=Math.hypot(dxT,dyT);
    if(lastDist){
      scale+=(dist-lastDist)*0.002;
      scale=Math.min(Math.max(.25,scale),2);
      update();
    }
    lastDist=dist;
  }
},{passive:false});
map.addEventListener("touchend",()=>lastDist=null);

/* WHEEL ZOOM */
map.addEventListener("wheel",e=>{
  e.preventDefault();
  scale+=e.deltaY*-0.001;
  scale=Math.min(Math.max(.25,scale),2);
  update();
},{passive:false});

/* LOAD DATA */
fetch("sitemap.json")
.then(r=>r.json())
.then(build);

function build(data){
  const spacing = 1800;
  let x = -(data.length-1)*spacing/2;

  data.forEach(cat=>{
    const sys=document.createElement("div");
    sys.className="system";
    sys.style.left=x+"px";
    sys.style.top="0px";

    const sun=document.createElement("div");
    sun.className="sun";
    sun.innerHTML=`${cat.icon}<br>${cat.category}`;
    sys.appendChild(sun);

    cat.sections.forEach((sec,i)=>{
      const size=420+i*260;

      const orbit=document.createElement("div");
      orbit.className="orbit spin-slow";
      orbit.style.width=size+"px";
      orbit.style.height=size+"px";
      orbit.style.left=110-size/2+"px";
      orbit.style.top=110-size/2+"px";

      const planet=document.createElement("div");
      planet.className="planet";
      planet.textContent=sec.title;
      planet.style.left=size/2-60+"px";
      planet.style.top="-60px";

      sec.pages.forEach((p,j)=>{
        const mSize=140+j*90;

        const mOrbit=document.createElement("div");
        mOrbit.className="orbit spin-fast";
        mOrbit.style.width=mSize+"px";
        mOrbit.style.height=mSize+"px";
        mOrbit.style.left=60-mSize/2+"px";
        mOrbit.style.top=60-mSize/2+"px";

        const moon=document.createElement("div");
        moon.className="moon";
        moon.textContent=p.name;
        moon.style.left=mSize/2-23+"px";
        moon.style.top="-23px";
        moon.onclick=()=>location.href=p.url;

        mOrbit.appendChild(moon);
        planet.appendChild(mOrbit);
      });

      orbit.appendChild(planet);
      sys.appendChild(orbit);
    });

    world.appendChild(sys);
    x+=spacing;
  });

  update();
}
</script>

</body>
</html>
