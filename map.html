<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KS Solar Sitemap</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#02040b;
  --sun:#ffb703;
  --planet:#6d7cff;
  --moon:#ffffff;
  --orbit:rgba(255,255,255,.12);
}

*{box-sizing:border-box}

body{
  margin:0;
  overflow:hidden;
  background:radial-gradient(circle at center,#0b1030,#02040b);
  font-family:system-ui;
  color:white;
}

/* MAP */
#map{
  width:100vw;
  height:100vh;
  position:relative;
  touch-action:none;
}
#world{
  position:absolute;
  left:50%;
  top:50%;
  transform-origin:0 0;
}

/* SYSTEM */
.system{
  position:absolute;
}

/* SUN */
.sun{
  width:200px;
  height:200px;
  border-radius:50%;
  background:radial-gradient(circle,#ffd166,#ff9f1c);
  box-shadow:0 0 80px rgba(255,183,3,.9);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-weight:900;
  font-size:20px;
}

/* PLANET ORBIT */
.planet-orbit{
  position:absolute;
  border:1px dashed var(--orbit);
  border-radius:50%;
}

/* PLANET */
.planet{
  position:absolute;
  width:110px;
  height:110px;
  border-radius:50%;
  background:radial-gradient(circle,#9aa8ff,#4a5cff);
  box-shadow:0 0 35px rgba(109,124,255,.9);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:13px;
  font-weight:800;
  padding:10px;
}

/* MOON ORBIT */
.moon-orbit{
  position:absolute;
  border:1px dotted rgba(255,255,255,.2);
  border-radius:50%;
}

/* MOON */
.moon{
  position:absolute;
  width:44px;
  height:44px;
  border-radius:50%;
  background:radial-gradient(circle,#fff,#ccc);
  box-shadow:0 0 14px white;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:9px;
  font-weight:700;
  padding:4px;
}
.moon:hover{
  transform:scale(1.3);
  box-shadow:0 0 25px var(--planet);
}

/* ROTATION */
.spin-slow{animation:spin 70s linear infinite}
.spin-mid{animation:spin 45s linear infinite}
.spin-fast{animation:spin 25s linear infinite}

@keyframes spin{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}
</style>
</head>

<body>

<div id="map">
  <div id="world"></div>
</div>

<script>
const map=document.getElementById("map");
const world=document.getElementById("world");

/* CAMERA STATE */
let scale=0.45;            // 🌍 EARTH VIEW DEFAULT
let dx=0,dy=0;
let startX,startY,drag=false;
let lastDist=null;

/* UPDATE */
function update(){
  world.style.transform=
    `translate(${dx}px,${dy}px) scale(${scale})`;
}

/* MOUSE PAN */
map.onmousedown=e=>{
  drag=true;
  startX=e.clientX-dx;
  startY=e.clientY-dy;
};
window.onmouseup=()=>drag=false;
window.onmousemove=e=>{
  if(!drag)return;
  dx=e.clientX-startX;
  dy=e.clientY-startY;
  update();
};

/* WHEEL ZOOM */
map.onwheel=e=>{
  e.preventDefault();
  scale+=e.deltaY*-0.001;
  scale=Math.min(Math.max(.25,scale),2);
  update();
};

/* PINCH ZOOM */
map.addEventListener("touchmove",e=>{
  if(e.touches.length===2){
    e.preventDefault();
    const dxT=e.touches[0].clientX-e.touches[1].clientX;
    const dyT=e.touches[0].clientY-e.touches[1].clientY;
    const dist=Math.hypot(dxT,dyT);

    if(lastDist){
      scale+=(dist-lastDist)*0.002;
      scale=Math.min(Math.max(.25,scale),2);
      update();
    }
    lastDist=dist;
  }
},{passive:false});

map.addEventListener("touchend",()=>lastDist=null);

/* LOAD DATA */
fetch("sitemap.json")
.then(r=>r.json())
.then(build);

function build(data){
  const spacing=1300;
  let x=-(data.length-1)*spacing/2;

  data.forEach(cat=>{
    const sys=document.createElement("div");
    sys.className="system";
    sys.style.left=x+"px";
    sys.style.top="0px";

    const sun=document.createElement("div");
    sun.className="sun";
    sun.innerHTML=cat.icon+"<br>"+cat.category;
    sys.appendChild(sun);

    cat.sections.forEach((sec,i)=>{
      const orbitSize=380+i*220;

      const pOrbit=document.createElement("div");
      pOrbit.className="planet-orbit spin-slow";
      pOrbit.style.width=orbitSize+"px";
      pOrbit.style.height=orbitSize+"px";
      pOrbit.style.left=100-orbitSize/2+"px";
      pOrbit.style.top=100-orbitSize/2+"px";

      const planet=document.createElement("div");
      planet.className="planet";
      planet.style.left=orbitSize/2-55+"px";
      planet.style.top="-55px";
      planet.textContent=sec.title;

      sec.pages.forEach((p,j)=>{
        const mOrbitSize=120+(j*70);
        const mOrbit=document.createElement("div");
        mOrbit.className="moon-orbit spin-fast";
        mOrbit.style.width=mOrbitSize+"px";
        mOrbit.style.height=mOrbitSize+"px";
        mOrbit.style.left=55-mOrbitSize/2+"px";
        mOrbit.style.top=55-mOrbitSize/2+"px";

        const moon=document.createElement("div");
        moon.className="moon";
        moon.textContent=p.name;
        moon.onclick=()=>location.href=p.url;

        moon.style.left=mOrbitSize/2-22+"px";
        moon.style.top="-22px";

        mOrbit.appendChild(moon);
        planet.appendChild(mOrbit);
      });

      pOrbit.appendChild(planet);
      sys.appendChild(pOrbit);
    });

    world.appendChild(sys);
    x+=spacing;
  });

  update(); // initial earth-view
}
</script>

</body>
</html>
