<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Website Sitemap</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#0b0f1a;
  --card:#141a2b;
  --soft:#1b2340;
  --accent:#6d7cff;
  --text:#ffffff;
  --muted:#aab0d6;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
}

header{
  padding:20px;
  text-align:center;
  font-size:22px;
  font-weight:700;
  background:linear-gradient(90deg,var(--accent),#9c6bff);
}

#sitemap{
  padding:20px;
  display:grid;
  gap:24px;
}

/* CATEGORY */
.category{
  background:var(--card);
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 20px 40px rgba(0,0,0,.35);
  animation:fadeUp .6s ease both;
}

.cat-header{
  display:flex;
  align-items:center;
  gap:10px;
  padding:16px 20px;
  font-size:18px;
  font-weight:700;
  background:var(--soft);
}

.cat-icon{
  font-size:22px;
}

/* SECTION */
.section{
  padding:16px 20px;
}

.section-title{
  font-size:14px;
  color:var(--muted);
  font-weight:600;
  margin-bottom:10px;
}

/* PAGES */
.pages{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:12px;
}

.page{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 14px;
  background:#10162a;
  border-radius:12px;
  text-decoration:none;
  color:var(--text);
  transition:.25s ease;
}

.page:hover{
  transform:translateY(-3px) scale(1.02);
  background:#192150;
}

.page img{
  width:34px;
  height:34px;
  object-fit:contain;
  border-radius:8px;
  background:#000;
  padding:4px;
}

.page span{
  font-size:14px;
  font-weight:600;
}

/* ANIMATION */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:none}
}

/* MOBILE */
@media(max-width:600px){
  header{font-size:18px}
  .pages{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>🌐 Website Sitemap</header>
<div id="sitemap"></div>

<script>
fetch("sitemap.json")
  .then(res => res.json())
  .then(data => renderSitemap(data))
  .catch(err => {
    document.getElementById("sitemap").innerHTML =
      "<p style='color:red'>Failed to load sitemap.json</p>";
    console.error(err);
  });

function renderSitemap(data){
  const root = document.getElementById("sitemap");

  data.forEach(cat=>{
    const catDiv = document.createElement("div");
    catDiv.className = "category";

    catDiv.innerHTML = `
      <div class="cat-header">
        <span class="cat-icon">${cat.icon || "📁"}</span>
        <span>${cat.category}</span>
      </div>
    `;

    cat.sections.forEach(sec=>{
      const secDiv = document.createElement("div");
      secDiv.className = "section";

      secDiv.innerHTML = `<div class="section-title">${sec.title}</div>`;
      const pagesDiv = document.createElement("div");
      pagesDiv.className = "pages";

      sec.pages.forEach(p=>{
        const a = document.createElement("a");
        a.className = "page";
        a.href = p.url;
        a.innerHTML = `
          <img src="${p.logo}" alt="">
          <span>${p.name}</span>
        `;
        pagesDiv.appendChild(a);
      });

      secDiv.appendChild(pagesDiv);
      catDiv.appendChild(secDiv);
    });

    root.appendChild(catDiv);
  });
}
</script>

</body>
</html>
