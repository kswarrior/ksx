<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KS Orbit Sitemap</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{
  --bg:#04060d;
  --core:#7b6cff;
  --ring:rgba(255,255,255,.08);
  --node:#ffffff;
  --glow:#7b6cff;
}

*{box-sizing:border-box}

body{
  margin:0;
  overflow:hidden;
  background:radial-gradient(circle at center,#0b1030,#02040a);
  font-family:system-ui;
  color:white;
}

/* MAP */
#map{
  width:100vw;
  height:100vh;
  position:relative;
  touch-action:none;
}
#world{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(1);
  transform-origin:0 0;
}

/* SYSTEM */
.system{
  position:absolute;
}

/* CORE */
.core{
  width:140px;
  height:140px;
  border-radius:50%;
  background:radial-gradient(circle,#9c8cff,#5b4cff);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  text-align:center;
  box-shadow:0 0 40px var(--glow);
}

/* ORBIT */
.orbit{
  position:absolute;
  border:1px dashed var(--ring);
  border-radius:50%;
  animation:spin 40s linear infinite;
}

/* STAR */
.star{
  position:absolute;
  width:10px;
  height:10px;
  background:var(--node);
  border-radius:50%;
  box-shadow:0 0 10px white;
  cursor:pointer;
  transition:.25s;
}
.star:hover{
  transform:scale(1.8);
  box-shadow:0 0 20px var(--glow);
}

/* LABEL */
.label{
  position:absolute;
  top:14px;
  left:14px;
  font-size:12px;
  white-space:nowrap;
  opacity:.8;
}

/* ANIM */
@keyframes spin{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}
</style>
</head>

<body>

<div id="map">
  <div id="world"></div>
</div>

<script>
const world=document.getElementById("world");
let scale=1,dx=0,dy=0,startX,startY,drag=false;

/* PAN */
map.onmousedown=e=>{drag=true;startX=e.clientX-dx;startY=e.clientY-dy;}
window.onmouseup=()=>drag=false;
window.onmousemove=e=>{
  if(!drag)return;
  dx=e.clientX-startX;
  dy=e.clientY-startY;
  update();
};

/* ZOOM */
map.onwheel=e=>{
  e.preventDefault();
  scale+=e.deltaY*-0.001;
  scale=Math.min(Math.max(.4,scale),2);
  update();
};

function update(){
  world.style.transform=`translate(${dx}px,${dy}px) scale(${scale})`;
}

/* LOAD DATA */
fetch("sitemap.json")
.then(r=>r.json())
.then(draw);

function draw(data){
  let offsetX=0;

  data.forEach(cat=>{
    const sys=document.createElement("div");
    sys.className="system";
    sys.style.left=offsetX+"px";
    sys.style.top="0px";

    const core=document.createElement("div");
    core.className="core";
    core.innerHTML=cat.icon+"<br>"+cat.category;
    sys.appendChild(core);

    cat.sections.forEach((sec,i)=>{
      const size=260+(i*140);
      const orbit=document.createElement("div");
      orbit.className="orbit";
      orbit.style.width=size+"px";
      orbit.style.height=size+"px";
      orbit.style.left=70-size/2+"px";
      orbit.style.top=70-size/2+"px";
      orbit.style.animationDuration=40+i*10+"s";

      sec.pages.forEach((p,j)=>{
        const star=document.createElement("div");
        star.className="star";
        const angle=(360/sec.pages.length)*j;
        star.style.left=size/2+Math.cos(angle*Math.PI/180)*(size/2)+"px";
        star.style.top=size/2+Math.sin(angle*Math.PI/180)*(size/2)+"px";
        star.onclick=()=>location.href=p.url;

        const label=document.createElement("div");
        label.className="label";
        label.textContent=p.name;
        star.appendChild(label);
        orbit.appendChild(star);
      });

      sys.appendChild(orbit);
    });

    world.appendChild(sys);
    offsetX+=900;
  });
}
</script>

</body>
</html>
