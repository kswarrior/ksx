<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Visual Sitemap Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#05070f;
  --card:#141a2b;
  --accent:#6d7cff;
  --text:#fff;
  --line:rgba(255,255,255,.15);
}

*{box-sizing:border-box}

body{
  margin:0;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui;
}

/* MAP AREA */
#map{
  width:100vw;
  height:100vh;
  position:relative;
  overflow:hidden;
  touch-action:none;
}

/* WORLD */
#world{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) scale(1);
  transform-origin:0 0;
}

/* NODES */
.node{
  position:absolute;
  background:var(--card);
  padding:12px 16px;
  border-radius:14px;
  white-space:nowrap;
  box-shadow:0 15px 40px rgba(0,0,0,.5);
  animation:pop .4s ease both;
}

.category{
  font-size:18px;
  font-weight:700;
  background:linear-gradient(135deg,#6d7cff,#9b6cff);
}

.section{
  font-size:14px;
  opacity:.9;
}

.page{
  font-size:13px;
  cursor:pointer;
  transition:.2s;
}

.page:hover{
  background:#202a60;
  transform:scale(1.05);
}

/* LINES */
.line{
  position:absolute;
  background:var(--line);
  transform-origin:left center;
  height:2px;
}

/* ANIM */
@keyframes pop{
  from{opacity:0;transform:scale(.7)}
  to{opacity:1;transform:scale(1)}
}
</style>
</head>

<body>

<div id="map">
  <div id="world"></div>
</div>

<script>
const world = document.getElementById("world");
let scale = 1, posX = 0, posY = 0;
let dragging = false, startX, startY;

/* PAN */
map.addEventListener("mousedown",e=>{
  dragging=true;
  startX=e.clientX-posX;
  startY=e.clientY-posY;
});
window.addEventListener("mouseup",()=>dragging=false);
window.addEventListener("mousemove",e=>{
  if(!dragging) return;
  posX=e.clientX-startX;
  posY=e.clientY-startY;
  update();
});

/* TOUCH PAN */
map.addEventListener("touchstart",e=>{
  dragging=true;
  startX=e.touches[0].clientX-posX;
  startY=e.touches[0].clientY-posY;
});
map.addEventListener("touchend",()=>dragging=false);
map.addEventListener("touchmove",e=>{
  if(!dragging) return;
  posX=e.touches[0].clientX-startX;
  posY=e.touches[0].clientY-startY;
  update();
});

/* ZOOM */
map.addEventListener("wheel",e=>{
  e.preventDefault();
  scale += e.deltaY * -0.001;
  scale = Math.min(Math.max(.4,scale),2);
  update();
},{passive:false});

function update(){
  world.style.transform =
    `translate(${posX}px,${posY}px) scale(${scale})`;
}

/* LOAD SITEMAP */
fetch("sitemap.json")
.then(r=>r.json())
.then(drawMap);

function drawMap(data){
  let x = 0;

  data.forEach(cat=>{
    const catNode = node(cat.icon+" "+cat.category,"category",x,0);
    let y = 120;

    cat.sections.forEach(sec=>{
      const secNode = node(sec.title,"section",x+280,y);
      line(catNode,secNode);

      let py = y + 70;
      sec.pages.forEach(p=>{
        const pageNode = node(p.name,"page",x+560,py);
        pageNode.onclick=()=>location.href=p.url;
        line(secNode,pageNode);
        py += 60;
      });

      y += Math.max(140,sec.pages.length*60);
    });

    x += 850;
  });
}

function node(text,cls,x,y){
  const d=document.createElement("div");
  d.className="node "+cls;
  d.textContent=text;
  d.style.left=x+"px";
  d.style.top=y+"px";
  world.appendChild(d);
  return d;
}

function line(a,b){
  const l=document.createElement("div");
  l.className="line";
  const ax=a.offsetLeft+a.offsetWidth;
  const ay=a.offsetTop+a.offsetHeight/2;
  const bx=b.offsetLeft;
  const by=b.offsetTop+b.offsetHeight/2;
  const len=Math.hypot(bx-ax,by-ay);
  const ang=Math.atan2(by-ay,bx-ax);
  l.style.left=ax+"px";
  l.style.top=ay+"px";
  l.style.width=len+"px";
  l.style.transform=`rotate(${ang}rad)`;
  world.appendChild(l);
}
</script>

</body>
</html>
