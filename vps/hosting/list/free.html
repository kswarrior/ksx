<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free VPS List</title>

<style>
:root{
  --bg:#000;
  --card:#0f0f18;
  --border:rgba(255,255,255,.12);
  --text:#f8f9fa;
  --muted:#a0a0b0;
  --yes:#4ade80;
  --no:#ef4444;
  --radius:14px;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  background:linear-gradient(135deg,#000,#0a0a12);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}

header{
  text-align:center;
  padding:25px 15px;
  font-size:26px;
  font-weight:900;
}

main{
  max-width:1200px;
  margin:auto;
  padding:10px;
  display:flex;
  flex-wrap:wrap;
  gap:15px;
  justify-content:center;
}

.cards{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  width:100%;
  max-width:360px;
  display:flex;
  flex-direction:column;
  gap:10px;
  transition:.3s;
}

.cards:hover{
  transform:scale(1.03);
}

.name{
  font-size:18px;
  font-weight:900;
}

.info{
  font-size:14px;
  color:var(--muted);
}

.all-info{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.yes{color:var(--yes);font-weight:800}
.no{color:var(--no);font-weight:800}

.visit{
  margin-top:8px;
  padding:10px;
  border-radius:10px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--text);
  font-weight:900;
  cursor:pointer;
}

.visit:hover{
  background:rgba(255,255,255,.08);
}

footer{
  text-align:center;
  padding:20px;
  color:var(--muted);
  font-size:14px;
}
</style>
</head>

<body>
<script src="open-main-page.js"></script>
<header>Free VPS List</header>

<main id="vpsList"></main>

<footer>© 2025 by KS Warrior</footer>
<script>
const vpsList = document.getElementById("vpsList");

fetch("free.json")
  .then(res => res.json())
  .then(data => renderVPS(data));

function renderVPS(list){
  vpsList.innerHTML = "";

  list.forEach(vps => {
    vpsList.innerHTML += `
      <section class="cards">
        <div class="name">${vps.name}</div>

        <div class="all-info">
          <div class="info">
            RAM: ${vps.ram}GB | CPU: ${vps.cpu} | Disk: ${vps.disk}
          </div>

          <div class="info">
            <span class="${vps.renew ? "yes" : "no"}">Renew</span> |
            <span class="${vps.sudo ? "yes" : "no"}">Sudo</span> |
            <span class="${vps.alwaysOn ? "yes" : "no"}">24/7</span>
          </div>

          <div class="info">${vps.location}</div>
        </div>

        <button class="visit" onclick="window.open('${vps.link}','_blank')">
          Visit
        </button>
      </section>
    `;
  });
}
</script>
</body>
</html>
